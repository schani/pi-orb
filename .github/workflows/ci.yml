name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-plane-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Check image-build disk headroom
        run: |
          df -h .
          available=$(df -PB1 . | awk 'NR == 2 { print $4 }')
          if ! (( available >= 15 * 1024 * 1024 * 1024 )); then
            echo 'Control-plane image build requires 15 GiB free disk.' >&2
            exit 1
          fi

      - name: Build control-plane image
        run: docker build -f apps/control-plane/Dockerfile -t "pi-orb-control-plane:ci-$GITHUB_SHA" .

      - name: Prove packaged worker, Git and skills without network
        run: |
          set -euo pipefail
          container=$(docker create --network none "pi-orb-control-plane:ci-$GITHUB_SHA" node /app/image-proof.mjs)
          trap 'docker rm -f "$container"' EXIT
          docker cp scripts/control-plane-image-proof.mjs "$container:/app/image-proof.mjs"
          docker start --attach "$container" 2>&1 | tee "$RUNNER_TEMP/control-plane-image-proof.log"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
      - name: Report image and disk provenance
        if: always()
        run: |
          df -h
          docker system df
          docker image inspect "pi-orb-control-plane:ci-$GITHUB_SHA" --format '{{.Id}} {{.Size}}' || true
      - name: Upload image proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: control-plane-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-plane-image-proof.log
          if-no-files-found: ignore
          retention-days: 14

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PI_ORB_TEST_DATABASE_URL: postgres://qualification:qualification@127.0.0.1:5432/qualification
      PI_ORB_DURABLE_PG_TEST_URL: postgres://qualification:qualification@127.0.0.1:5432/qualification

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tofu_1.13.2_linux_amd64.zip"
          curl --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.13.2/tofu_1.13.2_linux_amd64.zip -o "$archive"
          printf '723bebb0df8411daff1e5fc3862e28ff5581fe5634087f4c29a9aa41d78208b5  %s\n' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tofu-bin"
          unzip -q "$archive" tofu -d "$RUNNER_TEMP/tofu-bin"
          echo "$RUNNER_TEMP/tofu-bin" >> "$GITHUB_PATH"

      - name: Start PostgreSQL qualification fixture
        run: |
          set -euo pipefail
          docker build -f infra/postgres-test/Dockerfile -t pi-orb-postgres-test:17.11-textsearch1.3.1 .
          docker run --detach --name qualification-postgres \
            -e POSTGRES_USER=qualification -e POSTGRES_PASSWORD=qualification -e POSTGRES_DB=qualification \
            -p 127.0.0.1:5432:5432 pi-orb-postgres-test:17.11-textsearch1.3.1
          for attempt in $(seq 1 60); do
            if docker exec qualification-postgres pg_isready -h 127.0.0.1 -U qualification -d qualification; then
              docker exec qualification-postgres psql -U qualification -d qualification -v ON_ERROR_STOP=1 \
                -c "SELECT version(), current_setting('shared_preload_libraries'); SELECT default_version FROM pg_available_extensions WHERE name = 'pg_textsearch';"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Test foundation contracts
        run: infra/foundation/test-tofu.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run --maxWorkers=1 --no-file-parallelism && npm run test:infra

      - name: Collect PostgreSQL qualification evidence
        if: always()
        run: |
          docker logs qualification-postgres > "$RUNNER_TEMP/postgres-qualification.log" 2>&1 || true
          docker inspect qualification-postgres >> "$RUNNER_TEMP/postgres-qualification.log" 2>&1 || true
          docker rm -fv qualification-postgres || true

      - name: Upload PostgreSQL qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: postgres-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postgres-qualification.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-dst-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/*.json
          if-no-files-found: ignore
          retention-days: 14
