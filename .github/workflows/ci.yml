name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dst-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/*.json
          if-no-files-found: ignore
          retention-days: 14
