# Four isolated runners execute serial shards against job-owned fake OpenAI.
name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PI_ORB_E2E_BACKEND: docker
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Check Docker disk budget
        run: |
          df -h
          test "$(df -Pk . | awk 'NR == 2 {print $4}')" -ge 15728640

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build E2E runtime image
        id: runtime-image
        timeout-minutes: 10
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/orb-runtime/Dockerfile
          platforms: linux/amd64
          tags: pi-orb-runtime:dev
          load: true
          push: false

      - name: Report runtime image build
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_ID: ${{ steps.runtime-image.outputs.imageid }}
        run: |
          printf '### E2E runtime image\n\nSource: `%s`\n\nImage: `%s`\n' "$SOURCE_SHA" "$IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Run end-to-end test
        env:
          DEBUG: pw:browser
          PI_ORB_LOCAL_FAKE_EVIDENCE: ${{ runner.temp }}/local-fake-provider
          PI_ORB_E2E_RUNTIME_IMAGE_ID: ${{ steps.runtime-image.outputs.imageid }}
        run: node scripts/local-fake-provider.mjs -- npm run test:e2e -- --project frontend --project provider --project postgres --shard=${{ matrix.shard }}/4

      - name: Upload nested scenario failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: nested-docker-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/stopped-cache-*/evidence.json
            test-failures/stopped-cache-*/failure.png
            test-failures/stopped-cache-*/trace.zip
            test-failures/full-slice-orb-*/failure.txt
            test-failures/full-slice-orb-*/control-plane.log
            test-failures/full-slice-orb-*/failing-orb.json
            test-failures/full-slice-orb-*/failing-history.json
            test-failures/full-slice-orb-*/capture-outcomes.json
            .context/empty-live-reasoning/simplification/*-first-failure/error.txt
            .context/empty-live-reasoning/simplification/*-first-failure/frames.json
            .context/empty-live-reasoning/simplification/*-first-failure/detail-requests.json
            .context/empty-live-reasoning/simplification/*-first-failure/page-errors.json
            .context/empty-live-reasoning/simplification/*-first-failure/page.html
            .context/empty-live-reasoning/simplification/*-first-failure/page.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload local provider provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: local-fake-docker-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-fake-provider/manifest.json
            ${{ runner.temp }}/local-fake-provider/phases.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report Docker disk use
        if: always()
        run: |
          df -h
          docker system df

      - name: Upload Durable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-durable-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/cross-axis-*/failure.txt
            test-failures/cross-axis-*/result.json
            test-failures/cross-axis-*/execution-ready.json
            test-failures/cross-axis-*/pin.json
            test-failures/cross-axis-*/control-plane.log
            test-failures/cross-axis-*/relay-requests.json
            test-failures/cross-axis-*/model-requests.json
            test-failures/cross-axis-*/retained-docker.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Capture browser failure host diagnostics
        if: failure()
        run: |
          df -h
          free -m
          ps -eo pid,ppid,comm,rss
          sudo dmesg --ctime | grep -Ei 'webkit|MiniBrowser|segfault|out of memory|oom-kill|killed process' || true
          dpkg-query -W 'libglib2.0-*' 'libsoup-*' || true

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-dst-failure-traces-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/*.json
            test-failures/profile-login/failure.json
            test-failures/full-slice-upload/failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload missing-orb navigation failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-missing-orb-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/missing-orb-*/failure.json
            test-failures/missing-orb-*/desktop.png
            test-failures/missing-orb-*/geometry.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lazy-return browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-lazy-return-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/lazy-return-*/failure.json
            test-failures/lazy-return-*/failure.png
            test-failures/lazy-return-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload harness browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-browser-failure-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/claude-production-hardening/browser-failure
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
