      - name: Restore npm cache without saving
        id: npm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Report npm cache match
        env:
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.npm-cache.outputs.cache-matched-key }}
        run: printf 'npm cache hit=%s key=%s; exports disabled\n' "$CACHE_HIT" "$CACHE_MATCH"

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Run central process end-to-end tests
        env:
          PI_ORB_LOCAL_FAKE_EVIDENCE: ${{ runner.temp }}/local-fake-provider
        run: node scripts/local-fake-provider.mjs -- npm run test:e2e -- --project lifecycle --shard=${{ matrix.shard }}/4

      - name: Upload local provider provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: local-fake-process-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-fake-provider/manifest.json
            ${{ runner.temp }}/local-fake-provider/phases.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: central-process-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/*.json
            .context/cross-orb/messaging/*/failure.txt
            .context/cross-orb/messaging/*/manifest.json
            .context/cross-orb/messaging/*/fake-requests.json
            .context/cross-orb/messaging/*/control-plane.log
            .context/cross-orb/messaging/*/*-native-history.json
            test-failures/profile-login/failure.json
            test-failures/full-slice-upload/failure.json
            test-failures/subagent-*/failure.json
            test-failures/lazy-return-*/failure.json
            test-failures/lazy-return-*/failure.png
            test-failures/lazy-return-*/trace.zip
            test-failures/cross-axis-*/failure.txt
            test-failures/cross-axis-*/result.json
            test-failures/cross-axis-*/pin.json
            test-failures/cross-axis-*/execution-ready.json
            test-failures/cross-axis-*/control-plane.log
            test-failures/cross-axis-*/relay-requests.json
            test-failures/cross-axis-*/model-requests.json
            test-failures/cross-axis-*/retained-docker.json
            test-failures/durable-process-*/failure.txt
            test-failures/durable-process-*/control-plane.log
            test-failures/durable-process-*/model-requests.json
            test-failures/durable-process-*/login-view.json
            test-failures/durable-process-*/gated-view.json
            test-failures/durable-process-*/acceptance-history.json
            test-failures/durable-process-*/teardown.json
            test-failures/durable-independent-process/*/failure.txt
            test-failures/durable-independent-process/*/control-plane.log
            test-failures/durable-independent-process/*/browser-frames.json
            test-failures/durable-independent-process/*/model-requests.json
            test-failures/durable-independent-process/*/original-model-requests.json
            test-failures/durable-independent-process/*/model-stream-fence.json
            test-failures/durable-independent-process/*/barrier.json
            test-failures/durable-independent-process/*/waiting-phases.json
            test-failures/durable-independent-process/*/held-setup-readiness.json
            test-failures/durable-independent-process/*/before-ready-history.json
            test-failures/durable-independent-process/*/resource-ready-history.json
            test-failures/durable-independent-process/*/final-view.json
            test-failures/durable-independent-process/*/final-history.json
            test-failures/durable-independent-process/*/spill-history.json
            test-failures/durable-independent-process/*/capture-outcomes.json
            test-failures/durable-independent-process/*/teardown-outcomes.json
            test-failures/durable-independent-process/*/early-output.png
            test-failures/durable-independent-process/*/waiting.png
            test-failures/durable-independent-process/*/final-page.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  durable-control-plane-image:
    name: Durable control-plane image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f43eff0f84a27eacd48f7aa30d5148e78463778c

      - name: Record frozen payload and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43eff0f84a27eacd48f7aa30d5148e78463778c
          test -z "$(git status --porcelain)"
          printf 'controller=%s ref=%s source=%s\n' "$CONTROLLER_SHA" "$CONTROLLER_REF" "$(git rev-parse HEAD)"
          printf 'runner_image=%s runner_version=%s\n' "$ImageOS" "$ImageVersion"
          git ls-files -z | xargs -0 sha256sum | sha256sum
          sha256sum apps/orb-runtime/Dockerfile package-lock.json

      - name: Check Docker disk budget
        run: |
          df -h
          test "$(df -Pk . | awk 'NR == 2 {print $4}')" -ge 15728640

      - name: Build control-plane image
        run: docker build -f apps/control-plane/Dockerfile -t pi-orb-control-plane:qualification .

      - name: Prove packaged worker, Git and skills without network
        run: |
          set -euo pipefail
          container=$(docker create --network none pi-orb-control-plane:qualification node /app/image-proof.mjs)
          trap 'docker rm -f "$container"' EXIT
          docker cp scripts/control-plane-image-proof.mjs "$container:/app/image-proof.mjs"
          docker start --attach "$container" 2>&1 | tee "$RUNNER_TEMP/control-plane-image-proof.log"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0

      - name: Report image and disk provenance
        if: always()
        run: |
          df -h
          docker system df
          docker image inspect pi-orb-control-plane:qualification --format '{{.Id}} {{.Size}}' || true

      - name: Upload image proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: control-plane-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-plane-image-proof.log
          if-no-files-found: ignore
          retention-days: 14
