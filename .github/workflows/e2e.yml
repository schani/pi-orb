# Full-slice end-to-end test against the fake OpenAI service
# (fake-openai.flingit.run). The dependency on the deployed fake is an
# accepted trade-off. Four isolated runners each execute their shard serially.
name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      webkit_reload_diagnostic:
        description: Capture first native error in frontend shard 1 cohort (10 independent runs, stop on first failure; not qualification)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.6.0'
          cache: npm

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Run end-to-end test
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.webkit_reload_diagnostic) }}
        env:
          DEBUG: pw:browser
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: Diagnose frontend shard 1 cohort
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.webkit_reload_diagnostic && matrix.shard == 1 }}
        env:
          DEBUG: pw:browser
        run: |
          for iteration in {1..10}; do
            echo "Frontend cohort diagnostic iteration ${iteration}/10"
            npm run test:e2e -- --project frontend --shard=1/4 || exit "$?"
          done

      - name: Capture browser failure host diagnostics
        if: failure()
        run: |
          df -h
          free -m
          ps -eo pid,ppid,comm,rss
          sudo dmesg --ctime | grep -Ei 'webkit|MiniBrowser|segfault|out of memory|oom-kill|killed process' || true
          dpkg-query -W 'libglib2.0-*' 'libsoup-*' || true

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-dst-failure-traces-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/*.json
            test-failures/profile-login/failure.json
            test-failures/full-slice-upload/failure.json
            test-failures/subagent-*/failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload missing-orb navigation failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-missing-orb-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/missing-orb-*/failure.json
            test-failures/missing-orb-*/desktop.png
            test-failures/missing-orb-*/geometry.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lazy-return browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-lazy-return-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/lazy-return-*/failure.json
            test-failures/lazy-return-*/failure.png
            test-failures/lazy-return-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
