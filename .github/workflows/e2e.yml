      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.6.0'
          package-manager-cache: false

      - name: Locate npm cache
        id: npm-cache-dir
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        id: npm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Report npm cache match
        env:
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.npm-cache.outputs.cache-matched-key }}
        run: printf 'npm cache hit=%s key=%s; exports disabled\n' "$CACHE_HIT" "$CACHE_MATCH"

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Run shared frontend tests
        env:
          DEBUG: pw:browser
        run: npm run test:e2e -- --project frontend --shard=${{ matrix.shard }}/4

      - name: Capture browser failure host diagnostics
        if: failure()
        run: |
          df -h
          free -m
          ps -eo pid,ppid,comm,rss
          sudo dmesg --ctime | grep -Ei 'webkit|MiniBrowser|segfault|out of memory|oom-kill|killed process' || true
          dpkg-query -W 'libglib2.0-*' 'libsoup-*' || true

      - name: Upload frontend failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: frontend-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/image-collapse-*.json
            test-failures/read-fallback-*.json
            test-failures/stopped-cache-*/evidence.json
            test-failures/stopped-cache-*/failure.png
            test-failures/stopped-cache-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload missing-orb navigation failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-missing-orb-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/missing-orb-*/failure.json
            test-failures/missing-orb-*/desktop.png
            test-failures/missing-orb-*/geometry.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lazy-return browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-lazy-return-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/lazy-return-*/failure.json
            test-failures/lazy-return-*/failure.png
            test-failures/lazy-return-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload harness browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-browser-failure-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context/claude-production-hardening/browser-failure
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  process:
    name: Central process (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
