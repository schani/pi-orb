# Full-slice end-to-end test against the fake OpenAI service
# (fake-openai.flingit.run). The dependency on the deployed fake is an
# accepted trade-off; the serial suite plus setup takes about 32 minutes.
name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Run end-to-end test
        run: npm run test:e2e

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-dst-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/*.json
          if-no-files-found: ignore
          retention-days: 14
