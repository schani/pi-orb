name: Controlled benchmark optimized

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-control-plane-image:
    name: CI control-plane image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f43eff0f84a27eacd48f7aa30d5148e78463778c

      - name: Record frozen payload and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43eff0f84a27eacd48f7aa30d5148e78463778c
          test -z "$(git status --porcelain)"
          printf 'controller=%s ref=%s source=%s\n' "$CONTROLLER_SHA" "$CONTROLLER_REF" "$(git rev-parse HEAD)"
          printf 'runner_image=%s runner_version=%s\n' "$ImageOS" "$ImageVersion"
          git ls-files -z | xargs -0 sha256sum | sha256sum
          sha256sum apps/orb-runtime/Dockerfile package-lock.json

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Check image-build disk headroom
        run: |
          df -h .
          available=$(df -PB1 . | awk 'NR == 2 { print $4 }')
          if ! (( available >= 15 * 1024 * 1024 * 1024 )); then
            echo 'Control-plane image build requires 15 GiB free disk.' >&2
            exit 1
          fi

      - name: Build control-plane image
        run: docker build -f apps/control-plane/Dockerfile -t "pi-orb-control-plane:ci-f43eff0f84a27eacd48f7aa30d5148e78463778c" .

      - name: Report image-build disk usage
        if: always()
        run: |
          df -h .
          docker system df

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f43eff0f84a27eacd48f7aa30d5148e78463778c

      - name: Record frozen payload and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43eff0f84a27eacd48f7aa30d5148e78463778c
          test -z "$(git status --porcelain)"
          printf 'controller=%s ref=%s source=%s\n' "$CONTROLLER_SHA" "$CONTROLLER_REF" "$(git rev-parse HEAD)"
          printf 'runner_image=%s runner_version=%s\n' "$ImageOS" "$ImageVersion"
          git ls-files -z | xargs -0 sha256sum | sha256sum
          sha256sum apps/orb-runtime/Dockerfile package-lock.json

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.6.0'
          package-manager-cache: false


      - name: Locate npm cache
        id: npm-cache-dir
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        id: npm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Report npm cache match
        env:
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.npm-cache.outputs.cache-matched-key }}
        run: printf 'npm cache hit=%s key=%s; exports disabled\n' "$CACHE_HIT" "$CACHE_MATCH"

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Install OpenTofu
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tofu_1.12.6_linux_amd64.zip"
          curl --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip -o "$archive"
          printf '5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8  %s\n' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tofu-bin"
          unzip -q "$archive" tofu -d "$RUNNER_TEMP/tofu-bin"
          echo "$RUNNER_TEMP/tofu-bin" >> "$GITHUB_PATH"

      - name: Test foundation contracts
        run: infra/foundation/test.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test infrastructure contracts
        run: npm run test:infra

  unit:
    name: Unit/DST (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d qualification"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PI_ORB_TEST_DATABASE_URL: postgres://qualification:qualification@127.0.0.1:5432/qualification
      PI_ORB_DURABLE_PG_TEST_URL: postgres://qualification:qualification@127.0.0.1:5432/qualification

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f43eff0f84a27eacd48f7aa30d5148e78463778c

      - name: Record frozen payload and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43eff0f84a27eacd48f7aa30d5148e78463778c
          test -z "$(git status --porcelain)"
          printf 'controller=%s ref=%s source=%s\n' "$CONTROLLER_SHA" "$CONTROLLER_REF" "$(git rev-parse HEAD)"
          printf 'runner_image=%s runner_version=%s\n' "$ImageOS" "$ImageVersion"
          git ls-files -z | xargs -0 sha256sum | sha256sum
          sha256sum apps/orb-runtime/Dockerfile package-lock.json

      - name: Reject tracked deployment credentials, plans and state
        run: python3 infra/artifact_guard.py

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.6.0'
          package-manager-cache: false


      - name: Locate npm cache
        id: npm-cache-dir
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        id: npm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Report npm cache match
        env:
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.npm-cache.outputs.cache-matched-key }}
        run: printf 'npm cache hit=%s key=%s; exports disabled\n' "$CACHE_HIT" "$CACHE_MATCH"

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Test unit and deterministic simulation contracts
        run: npx vitest run --maxWorkers=1 --no-file-parallelism --shard=${{ matrix.shard }}/4

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ci-dst-failure-traces-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/*.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Docker E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PI_ORB_E2E_BACKEND: docker
      PI_ORB_AGENT_BACKEND: host-pi
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: f43eff0f84a27eacd48f7aa30d5148e78463778c

      - name: Record frozen payload and controller identity
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43eff0f84a27eacd48f7aa30d5148e78463778c
          test -z "$(git status --porcelain)"
          printf 'controller=%s ref=%s source=%s\n' "$CONTROLLER_SHA" "$CONTROLLER_REF" "$(git rev-parse HEAD)"
          printf 'runner_image=%s runner_version=%s\n' "$ImageOS" "$ImageVersion"
          git ls-files -z | xargs -0 sha256sum | sha256sum
          sha256sum apps/orb-runtime/Dockerfile package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.6.0'
          package-manager-cache: false


      - name: Locate npm cache
        id: npm-cache-dir
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm cache without saving
        id: npm-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.npm-cache-dir.outputs.path }}
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - name: Report npm cache match
        env:
          CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.npm-cache.outputs.cache-matched-key }}
        run: printf 'npm cache hit=%s key=%s; exports disabled\n' "$CACHE_HIT" "$CACHE_MATCH"

      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt.conf.d/99pi-orb-force-ipv4

      - name: Install native addon prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 build-essential

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned browser engines and system dependencies
        run: npm run test:e2e:install

      - name: Check Docker disk budget
        run: |
          df -h
          test "$(df -Pk . | awk 'NR == 2 {print $4}')" -ge 15728640

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          cache-binary: false

      - name: Build E2E runtime image
        id: runtime-image
        timeout-minutes: 10
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/orb-runtime/Dockerfile
          platforms: linux/amd64
          tags: pi-orb-runtime:dev
          load: true
          push: false
          cache-from: type=gha,scope=e2e-runtime-linux-amd64-v1

      - name: Report runtime image build
        env:
          SOURCE_SHA: f43eff0f84a27eacd48f7aa30d5148e78463778c
          IMAGE_ID: ${{ steps.runtime-image.outputs.imageid }}
          CACHE_WRITE: 'false'
        run: |
          printf '### E2E runtime image\n\nSource: `%s`\n\nImage: `%s`\n\nCache: `e2e-runtime-linux-amd64-v1`; write: `%s`\n' "$SOURCE_SHA" "$IMAGE_ID" "$CACHE_WRITE" >> "$GITHUB_STEP_SUMMARY"

      - name: Run end-to-end test
        env:
          DEBUG: pw:browser
          PI_ORB_LOCAL_FAKE_EVIDENCE: ${{ runner.temp }}/local-fake-provider
          PI_ORB_E2E_RUNTIME_IMAGE_ID: ${{ steps.runtime-image.outputs.imageid }}
        run: node scripts/local-fake-provider.mjs -- npm run test:e2e -- --project lifecycle --shard=${{ matrix.shard }}/4

      - name: Upload local provider provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: local-fake-docker-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/local-fake-provider/manifest.json
            ${{ runner.temp }}/local-fake-provider/phases.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report Docker disk use
        if: always()
        run: |
          df -h
          docker system df

      - name: Upload Durable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-durable-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/cross-axis-*/failure.txt
            test-failures/cross-axis-*/result.json
            test-failures/cross-axis-*/execution-ready.json
            test-failures/cross-axis-*/pin.json
            test-failures/cross-axis-*/control-plane.log
            test-failures/cross-axis-*/relay-requests.json
            test-failures/cross-axis-*/model-requests.json
            test-failures/cross-axis-*/retained-docker.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture browser failure host diagnostics
        if: failure()
        run: |
          df -h
          free -m
          ps -eo pid,ppid,comm,rss
          sudo dmesg --ctime | grep -Ei 'webkit|MiniBrowser|segfault|out of memory|oom-kill|killed process' || true
          dpkg-query -W 'libglib2.0-*' 'libsoup-*' || true

      - name: Upload deterministic failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-dst-failure-traces-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/*.json
            test-failures/profile-login/failure.json
            test-failures/full-slice-upload/failure.json
            test-failures/subagent-*/failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload subagent native transport success audits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: subagent-native-transport-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/subagent-*/success.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
