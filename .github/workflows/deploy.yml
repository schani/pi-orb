name: Deploy

on:
  workflow_dispatch:
    inputs:
      validate_release:
        description: 'Optional: validate an existing release ID or latest; no build, migration or apply'
        required: false
        type: string
        default: ''
      first_consolidation:
        description: 'Retire the three old application services before Google identity migration (downtime)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualify:
    if: github.ref == 'refs/heads/main' && inputs.validate_release == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      evidence: ${{ steps.qualification.outputs.evidence }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Wait for exact-commit main qualification
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "## CI qualification for \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          if evidence=$(python3 -m infra.ci_qualification wait 2> >(tee "$RUNNER_TEMP/qualification.log" >&2)); then
            echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
            printf '\n```json\n%s\n```\n' "$evidence" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nQualification refused; no deployment started.\n```\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/qualification.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  release:
    concurrency:
      group: pi-orb-production-release
      cancel-in-progress: false
    needs: qualify
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.qualify.result == 'success' || inputs.validate_release != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT: playground-dev-6ae7
      REGION: us-central1
      CLOUDSDK_CORE_LOG_HTTP: 'false'
      CLOUDSDK_CORE_VERBOSITY: warning
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact main and reject tracked credential artifacts
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          git checkout -B main "$GITHUB_SHA"
          python3 infra/artifact_guard.py
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.6.0'
          cache: npm
      - name: Use the signed Ubuntu archive
        run: sudo python3 infra/runner_apt.py /etc/apt/sources.list.d/ubuntu.sources

      - name: Install release prerequisites and checksum-pinned OpenTofu
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 curl jq unzip uuid-runtime
          archive="$RUNNER_TEMP/tofu_1.12.6_linux_amd64.zip"
          curl --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip -o "$archive"
          printf '5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8  %s\n' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/tofu-bin"
          unzip -q "$archive" tofu -d "$RUNNER_TEMP/tofu-bin"
          echo "$RUNNER_TEMP/tofu-bin" >> "$GITHUB_PATH"
          docker info >/dev/null
      - name: Authenticate the GitHub deployment identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/1077475695242/locations/global/workloadIdentityPools/pi-orb-github/providers/deploy
          service_account: pi-orb-amp-deployer@playground-dev-6ae7.iam.gserviceaccount.com
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '583.0.0'
          install_components: beta
      - name: Configure keyless registry access
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Verify monitor owner fleet before rollout
        if: inputs.validate_release == ''
        env:
          PI_ORB_USER_ID: ${{ vars.PI_ORB_USER_ID }}
        run: python3 -m infra.rollout_monitor --preflight "$RUNNER_TEMP/rollout-baseline.json"
      - name: Run the authoritative release transaction
        id: release
        env:
          VALIDATE_RELEASE: ${{ inputs.validate_release }}
          FIRST_CONSOLIDATION: ${{ inputs.first_consolidation }}
          TF_VAR_google_client_id: 1077475695242-hs53alaasigvrurtme2j73ej37vqre63.apps.googleusercontent.com
          GH_TOKEN: ${{ github.token }}
          PI_ORB_CI_QUALIFICATION: ${{ needs.qualify.outputs.evidence }}
          PI_ORB_RELEASE_RESULT_DIR: ${{ runner.temp }}/release-result
          PI_ORB_USER_ID: ${{ vars.PI_ORB_USER_ID }}
        run: |
          set -euo pipefail
          args=(--yes)
          if [ -n "$VALIDATE_RELEASE" ]; then args+=(--validate "$VALIDATE_RELEASE"); fi
          if [ "$FIRST_CONSOLIDATION" = true ]; then args+=(--first-consolidation); fi
          exec ./infra/release.sh "${args[@]}"

      - name: Observe central rollout independently for fifteen minutes
        if: inputs.validate_release == ''
        timeout-minutes: 25
        env:
          PI_ORB_USER_ID: ${{ vars.PI_ORB_USER_ID }}
        run: python3 -m infra.rollout_monitor "$RUNNER_TEMP/release-result/release.json" "$RUNNER_TEMP/rollout-monitor.json" "$RUNNER_TEMP/rollout-baseline.json"
      - name: Upload rollout monitor
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: rollout-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollout-monitor.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload missing-orb navigation failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: e2e-missing-orb-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/missing-orb-*/failure.json
            test-failures/missing-orb-*/desktop.png
            test-failures/missing-orb-*/geometry.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lazy-return browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: release-lazy-return-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-failures/lazy-return-*/failure.json
            test-failures/lazy-return-*/failure.png
            test-failures/lazy-return-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload MCP failure summaries
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: release-mcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/mcp-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare allowlisted result and job summary
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          python3 -m infra.release_report "$RUNNER_TEMP/release-result/release.json" "$RUNNER_TEMP/release-artifact" "$GITHUB_SHA" "${RELEASE_OUTCOME:-skipped}" "$GITHUB_STEP_SUMMARY"
      - name: Upload only the validated release record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-artifact/release.json
          if-no-files-found: ignore
          retention-days: 30
