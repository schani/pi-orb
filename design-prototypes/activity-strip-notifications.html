<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-orb · notification steps</title>
<style>
@font-face { font-family: "Iosevka Etoile"; font-weight: 400; src: url("fonts/iosevka-etoile-regular-ad661117aee2.woff2"), url("../apps/web/public/fonts/iosevka-etoile-regular-ad661117aee2.woff2"); }
@font-face { font-family: "Iosevka Etoile"; font-weight: 700; src: url("fonts/iosevka-etoile-bold-94f81a8590a8.woff2"), url("../apps/web/public/fonts/iosevka-etoile-bold-94f81a8590a8.woff2"); }
:root { --w: #fff; --k: #000; --g1: #f2f2f2; --g2: #999; --g3: #555; --ok: #1a7e37; --bad: #b42318; --row: 20px; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--k); background: var(--w); font: 13px/var(--row) "Iosevka Etoile", serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center; height: 32px; padding: 0 12px; background: var(--w); border-bottom: 1px solid var(--k); }
header b { font-weight: 700; }
header nav { display: flex; margin-left: auto; }
header a { height: 22px; margin-left: -1px; padding: 0 8px; color: var(--k); border: 1px solid var(--k); line-height: 20px; text-decoration: none; }
header a:hover { background: var(--g1); }
section { max-width: 920px; margin: 0 auto; padding: 24px 12px 28px; border-bottom: 1px solid var(--g2); scroll-margin-top: 32px; }
h2 { margin: 0; font-size: 13px; font-weight: 700; }
p.why { margin: 0 0 10px; color: var(--g3); }
.frame { border: 1px solid var(--k); }
.rec-you { padding: 9px 12px; color: var(--w); background: var(--k); }
.rec-bd { padding: 4px 12px; }
.prose { margin: 4px 0; }
.row { display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: var(--row); padding: 0 8px; }
.row:hover { background: var(--g1); }
.marker { color: var(--ok); text-align: center; }
.mid { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.label { color: var(--ok); }
.metric { color: var(--g3); }
.dots { display: flex; flex: 1; min-width: 0; height: var(--row); overflow: hidden; }
.d { position: relative; display: flex; flex: none; align-items: center; justify-content: center; width: 12px; cursor: pointer; }
.d::before { width: 6px; height: 6px; border-radius: 50%; background: var(--k); content: ""; }
.d.thinking::before { width: 3px; height: 3px; background: var(--g2); }
.d.failed::before { background: var(--bad); }
.d.running::before { background: var(--ok); box-shadow: 0 0 0 2px var(--w), 0 0 0 3px var(--ok); animation: blink 1s steps(2) infinite; }
.d:hover { background: #ddd; }
.d:hover::before { transform: scale(1.6); }
@keyframes blink { 50% { opacity: .15; } }
.tip { position: fixed; z-index: 20; max-width: 60ch; padding: 0 6px; overflow: hidden; color: var(--w); background: var(--k); text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.tip .bad { color: #ff7a6b; }
.tip .ok { color: #59d77f; }
.tip .src { color: #aaa; }

/* 1 ring: hollow, same size as success */
.o1 .d.note::before { background: none; box-shadow: inset 0 0 0 1px var(--k); }
.o1 .d.note.failed::before { box-shadow: inset 0 0 0 1px var(--bad); }

/* 2 gray: filled, quieter than agent work */
.o2 .d.note::before { background: var(--g2); }
.o2 .d.note.failed::before { background: var(--bad); }

/* 3 diamond: same weight, different shape */
.o3 .d.note::before { width: 6px; height: 6px; border-radius: 0; transform: rotate(45deg); }
.o3 .d.note:hover::before { transform: rotate(45deg) scale(1.6); }

/* 4 raised: an incoming lane above the agent's own steps */
.o4 .d.note { align-items: flex-start; padding-top: 3px; }
.o4 .d.note::before { width: 4px; height: 4px; }

/* 5 tick: a vertical bar that reads as an interruption between agent steps */
.o5 .d.note { width: 7px; }
.o5 .d.note::before { width: 1px; height: 12px; border-radius: 0; }
.o5 .d.note.failed::before { width: 2px; }
.o5 .d.note:hover::before { transform: scaleX(2); }
</style>
</head>
<body>
<header><b>notification steps</b><nav><a href="#o1">1</a><a href="#o2">2</a><a href="#o3">3</a><a href="#o4">4</a><a href="#o5">5</a></nav></header>
<main id="main"></main>
<script>
const OPTIONS = [
  ["o1", "Ring", "Hollow 6px ring. Same size as agent actions; empty because the work happened elsewhere. Failed receipts get a red ring."],
  ["o2", "Gray", "Filled 6px gray dot. Quieter than the agent's own actions, louder than thinking. Failed receipts turn red."],
  ["o3", "Diamond", "Black 6px diamond. Same weight as actions, distinguished by shape alone, so it survives grayscale and color blindness."],
  ["o4", "Raised", "Smaller dot pinned to the top of its cell: an incoming lane above the agent's own steps, readable as a second row at a glance."],
  ["o5", "Tick", "1px vertical bar on a narrower 7px cell. Reads as an interruption between runs of work rather than as work."],
];
const SUB = "Stabilize resume-budget DST";
const RAW = [
  ["n", "Receipts ready: .context/pr267-babysit/resume-guard/RESULTS.md. One-line move only; diff --check clean."],
  ["t", "Clarifying reconnect behavior · Evaluating idle-timer isolation"],
  ["t", "Refreshing visible connection · Updating reset-tab setup"],
  ["t", "Checking annotated replay snapshots · Inspecting control activity API"],
  ["t", "Planning test-client reconnect · Checking client reconnect logic"],
  ["c", "text(await tools.bash({command:\"sed -n '285,345p' apps/control-plane/src/domain/control-state.ts\"}))"],
  ["t", "Selecting reconnect correction · Validating reconnect registration"],
  ["t", "Reviewing replay logic · Authorizing root-gate fix"],
  ["c", "text(await tools.steer_subagent({agent_id:\"5944:c2\",message:\"Authorize root-gate fix\"}))"],
  ["n", "Ignored instrumented pre/post copies now confirm exact root cause dynamically."],
  ["n", "Correction count: 42 lifecycle events pre and 42 post, virtual timestamps exactly equal."],
  ["t", "Reconnecting the test connection · Checking CI test status"],
  ["c", "text(await tools.bash({command:\"gh pr checks 267 --json name,state,link\"}))"],
  ["nf", "Replay worker crashed: trace file truncated at position 16539."],
  ["t", "Inspecting seed configuration"],
  ["c", "text(await tools.bash({command:\"sed -n '70,195p' apps/control-plane/src/testkit/sim.ts\"}))"],
  ["t", "Checking recovery-state invariants · Checking unreachable recovery ordering"],
  ["t", "Checking reconnect behavior · Checking idle guard behavior"],
  ["t", "Checking test harness timing · Adjusting test timing setup"],
  ["t", "Reviewing harness timeout setup · Reviewing recovery assertions"],
  ["t", "Waiting for fresh failure · Monitoring pending test runs"],
  ["t", "Waiting for author"],
  ["c", "text(await tools.get_subagent_result({agent_id:\"5944:c2\"}))"],
  ["n", "Corrected tiny diff ready: lifecycle test +2 reconnect lines, move unregister."],
  ["n", "Pushed 9afe5b0 to same PR267 branch; working tree clean."],
  ["t", "Reviewing corrected source and docs · Updating corrected PR body"],
  ["f", "text(await tools.bash({command:\"gh pr edit 267 --body-file .context/pr267-body.md\"}))"],
  ["t", "Monitoring old-head failure logs · Checking old-run failures"],
  ["t", "Capturing current run table"],
  ["c", "text(await tools.bash({command:\"gh run list --branch fix/claude-initial-input-completion --limit 12\"}))"],
  ["t", "Checking workflow statuses"],
  ["c", "text(await tools.bash({command:\"gh run list --json databaseId,status --jq '.[]'\"}))"],
  ["t", "Monitoring full unit run · Waiting for CI completion"],
  ["t", "Preparing squash commit message · Preparing squash merge"],
  ["r", "text(await tools.bash({command:\"gh pr merge 267 --squash\"}))"],
];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const steps = RAW.map(([k, text]) => ({
  text,
  label: k === "t" ? "thinking" : k[0] === "n" ? "notification" : "codemode",
  cls: k === "t" ? "thinking" : k === "n" ? "note" : k === "nf" ? "note failed" : k === "f" ? "failed" : k === "r" ? "running" : "",
}));
document.getElementById("main").innerHTML = OPTIONS.map(([id, name, why], n) => `
  <section id="${id}"><h2>${n + 1} · ${name}</h2><p class="why">${why}</p>
  <div class="frame ${id}"><div class="rec-you">babysit PR 267</div><div class="rec-bd">
    <div class="prose">CI failed on the resume-budget DST. Delegating root cause.</div>
    <div class="row"><span class="marker">▸</span><span class="mid"><span class="label">activity</span><span class="dots">${steps
      .map((s, i) => `<span class="d ${s.cls}" data-i="${i}"></span>`).join("")}</span></span><span class="metric">${steps.length}</span></div>
  </div></div></section>`).join("");
const tip = document.createElement("div");
tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip);
document.addEventListener("mouseover", (e) => {
  const d = e.target.closest(".d");
  if (!d) { tip.hidden = true; return; }
  const s = steps[+d.dataset.i];
  const tone = s.cls.includes("failed") ? "bad" : s.cls.includes("running") ? "ok" : "";
  tip.innerHTML = `<span class="${tone}">${s.label}</span> · ${esc(s.text)}${s.label === "notification" ? ` <span class="src">· ${SUB}</span>` : ""}`;
  const r = d.getBoundingClientRect();
  tip.hidden = false;
  tip.style.left = `${Math.max(4, r.left - 16)}px`;
  tip.style.top = `${r.top - 22}px`;
});
</script>
</body>
</html>
