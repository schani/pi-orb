<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All projects, inside the orb — five designs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f3;color:#171917;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,textarea{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}button{background:transparent;border:0}button:hover,a:hover{background:#e8e9e3}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #24834c;outline-offset:-2px}header{padding:26px 32px 22px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #222;gap:24px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#666}h1{font-size:27px;letter-spacing:-1.2px;font-weight:500;margin:6px 0 0}header p{margin:0;color:#666;font-size:12px}#tabs{display:flex;border-bottom:1px solid #222}#tabs button{flex:1;text-align:left;padding:13px 20px;border-right:1px solid #aaa;white-space:nowrap}#tabs button:last-child{border:0}#tabs button[aria-pressed=true]{background:#20231f;color:white}#tabs small{opacity:.55;margin-right:10px}.note{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:19px 32px;min-height:103px}.note strong{font-size:12px}.note p{margin:4px 0 0;color:#666;font-size:12px;max-width:680px}.stage{margin:0 24px;border:1px solid #222;background:white;height:660px;display:flex;flex-direction:column;overflow:hidden}.brand{height:30px;flex-shrink:0;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 10px;gap:9px;font-size:11px;letter-spacing:.08em}.brand .pi{width:16px;height:16px;background:#777;color:white;text-align:center;line-height:16px;font-size:14px}.brand span:last-child{margin-left:auto;color:#888;font-size:10px}.workspace{flex:1;min-height:0;display:flex}.navigator{overflow:auto;flex-shrink:0;width:254px;border-right:1px solid #222;background:#fbfbf8}.group{border-bottom:1px solid #bbb;padding-bottom:8px}.project{display:flex;align-items:center;gap:6px;padding:12px 10px 7px;min-height:38px;position:sticky;top:0;background:inherit;z-index:1}.project b{font-size:14px;font-weight:500;flex:1}.project .tools{color:#777}.project button{padding:0 3px}.orb{display:flex;align-items:center;gap:8px;padding:7px 10px;border-left:2px solid transparent;min-width:0;line-height:18px}.orb:hover{background:#e8e9e3}.orb[aria-current=page]{background:#22251f;color:white;border-left-color:#3cae63}.orb .name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.orb .age{font-size:10px;opacity:.55;white-space:nowrap}.tile{width:15px;height:15px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#24834c;color:white;font-size:12px;line-height:1}.tile.stopped{background:#888}.tile.failed{background:#b14234}.tile.starting{background:#a07825}.archive{margin:5px 10px 0;color:#777;font-size:11px}.archive summary{cursor:pointer}.archive .orb{margin-inline:-10px}.empty{padding:7px 12px;color:#888;font-size:11px}.conversation{flex:1;min-width:0;display:flex;flex-direction:column;background:white}.chathead{height:34px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0}.chathead strong{font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.chathead .context{font-size:10px;color:#888;margin-left:auto;white-space:nowrap}.chathead .controls{white-space:nowrap;color:#666}.transcript{overflow:auto;flex:1;min-height:0;padding:28px 0}.turn{padding:15px 28px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}.turn.user{background:#f3f4ef;border-block:1px solid #e5e6de}.speaker{font-size:11px;color:#888}.body{max-width:790px}.body p{margin:0 0 14px}.body p:last-child{margin:0}.body code{background:#f0f1ec;padding:2px 4px}.tool{border:1px solid #bbb;padding:5px 8px;margin:16px 0;color:#666;font-size:11px}.tool span{float:right;color:#888}.diff{border-left:2px solid #24834c;background:#f2f7f0;padding:12px 14px;color:#356747;white-space:pre-wrap;font-size:12px}.composer{border-top:1px solid #222;padding:13px 18px;display:flex;gap:12px;min-height:88px}.composer textarea{border:0;resize:none;flex:1;min-width:0;background:transparent;height:57px;outline:none}.composer span{color:#999;font-size:10px;align-self:end}.footer{padding:13px 25px 28px;display:flex;justify-content:space-between;color:#777;font-size:11px;gap:20px}.mosaic .navigator{width:440px;display:grid;grid-template-columns:1fr 1fr;align-content:start;padding:10px;gap:10px;background:#eeefe8}.mosaic .group{border:1px solid #b9bcb0;background:white;min-width:0;align-self:start}.mosaic .project{position:static;padding-top:8px}.mosaic .orb{padding:7px 7px;font-size:11px}.mosaic .project b{font-size:13px}.atlas .workspace{flex-direction:column}.atlas .navigator{width:100%;height:222px;border-right:0;border-bottom:1px solid #222;display:flex;overflow:auto;background:#f3f4ee}.atlas .group{width:240px;flex-shrink:0;border-right:1px solid #bbb;border-bottom:0;overflow:auto}.atlas .project{background:#f3f4ee}.atlas .transcript{padding-top:16px}.bookends .navigator{width:226px}.bookends .other{border-left:1px solid #222;border-right:0;width:244px;background:#f6f6f1}.bookends .other .project{padding-top:9px}.bookends .other .orb{font-size:11px;padding-block:5px}.bookends .other .project b{font-size:13px}.bookends .turn{padding-inline:18px}.ledger .navigator{width:415px;background:#fbfbf8}.ledger-head{display:flex;padding:10px 12px;border-bottom:1px solid #bbb;color:#777;font-size:10px;gap:16px}.ledger-head button{margin-left:auto;font-size:10px;text-decoration:underline}.ledger .orb{border-bottom:1px solid #e4e5dd;padding-block:10px;font-size:11px}.project-tag{width:86px;flex-shrink:0;font-size:10px;color:#777}.orb[aria-current=page] .project-tag{color:#bdc2b5}.ledger .empty{border-bottom:1px solid #ddd;padding:12px}.ledger .archive{padding-bottom:10px}.navigator .group:has([aria-current=page])>.project b{font-weight:700}.mobile-controls{display:none}.hidden{display:none!important}@media(min-width:1600px){.stage{height:740px}.navigator{width:290px}.mosaic .navigator{width:500px}.atlas .group{flex:1}.bookends .navigator{width:260px}.bookends .other{width:290px}.ledger .navigator{width:460px}}@media(max-width:900px){header{padding:20px;display:block}header p{margin-top:10px}#tabs{overflow:auto}#tabs button{padding:12px;flex:none}.note{padding:16px 20px;gap:18px}.stage{margin:0 12px}.mosaic .navigator{width:330px}.bookends .navigator{width:180px}.bookends .other{width:185px}.ledger .navigator{width:330px}.turn{padding-inline:16px}.chathead .context{display:none}}@media(max-width:650px){h1{font-size:23px}.note{grid-template-columns:1fr;gap:10px;min-height:150px}.stage{height:720px}.mobile-controls{display:block;margin-left:auto;text-decoration:underline;font-size:11px}.brand span:last-child{display:none}.workspace{position:relative}.navigator,.mosaic .navigator,.bookends .navigator,.ledger .navigator{width:100%;border:0}.workspace:not(.browse)>.navigator{display:none}.workspace.browse>.conversation{display:none}.bookends .workspace.browse{flex-direction:column;overflow:auto}.bookends .workspace.browse>.navigator{height:auto;overflow:visible;flex:none}.atlas .workspace:not(.browse)>.navigator{display:flex;height:195px}.atlas .workspace.browse>.navigator{height:100%;flex-wrap:wrap;align-content:start}.atlas .group{width:50%;border-bottom:1px solid #bbb}.footer{display:block}.footer span{display:block;margin-bottom:5px}.project-tag{width:78px}}
</style></head><body>
<header><div><div class="eyebrow">PI-ORB / NAVIGATION STUDIES</div><h1>One conversation. The whole fleet.</h1></div><p>Five interactive directions · sample data<br>Click any orb. Your draft stays with it.</p></header>
<nav id="tabs" aria-label="Design options"></nav>
<section class="note"><div><strong id="heading"></strong><p id="description"></p></div><div><strong id="verdict"></strong><p id="trade"></p></div></section>
<section class="stage" id="stage" aria-label="Interactive product mockup"><div class="brand"><div class="pi">π</div> PI-ORB <button class="mobile-controls" id="mobile">Projects</button><span>LOCAL MOCKUP</span></div><div class="workspace" id="workspace"></div></section>
<div class="footer"><span id="interaction"></span><span>Exploration only · no production changes or network actions</span></div>
<script>
const projects=[{name:'pi-orb',orbs:[['Fleet navigation','busy','12s'],['Runtime reconnects','running','4m'],['Upload receipts','stopped','2h']],archive:['Old dashboard']},{name:'fieldnotes',orbs:[['Offline sync','busy','38s'],['Editor shortcuts','running','19m'],['Search indexing','stopped','3h']],archive:['Import v1']},{name:'homelab',orbs:[['Backup verification','failed','2m'],['Nix flake cleanup','stopped','46m']],archive:[]},{name:'little-atlas',orbs:[['Vector map tiles','running','8m'],['Walking routes','starting','21m'],['Print stylesheet','stopped','1d']],archive:[]},{name:'scratchpad',orbs:[],archive:[]}];
const designs=[['The continuous index','Every project gets a section in one narrow, persistent rail. All sections start open; collapse only what you choose.','The natural evolution','Keeps the conversation wide and stays closest to today’s UI. Large fleets mean vertical travel.','tree','01 / Continuous index','Expand a project or archive; select an orb across projects.'],['The project quilt','A two-column patchwork of project cards beside the conversation. Each project is a distinct, compact island.','More fleet per glance','Much less vertical scanning and strong spatial memory. Costs conversation width; long orb names truncate.','mosaic','02 / Project quilt','Every card is live. Hover truncated names to see them in full.'],['The overhead atlas','Move the entire project board above the conversation. Project columns become a persistent panorama, not a separate dashboard.','Give the conversation its width back','Excellent for wide screens and comparing projects. Trades transcript height for awareness; overflow scrolls sideways.','atlas','03 / Overhead atlas','Scroll the upper board sideways; each project scrolls independently.'],['The bookends','The current project stays on the left. Every other project lives on the right, framing a focused conversation.','Local focus, global peripheral vision','Familiar local navigation with the rest of the fleet in view. Cross-project jumps move project groups between the two sides.','bookends','04 / Bookends','Choose an orb on the right to bring its project into the left rail.'],['The fleet ledger','One compact table of orbs, with project names as a fixed column. Switch between project grouping and recent activity.','For the keyboard-and-table brain','Maximum density, and cross-project work reads as one queue. Less project separation; empty projects need explicit rows.','ledger','05 / Fleet ledger','Toggle “by activity” to interleave projects without filtering any out.']];
let design=Number(location.hash.slice(1))-1;if(!Number.isInteger(design)||design<0||design>4)design=0;let selected='0-0',activity=false,browse=false;const drafts={},collapsed=new Set(),archives=new Set();const $=id=>document.getElementById(id);
function tile(state){return `<span class="tile ${state}" role="img" aria-label="${state}" title="${state}">${({busy:'···',running:'○',stopped:'−',failed:'!',starting:'⌛'})[state]}</span>`}
function row(p,i,arch=false,tag=false){const id=`${p}-${arch?'a':''}${i}`,o=arch?[projects[p].archive[i],'stopped','2w']:projects[p].orbs[i];return `<a href="#orb-${id}" class="orb" data-orb="${id}" ${selected===id?'aria-current="page"':''} title="${projects[p].name} / ${o[0]}">${tag?`<span class="project-tag">${projects[p].name}</span>`:''}${tile(o[1])}<span class="name">${o[0]}</span><span class="age">${o[2]}</span></a>`}
function group(p){const project=projects[p];return `<section class="group"><div class="project"><button data-collapse="${p}" aria-label="${collapsed.has(p)?'Expand':'Collapse'} ${project.name}" aria-expanded="${!collapsed.has(p)}">${collapsed.has(p)?'▸':'▾'}</button><b>${project.name}</b></div><div ${collapsed.has(p)?'class="hidden"':''}>${project.orbs.map((_,i)=>row(p,i)).join('')||'<div class="empty">No orbs</div>'}${project.archive.length?`<details class="archive" data-archive="${p}" ${archives.has(p)?'open':''}><summary>Archive</summary>${project.archive.map((_,i)=>row(p,i,true)).join('')}</details>`:''}</div></section>`}
function conversation(){const [p,index]=selected.split('-'),arch=index.startsWith('a'),orb=arch?[projects[p].archive[Number(index.slice(1))],'stopped']:projects[p].orbs[Number(index)];return `<main class="conversation"><div class="chathead">${tile(orb[1])}<strong>${orb[0]}</strong><span class="context">${projects[p].name}</span></div><div class="transcript"><div class="turn user"><div class="speaker">you</div><div class="body">${selected==='0-0'?'I want to see all my projects and their orbs without leaving this conversation.':'Let’s take a closer look at '+orb[0].toLowerCase()+'.'}</div></div><div class="turn"><div class="speaker">orb</div><div class="body"><p>${selected==='0-0'?'I’ll keep the fleet in view and the conversation in place. Switching projects should feel like selecting another orb, not visiting another page.':'I’ll start with the existing implementation and its tests, then make the smallest change that addresses the problem.'}</p><div class="tool">▸ read · ${projects[p].name}/src <span>3 files</span></div><p>The navigation and conversation can have independent scroll positions. A long transcript won’t push the other projects out of reach.</p><div class="diff">+ persistent fleet navigation\n+ a single selected conversation\n+ drafts scoped to each orb</div></div></div><div class="turn"><div class="speaker">orb</div><div class="body"><p>The selected orb has one home in the index. Stopped orbs remain available alongside running ones.</p></div></div></div><div class="composer"><b>&gt;</b><textarea id="draft" aria-label="Draft for ${orb[0]}" placeholder="Message the orb…"></textarea><span>draft only</span></div></main>`}
function ledger(){let entries=projects.flatMap((p,pi)=>p.orbs.map((o,i)=>({pi,i,age:o[2]})));const age=s=>parseInt(s)*({s:1,m:60,h:3600,d:86400}[s.at(-1)]);if(activity)entries.sort((a,b)=>age(a.age)-age(b.age));return `<div class="ledger-head">PROJECT / ORB<button id="sort">${activity?'by project':'by activity'} ↓</button></div>${entries.map(e=>row(e.pi,e.i,false,true)).join('')}${projects.filter(p=>!p.orbs.length).map(p=>`<div class="empty">${p.name} — No orbs</div>`).join('')}<details class="archive" data-archive="ledger" ${archives.has('ledger')?'open':''}><summary>Archive</summary>${projects.flatMap((p,pi)=>p.archive.map((_,i)=>row(pi,i,true,true))).join('')}</details>`}
function render(){const scrolls=Array.from(document.querySelectorAll('.navigator')).map(e=>[e.scrollTop,e.scrollLeft]);$('stage').className='stage '+designs[design][4];$('workspace').className='workspace'+(browse?' browse':'');const p=Number(selected.split('-')[0]);$('workspace').innerHTML=`<aside class="navigator" aria-label="${design===3?'Current project':'All projects'}">${design===4?ledger():projects.map((_,i)=>(design!==3||i===p)?group(i):'').join('')}</aside>${conversation()}${design===3?`<aside class="navigator other" aria-label="Other projects">${projects.map((_,i)=>i!==p?group(i):'').join('')}</aside>`:''}`;document.querySelectorAll('.navigator').forEach((e,i)=>{e.scrollTop=scrolls[i]?.[0]||0;e.scrollLeft=scrolls[i]?.[1]||0});$('draft').value=drafts[selected]||'';$('draft').oninput=e=>drafts[selected]=e.target.value;document.querySelectorAll('[data-orb]').forEach(a=>a.onclick=e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();selected=a.dataset.orb;collapsed.delete(Number(selected.split('-')[0]));browse=false;render();document.querySelector('[aria-current=page]')?.focus({preventScroll:true})});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.collapse);collapsed.has(n)?collapsed.delete(n):collapsed.add(n);render();document.querySelector(`[data-collapse="${n}"]`)?.focus({preventScroll:true})});document.querySelectorAll('[data-archive]').forEach(d=>d.ontoggle=()=>{const key=d.dataset.archive==='ledger'?'ledger':Number(d.dataset.archive);d.open?archives.add(key):archives.delete(key)});if($('sort'))$('sort').onclick=()=>{activity=!activity;render();$('sort').focus()};$('mobile').textContent=browse?'Conversation':'Projects';}
function select(i){design=i;collapsed.clear();browse=false;history.replaceState(null,'','#'+(i+1));const d=designs[i];$('heading').textContent=d[0];$('description').textContent=d[1];$('verdict').textContent=d[2];$('trade').textContent=d[3];$('interaction').textContent=d[6];document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));render()}
designs.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<small>0${i+1}</small>${d[5].split(' / ')[1]}`;b.onclick=()=>select(i);$('tabs').append(b)});$('mobile').onclick=()=>{browse=!browse;render()};select(design);
</script></body></html>
