<!doctype html>

*{box-sizing:border-box}body{margin:0;background:#efeeeb;color:#20211f;font:13px/20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;padding:7px 12px;background:white;border:1px solid #bdbeb7;border-radius:0}button:hover{background:#efefea}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #347356;outline-offset:2px}button.primary{background:#20211f;color:white;border-color:#20211f}button.quiet{background:transparent;border-color:transparent}button.link{padding:0;border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:#74776f;font-size:11px}button.icon{font-size:17px;padding:3px 8px}button.danger{color:#ab342b}button[aria-pressed=true]{color:white;background:#20211f;border-color:#20211f}input,select,textarea{width:100%;min-width:0;padding:9px 10px;background:white;border:1px solid #bdbeb7;border-radius:0}input::placeholder{color:#a0a199}label{display:block;font-size:11px;color:#666961;margin:0 0 5px}h1,h2,h3,p{margin:0}h1{font-size:18px;line-height:25px}h2{font-size:18px;font-weight:500}h3{font-size:13px;font-weight:500}.board{max-width:1180px;margin:auto;padding:34px 28px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#797c73;text-transform:uppercase}.intro{display:flex;align-items:center;justify-content:space-between;margin:8px 0 24px;gap:15px}.intro p{font-size:11px;color:#797c73}.directions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.directions button{text-align:left;padding:11px 12px;background:transparent}.directions button[aria-pressed=true]{background:#20211f;color:white}.directions small{display:block;opacity:.55;font-size:10px;margin-bottom:5px}.rationale{min-height:66px;padding:17px 0;color:#6d7067;max-width:920px}.stage{position:relative;border:1px solid #d4d5cc;background:#e2e3db;padding:38px;min-height:680px;display:flex;justify-content:center;align-items:flex-start}.app{width:880px;border:1px solid #292b25;background:white;box-shadow:0 15px 35px #00000009}.app-head{padding:22px 24px 0}.project{display:flex;align-items:center;justify-content:space-between}.tabs{display:flex;gap:25px;margin-top:22px;border-bottom:1px solid #d6d8ce}.tabs span{padding-bottom:12px;color:#7a7d73}.tabs .selected{color:#20211f;border-bottom:2px solid #20211f}.list{padding:0 24px}.row{display:flex;align-items:center;gap:12px;min-height:68px;border-bottom:1px solid #dedfd7}.row:last-child{border-bottom:0}.status{width:7px;height:7px;background:#327451;border-radius:50%;flex:none}.status.warn{background:#b67b24}.grow{flex:1;min-width:0}.server{border:0;background:transparent;text-align:left;padding:0;font-weight:600}.server:hover{background:none;text-decoration:underline}.endpoint{font-size:11px;color:#7e8178;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}.tag{font-size:10px;color:#777b70;padding:2px 6px;background:#f3f4ee;white-space:nowrap}.expanded{padding:18px 20px 24px;background:#f5f6f0;border-bottom:1px solid #dedfd7}.expanded .form{max-width:550px}.add-trigger{padding:13px 24px;border-top:1px solid #dedfd7}.composer{border-top:1px solid #dedfd7;padding:18px 24px 24px;background:#f8f9f4}.composer.top{border-top:0;border-bottom:1px solid #dedfd7}.form{max-width:590px}.field{margin-top:15px}.field:first-child{margin-top:0}.field-line{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.field-line label{margin-bottom:5px}.actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:21px}.actions.start{justify-content:flex-start}.actions .spacer{flex:1}.auth{display:flex;margin-top:5px;max-width:360px}.auth button{flex:1}.auth button+button{border-left:0}.secret{margin-top:13px;max-width:360px}.preset-menu{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 0}.preset-menu button{padding:3px 7px;font-size:11px;color:#686c60;background:white}.pair{display:grid;grid-template-columns:180px 1fr;gap:12px}.compact .form{max-width:none}.compact .auth-line{display:flex;gap:12px;align-items:flex-end;margin-top:13px}.compact .auth-line>.field{margin:0;width:180px}.compact .secret{margin:0;flex:1;max-width:none}.compact .actions{margin-top:14px}.compact .inline-presets{margin-top:10px;text-align:right}.progressive .form{max-width:440px}.suggestion{margin-top:6px}.progressive .actions{justify-content:flex-start}.split-actions{border-top:1px solid #daddd0;margin-top:20px;padding-top:15px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.action-token{margin-top:15px}.action-token .secret{max-width:none}.token-line{display:flex;gap:9px;align-items:flex-end}.token-line .secret{flex:1}.sheet-shade{position:absolute;inset:0;background:#20211f55;display:flex;justify-content:center;align-items:flex-start;padding:50px 24px;z-index:2}.sheet{width:475px;background:white;border:1px solid #252820;box-shadow:0 20px 70px #0002;padding:22px 24px 25px;max-height:calc(100% - 85px);overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}.sheet .field:first-child{margin-top:0}.sheet .auth{max-width:none}.sheet .secret{max-width:none}.sheet .sheet-preset{display:flex;justify-content:flex-end;margin-top:7px}.notes{display:flex;justify-content:space-between;gap:18px;margin-top:16px;font-size:11px;color:#74786d}.notes button{font-size:11px}.feedback{min-height:20px;color:#50674c;font-size:11px;margin-top:8px}.error{color:#ac3228;font-size:12px;margin-top:12px}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}.name-prefill{display:flex;gap:8px;align-items:flex-start}.name-prefill input{flex:1}.name-prefill button{margin-top:4px}.edit-title{display:flex;justify-content:space-between;margin-bottom:16px}.edit-title h3{font-weight:600}@media(max-width:900px){.stage{padding:20px}.directions{grid-template-columns:repeat(3,1fr)}.board{padding:24px 16px}.intro{display:block}.intro p{margin-top:5px}}@media(max-width:560px){.stage{padding:0;border:0;min-height:690px}.app-head{padding:18px 16px 0}.list{padding:0 16px}.composer{padding:18px 16px}.pair{grid-template-columns:1fr;gap:15px}.compact .auth-line{display:block}.compact .auth-line>.field{width:auto}.compact .secret{margin-top:13px}.tag{display:none}.row{gap:8px}.project h2{font-size:15px}.directions button{padding:8px}.rationale{min-height:88px}.sheet-shade{padding:20px 10px}.sheet{padding:18px;max-height:calc(100% - 40px)}.notes{display:block}.token-line{display:block}.token-line button{margin-top:12px}.expanded{padding:18px 8px}.name-prefill{display:block}.name-prefill button{margin:5px 0}.split-actions{gap:10px}.intro h1{font-size:17px}}
</style></head><body><main class="board"><div class="eyebrow">MCP workbench · round two</div><div class="intro"><h1>Five new ways to add a server.</h1><p>Interactive mockups · no live connections</p></div><nav class="directions" aria-label="Add flow alternatives"></nav><p class="rationale" id="rationale"></p><div class="stage"><section class="app" aria-label="Project settings mockup"><header class="app-head"><div class="project"><h2>Cloudflare OAuth test</h2><button class="quiet icon" aria-label="Close project settings" onclick="message('Mockup only.')">×</button></div><div class="tabs"><span>General</span><span class="selected">MCPs</span><span>Secrets</span></div></header><div id="content"></div></section><div id="sheet-root"></div></div><div class="notes"><span id="note"></span><button class="quiet" onclick="reset()">Reset mockup</button></div><div class="feedback" id="feedback" role="status"></div></main>
<script>
const directions=[
 ['Simple inline','Add opens a plain, vertical form beneath the connections. Name, endpoint, authentication. Nothing else.','My recommendation. One small form; no branching until you choose a bearer token.'],
 ['Compact ledger','A new editable row joins the inventory. Name and endpoint on one line; authentication beneath.','The densest option. Presets are a quiet optional link, never the starting point.'],
 ['Name first','Start with only a name. Continue to reveal the endpoint and authentication in the same row.','Lowest initial load, one additional step. Recognized names offer a single endpoint suggestion.'],
 ['Choose by action','Enter the name and endpoint, then choose Connect with OAuth or Use a bearer token. No authentication selector.','The final action is the authentication choice. Bearer reveals one secret picker, not a header editor.'],
 ['Focused add sheet','Existing connections still edit inline. Only creation moves into a small, focused sheet.','Best separation between creating and managing. Presets live in an optional fill shortcut.']
];
const initial=[{name:'cloudflare',url:'https://mcp.cloudflare.com/mcp',auth:'oauth',connected:true},{name:'datadog',url:'https://mcp.us5.datadoghq.com/v1/mcp',auth:'oauth',connected:true},{name:'posthog',url:'https://mcp.posthog.com/mcp',auth:'bearer',secret:'POSTHOG_KEY',connected:true}];
let servers=structuredClone(initial),variant=0,adding=true,editing=-1,step=1,presets=false,draft;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(){return{name:'',url:'',auth:'oauth',secret:'',description:''}}
function reset(){servers=structuredClone(initial);adding=true;editing=-1;step=1;presets=false;draft=blank();message('');render()}
function selectVariant(i){variant=i;adding=true;editing=-1;step=1;presets=false;draft=blank();message('');render()}
function message(s){$('#feedback').textContent=s}
function startAdd(){adding=true;editing=-1;presets=false;step=1;draft=blank();render();$('#name')?.focus()}
function cancel(){adding=false;editing=-1;presets=false;render();$('#add-server')?.focus()}
function choose(i){if(editing===i){cancel();return}editing=i;adding=false;presets=false;draft={...servers[i]};render()}
function status(s){return `<span class="status ${s.connected?'':'warn'}" role="img" aria-label="${s.auth==='oauth'?(s.connected?'Connected':'Authorization required'):'Bearer token configured'}"></span>`}
function list(){return `<div class="list">${servers.map((s,i)=>`<div class="row">${status(s)}<div class="grow"><button class="server" onclick="choose(${i})">${esc(s.name)}</button><div class="endpoint">${esc(s.url.replace('https://',''))}</div></div><span class="tag">${s.auth==='oauth'?'OAuth':'Bearer'}</span>${s.auth==='oauth'&&!s.connected?`<button onclick="connect(${i})">Connect</button>`:''}<button class="quiet icon" aria-label="${editing===i?'Collapse':'Edit'} ${esc(s.name)}" onclick="choose(${i})">${editing===i?'−':'+'}</button></div>${editing===i?`<div class="expanded">${editForm(i)}</div>`:''}`).join('')}</div>`}
function presetLink(label='Presets'){return `<button class="link" type="button" aria-expanded="${presets}" onclick="presets=!presets;render()">${label}</button>`}
function presetOptions(){return presets?`<div class="preset-menu">${['Cloudflare','Datadog US5','PostHog'].map((s,i)=>`<button type="button" onclick="usePreset(${i})">${s}</button>`).join('')}</div>`:''}
function fields({shortcut=false,nameOnly=false,compact=false}={}){return `${compact?'<div class="pair">':''}<div class="field"><div class="field-line"><label for="name">Name</label>${shortcut?presetLink():''}</div><input id="name" required pattern="[a-z0-9][a-z0-9_-]*" placeholder="my-server" value="${esc(draft.name)}" oninput="draft.name=this.value;updateSuggestion()" autocomplete="off">${shortcut?presetOptions():''}</div>${nameOnly?'':`<div class="field" ${compact?'style="margin-top:0"':''}><label for="endpoint">Endpoint</label><input id="endpoint" type="url" required pattern="https://.+" placeholder="https://…/mcp" value="${esc(draft.url)}" oninput="draft.url=this.value"></div>`}${compact?'</div>':''}`}
function secret(){return `<div class="secret"><label for="token-secret">Token secret</label><select id="token-secret" required onchange="draft.secret=this.value"><option value="">Select a secret</option>${['POSTHOG_KEY','MCP_TOKEN','DATADOG_TOKEN'].map(s=>`<option ${draft.secret===s?'selected':''}>${s}</option>`).join('')}</select></div>`}
function auth({select=false}={}){return select?`<div class="auth-line"><div class="field"><label for="auth-method">Authentication</label><select id="auth-method" onchange="setAuth(this.value)"><option value="oauth" ${draft.auth==='oauth'?'selected':''}>OAuth</option><option value="bearer" ${draft.auth==='bearer'?'selected':''}>Bearer token</option></select></div>${draft.auth==='bearer'?secret():''}</div>`:`<div class="field"><label>Authentication</label><div class="auth" role="group" aria-label="Authentication"><button type="button" aria-pressed="${draft.auth==='oauth'}" onclick="setAuth('oauth')">OAuth</button><button type="button" aria-pressed="${draft.auth==='bearer'}" onclick="setAuth('bearer')">Bearer token</button></div>${draft.auth==='bearer'?secret():''}</div>`}
function actions(label){return `<div class="actions"><button type="button" class="quiet" onclick="cancel()">Cancel</button><button class="primary" type="submit">${label||(draft.auth==='oauth'?'Add & connect':'Add server')}</button></div>`}
function form(body,classes=''){return `<form class="form ${classes}" onsubmit="event.preventDefault();save()">${body}</form>`}
function composer(){
 if(variant===0)return `<div class="composer">${form(fields({shortcut:true})+auth()+actions())}</div>`;
 if(variant===1)return `<div class="composer compact">${form(fields({compact:true})+auth({select:true})+`<div class="inline-presets">${presetLink('Fill from preset')}${presetOptions()}</div>`+actions())}</div>`;
 if(variant===2)return `<div class="composer progressive">${step===1?`<form class="form" onsubmit="event.preventDefault();step=2;render();$('#endpoint').focus()">${fields({nameOnly:true})}<div class="actions"><button class="primary" type="submit">Continue →</button><button class="quiet" type="button" onclick="cancel()">Cancel</button></div></form>`:form(fields()+`<div class="suggestion" id="suggestion">${suggestion()}</div>`+auth()+actions())}</div>`;
 if(variant===3)return `<div class="composer top">${form(fields({shortcut:true})+(draft.auth==='oauth'?`<div class="split-actions"><button class="primary" type="submit">Connect with OAuth</button><button class="link" type="button" onclick="setAuth('bearer')">Use a bearer token</button><span class="grow"></span><button class="quiet" type="button" onclick="cancel()">Cancel</button></div>`:`<div class="action-token"><div class="token-line">${secret()}<button class="primary" type="submit">Add with token</button></div><div class="actions start"><button class="link" type="button" onclick="setAuth('oauth')">Use OAuth instead</button><span class="spacer"></span><button class="quiet" type="button" onclick="cancel()">Cancel</button></div></div>`))}</div>`;
 return '';
}
function editForm(i){return form(fields()+auth()+`<div class="field"><label for="description">Description</label><textarea id="description" rows="2" oninput="draft.description=this.value">${esc(draft.description)}</textarea></div><div class="actions">${draft.auth==='oauth'?`<button type="button" onclick="connect(${i})">${servers[i].connected?'Reconnect':'Connect'}</button>`:''}<span class="spacer"></span><button type="button" class="quiet" onclick="cancel()">Cancel</button><button class="primary" type="submit">Save</button></div><div class="actions start">${servers[i].auth==='oauth'&&servers[i].connected?`<button type="button" class="quiet" onclick="disconnect(${i})">Disconnect</button>`:''}<button type="button" class="quiet danger" onclick="removeServer(${i})">Remove server</button></div>`)}
function render(){
 $('.directions').innerHTML=directions.map((d,i)=>`<button aria-pressed="${i===variant}" onclick="selectVariant(${i})"><small>0${i+1}</small>${d[0]}</button>`).join('');$('#rationale').textContent=directions[variant][1];$('#note').textContent=directions[variant][2];
 $('.app').inert=false;$('.app').removeAttribute('aria-hidden');$('#sheet-root').innerHTML='';
 $('#content').innerHTML=(adding&&variant===3?composer():'')+list()+(adding&&variant<3?composer():'')+(!adding?'<div class="add-trigger"><button id="add-server" class="quiet" onclick="startAdd()">+ Add server</button></div>':'');
 if(adding&&variant===4){$('#sheet-root').innerHTML=`<div class="sheet-shade"><section class="sheet" role="dialog" aria-label="Add server"><div class="sheet-head"><h3>Add server</h3><button class="quiet icon" onclick="cancel()" aria-label="Close add form">×</button></div>${form(fields()+`<div class="sheet-preset">${presetLink('Fill from preset')}</div>`+presetOptions()+auth()+actions())}</section></div>`;$('.app').inert=true;$('.app').setAttribute('aria-hidden','true')}
}
function setAuth(a){draft.auth=a;render()}
function usePreset(i){const p=initial[i];draft={...draft,name:draft.name||p.name,url:p.url,auth:p.auth,secret:p.secret||''};presets=false;render()}
function suggestion(){const i=initial.findIndex(s=>s.name===draft.name.trim().toLowerCase());return i<0?'':`<button class="link" type="button" onclick="usePreset(${i})">Use ${i===1?'Datadog US5':initial[i].name} endpoint</button>`}
function updateSuggestion(){const target=$('#suggestion');if(target)target.innerHTML=suggestion()}
function save(){if(servers.some((s,i)=>i!==editing&&s.name===draft.name)){message('That name already exists. Your draft is preserved.');return}const item={...draft,connected:editing>=0?servers[editing].connected:true};if(editing>=0)servers[editing]=item;else servers.push(item);const oauth=adding&&draft.auth==='oauth';adding=false;editing=-1;presets=false;render();message(oauth?'Simulated: connection saved, browser consent completed.':'Simulated: connection saved.')}
function connect(i){servers[i].connected=true;message('Simulated browser consent. No real authorization requested.');render()}
function disconnect(i){servers[i].connected=false;message('Simulated disconnect. Existing access tokens would remain valid until expiry.');render()}
function removeServer(i){if(!confirm(`Remove ${servers[i].name}?`))return;servers.splice(i,1);editing=-1;adding=false;render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(adding||editing>=0))cancel()});
draft=blank();render();
</script></body></html>
