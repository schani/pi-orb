.index{width:236px}.desktop .model{max-width:110px}.desktop .identity{gap:4px}.inline-share{flex:none;margin-left:4px;font-weight:400}.phone .inline-share{min-height:44px;display:flex;align-items:center;border-bottom:0;text-decoration:underline}.phone .identity{min-width:0}.phone .identity>.context-title{min-width:0}.action-row{display:flex;justify-content:flex-end;gap:8px;align-items:center;border-bottom:1px solid #000;background:#fff;padding:4px 8px;flex:none}.action-row .text-action{margin-left:8px}.phone .action-row{min-height:44px}.phone .action-row .icon{width:36px;height:36px}.phone .action-row .text-action{min-height:36px;border:0;text-decoration:underline}.desktop .orb-head{font-size:13px}.desktop .orb-head .model{max-width:100px}.copy-feedback{color:#555}.phone .identity>span:first-child{flex:1}.phone .identity .context-title{flex:1}.phone .totals:has(.page-title){height:auto;min-height:44px;flex-wrap:wrap}.phone .totals:has(.page-title) .page-title{flex-basis:100%;max-width:none!important;border-right:0;border-bottom:1px solid #999;height:30px}.phone .totals:has(.page-title) .total{padding:0 4px}.phone .totals:has(.page-title) .page-title{max-width:120px}.phone .totals:has(.inline-share) .inline-share{margin-left:6px}.phone .totals:has(.inline-share) .total{padding:0 4px}.desktop .frame{min-width:900px}.preview.desktop{overflow:auto}
.phone .board{display:block}.desktop .action-row .passive{display:none}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="i-share" viewBox="0 0 16 16"><path d="M3 9v5h10V9M8 10V1M4 5l4-4 4 4"/></symbol>
<symbol id="i-copy" viewBox="0 0 16 16"><path d="M6 6h7v8H6zM3 10H2V2h8v1"/></symbol>
<symbol id="i-more" viewBox="0 0 16 16"><path d="M3 8h1m3 0h1m3 0h1"/></symbol>
<symbol id="i-back" viewBox="0 0 16 16"><path d="m10 3-5 5 5 5"/></symbol>
<symbol id="i-pen" viewBox="0 0 16 16"><path d="M3 10 10 3l3 3-7 7H3zM8 5l3 3"/></symbol>
<symbol id="i-terminal" viewBox="0 0 16 16"><path d="m3 4 4 4-4 4M9 12h4"/></symbol>
<symbol id="i-upload" viewBox="0 0 16 16"><path d="M3 10v3h10v-3M8 10V2M5 5l3-3 3 3"/></symbol>
<symbol id="i-stop" viewBox="0 0 16 16"><path d="M4 4h8v8H4z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-archive" viewBox="0 0 16 16"><path d="M3 6v7h10V6M2 3h12v3H2zM6 9h4"/></symbol>
<symbol id="i-bin" viewBox="0 0 16 16"><path d="M3 4h10M6 4V2h4v2M4 6v8h8V6M7 7v4M9 7v4"/></symbol>
<symbol id="i-trend" viewBox="0 0 16 16"><path d="M2 2v12h12M4 10l3-4 3 2 4-5"/></symbol>
<symbol id="i-gear" viewBox="0 0 16 16"><path d="m6.5 1.5 3 0 .5 2 1.5 1 2-.5L15 6.5 13.5 8v1l1.5 1.5-1.5 2.5-2-.5-1.5 1-.5 2h-3l-.5-2-1.5-1-2 .5L1 10.5 2.5 9V8L1 6.5 2.5 4l2 .5 1.5-1zM10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0"/></symbol>
<symbol id="i-home" viewBox="0 0 16 16"><path d="m2 7 6-5 6 5M4 6v8h8V6M7 14v-4h2v4"/></symbol>
</defs></svg>
<main>
<header class="study-head"><h1>Current-page link / access study</h1><p class="quiet">Study simulation: native Share, or Copy link fallback. No real sharing or copying.</p></header>
<nav class="tabs" role="tablist" aria-label="Access proposals">
<button role="tab" id="tab-A" data-proposal="A" aria-controls="study" aria-selected="true">A / Utility icon</button>
<button role="tab" id="tab-B" data-proposal="B" aria-controls="study" aria-selected="false" tabindex="-1">B / Text action</button>
<button role="tab" id="tab-C" data-proposal="C" aria-controls="study" aria-selected="false" tabindex="-1">C / Overflow</button>
<button role="tab" id="tab-D" data-proposal="D" aria-controls="study" aria-selected="false" tabindex="-1">D / Title menu</button>
<button role="tab" id="tab-E" data-proposal="E" aria-controls="study" aria-selected="false" tabindex="-1">E / Bottom bar</button>
</nav>
<div class="study-controls">
<label>Page <select id="page"><option value="orb">Orb</option><option value="dashboard">Dashboard</option></select></label>
<label>Capability <select id="capability"><option value="share">Native Share available</option><option value="copy">Copy link fallback</option></select></label>
<div class="segmented" aria-label="Preview viewport">
<button data-view="both" aria-pressed="true">Both</button><button data-view="desktop" aria-pressed="false">Desktop</button><button data-view="phone" aria-pressed="false">Phone</button>
</div>
</div>
<section id="study" role="tabpanel" aria-labelledby="tab-A">
<div class="tradeoff" id="tradeoff"></div>
<div class="mockups" id="mockups"></div>
</section>
<p id="status" role="status" aria-live="polite"></p>
</main>
<dialog id="sheet" aria-modal="true" aria-labelledby="sheet-title">
<div class="sheet-head"><h2 id="sheet-title">Simulated share sheet</h2><button class="icon" id="close-sheet" aria-label="Close share sheet">×</button></div>
<div class="sheet-body"><p id="sheet-context"></p><div class="url" id="sheet-url" tabindex="0" aria-label="Demo current-page URL"></div><p class="quiet">Study simulation only. In the app, this is your device's share sheet for the current page.</p><div class="sheet-actions"><button id="sheet-copy">Copy link</button><button id="sheet-done">Cancel</button></div><div class="sheet-status" id="sheet-status" role="status" aria-live="polite"></div></div>
</dialog>
<script>
const $=s=>document.querySelector(s);
const descriptions={
 A:["A direct utility cell.","Share joins the existing desktop utility strip and phone header. One tap; one more permanent icon. The dashboard uses its existing totals-strip utilities."],
 B:["An underlined text action near identity.","A quiet share action sits beside the orb name; the dashboard places it beside its totals. Direct and readable; consumes more horizontal space than an icon."],
 C:["Extend the existing actions row.","The phone ellipsis reveals an inline action row, not a floating menu. Add that same entry on desktop and the dashboard. Less resting chrome; one extra tap."],
 D:["A new page-title popover.","The orb title opens a single Share entry. The dashboard gains a small Dashboard title trigger. Compact; less discoverable and introduces title navigation chrome."],
 E:["A minimal bottom utility bar.","Home stays left and Share right. Easy reach in an installed app; adds 44px on phones and 38px on desktop, beside the existing composer cost."]
};
let proposal="A",page="orb",menu=null,opener=null;
// The capability selector simulates navigator.share support; no browser share/clipboard APIs are called.
const icon=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"></use></svg>';
const control=(n,label,action,extra="")=>'<button class="icon '+extra+'" data-action="'+action+'" aria-label="'+label+'" title="'+label+'">'+icon(n)+'</button>';
const passive=(n,label,extra="")=>'<span class="icon passive '+extra+'" title="'+label+' (context only)" aria-hidden="true">'+icon(n)+'</span>';
const currentTitle=()=>page==="orb"?"Share-link study":"Dashboard";
const demoUrl=()=>page==="orb"?"https://pi-orb.example/orbs/7d15f219":"https://pi-orb.example/";
function shareTrigger(){
 if(proposal==="A")return control("share","Share current page","share");
 if(proposal==="C")return control("more","Page actions","overflow");
 if(proposal==="B")return '<button class="text-action inline-share" data-action="share" aria-label="Share current page">share</button>';
 return "";
}
function index(){
 return '<aside class="index"><div class="brand"><a href="#" data-action="dashboard" aria-label="Dashboard">PI-ORB</a></div><div class="index-project">pi-orb <span class="quiet"> π ✳ ⚙</span></div><div class="index-row current"><span class="state">◉</span>Share-link study<small>now</small></div><div class="index-row"><span class="state">◉</span>Queue repair<small>8m</small></div><div class="index-row"><span class="quiet">⊖</span>Font metrics<small>2h</small></div><div class="archive">▸ archive · 3</div><div class="index-project">side projects</div><div class="index-row"><span class="state">◉</span>Notes<small>1d</small></div></aside>';
}
function bottom(){return proposal==="E"?'<div class="bottom">'+control("home","Dashboard","dashboard")+control("share","Share current page","share")+'</div>':""}
function orb(){
 const title=proposal==="D"?'<button class="context-title" data-action="identity" aria-label="Current page: Share-link study; link actions">Share-link study <span class="hint">▾</span></button>':'<span>Share-link study</span>';
 const phoneMore=proposal==="C"?control("more","Page actions","overflow","phone-only"):control("more","Orb actions","orb-actions","phone-only");
 return index()+'<div class="content"><header class="orb-head">'+control("back","Dashboard","dashboard","phone-only")+'<div class="identity">'+title+passive("pen","Rename orb")+(proposal==="B"?shareTrigger():"")+'</div><span class="cell life"><span class="state">◉</span><span class="life-word">running</span></span><span class="start">'+passive("stop","Stop orb")+'</span><span class="cell model">Claude Opus 4.1</span><span class="cell effort">high</span><span class="cell utility">'+passive("terminal","Open terminal")+'</span><span class="utility">'+passive("upload","Upload files")+'</span><span class="cell utility">'+passive("archive","Archive orb")+'</span><span class="cell utility">'+passive("bin","Delete orb","danger")+'</span>'+(proposal==="C"?'<span class="desktop-only">'+shareTrigger()+'</span>':proposal==="B"?"":shareTrigger())+phoneMore+'</header><div class="transcript"><div class="human">Explore a way to copy the current page link.</div><p>The action belongs to the page, not to an individual message.</p><div class="rail">▸ read · apps/web/src/pages/OrbPage.tsx</div><p>The header keeps its existing identity, state, model and lifecycle controls.</p><div class="code">current page → page link<br>same access → no public sharing</div><p style="margin-top:12px">Switch to Dashboard above to try the same entry there.</p></div><div class="composer"><b>›</b><span class="caret">&nbsp;</span></div>'+bottom()+'</div>';
}
function project(name,rows){
 return '<section class="project"><div class="project-heading">'+name+'<span class="project-actions">π ✳ '+passive("gear","Project config")+passive("bin","Delete project","danger")+'</span></div>'+rows.map(([name,age])=>'<div class="orb-entry"><b><span class="state">◉</span> '+name+'</b><div class="age">'+age+'<span>▣ <span class="danger">♜</span></span></div></div>').join('')+'<div class="archive">▸ archive · 3</div></section>';
}
function dashboard(){
 return '<div class="content"><div class="totals">'+(proposal==="D"?'<button class="context-title page-title" data-action="identity" aria-label="Current page: Dashboard; link actions">Dashboard <span class="hint">▾</span></button>':"")+(proposal==="B"?shareTrigger():"")+'<div class="total"><b>2</b> <span>projects</span></div><div class="total"><b>4</b> <span>orbs</span></div><div class="total"><b>0</b> <span>busy</span></div><div class="total"><b>0</b> <span>failed</span></div><div class="dash-actions">'+(proposal==="B"?"":shareTrigger())+passive("trend","Token usage")+passive("gear","Settings")+'</div></div><div class="board">'+project("pi-orb",[["Share-link study","now"],["Queue repair","8m"],["Font metrics","2h"]])+project("side projects",[["Notes","1d"]])+'</div><div class="dash-footer">'+'<span>logout</span>'+'<span class="meta">gce host · postgres · v0.1</span></div>'+bottom()+'</div>';
}
function render(){
 closeMenu(false);
 $("#tradeoff").innerHTML='<strong>'+descriptions[proposal][0]+'</strong><p>'+descriptions[proposal][1]+'</p>';
 $("#study").setAttribute("aria-labelledby","tab-"+proposal);
 $("#mockups").innerHTML=["desktop","phone"].map(size=>'<section class="preview '+size+'" aria-label="'+size+' preview"><h2 class="preview-label">'+(size==="desktop"?"Desktop / 24px header":"Phone / 44px targets")+'</h2><div class="frame"><div class="window-bar" aria-hidden="true">pi-orb.example'+(page==="orb"?"/orbs/7d15f219":"/")+'</div><div class="app">'+(page==="orb"?orb():dashboard())+'</div></div></section>').join("");
 document.querySelectorAll("[data-action]").forEach(button=>{if(["home","identity","overflow","orb-actions"].includes(button.dataset.action)){button.setAttribute("aria-haspopup","menu");button.setAttribute("aria-expanded","false")}});
 $("#status").textContent="";
}
function closeMenu(restore=true){
 if(!menu)return;
 menu.remove();menu=null;
 if(opener?.isConnected){opener.setAttribute("aria-expanded","false");if(restore)opener.focus()}
}
function showSheet(trigger){
 closeMenu(false);opener=trigger;
 if($("#capability").value==="copy"){
   $("#status").textContent="Simulated: current-page link copied — "+demoUrl()+". No clipboard was changed.";
   trigger?.focus();return;
 }
 $("#sheet-context").textContent="Current page: "+currentTitle();
 $("#sheet-url").textContent=demoUrl();
 $("#sheet-status").textContent="";
 $("#sheet").showModal();$("#sheet-copy").focus();
}
function openMenu(trigger,kind){
 const wasSame=menu&&opener===trigger;closeMenu(false);if(wasSame){trigger.focus();return}
 opener=trigger;trigger.setAttribute("aria-expanded","true");
 const frame=trigger.closest(".frame");
 menu=document.createElement("div");
 if(kind==="overflow"||kind==="orb-actions"){
   menu.className="action-row";menu.setAttribute("role","group");menu.setAttribute("aria-label","Page actions");
   menu.innerHTML=(page==="orb"?passive("terminal","Open terminal")+passive("upload","Upload files")+passive("stop","Stop orb")+passive("archive","Archive orb")+passive("bin","Delete orb","danger"):passive("trend","Token usage")+passive("gear","Settings"))+(kind==="overflow"?'<button class="text-action" data-action="share" aria-label="Share current page">share</button>':'<span class="quiet">orb actions</span>');
   const head=trigger.closest(".content").querySelector(".orb-head,.totals");head.after(menu);
 }else{
   menu.className="menu";menu.setAttribute("role","menu");menu.setAttribute("aria-label","Current-page actions");
   menu.innerHTML='<button role="menuitem" data-action="share">Share</button>';frame.append(menu);
   const r=trigger.getBoundingClientRect(),f=frame.getBoundingClientRect();
   menu.style.left=Math.max(4,Math.min(r.left-f.left,frame.clientWidth-220))+"px";
   menu.style.top=(r.bottom-f.top+3)+"px";
 }
 menu.querySelector("button")?.focus();
}
document.addEventListener("click",event=>{
 const trigger=event.target.closest("[data-action]");
 if(!trigger)return;event.preventDefault();
 const action=trigger.dataset.action;
 if(["home","identity","overflow","orb-actions"].includes(action))openMenu(trigger,action);
 if(action==="share")showSheet(menu?opener:trigger);

 if(action==="dashboard"){page="dashboard";$("#page").value=page;render();$("#page").focus()}
 if(action==="usage"){closeMenu();$("#status").textContent="Token usage navigation is context only in this study."}
});
document.addEventListener("pointerdown",event=>{if(menu&&!menu.contains(event.target)&&!opener?.contains(event.target))closeMenu(false)});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&menu){event.preventDefault();closeMenu()}
 if(menu&&["ArrowDown","ArrowUp","Home","End"].includes(event.key)){
   const items=[...menu.querySelectorAll("button")];if(!items.length)return;event.preventDefault();
   const i=items.indexOf(document.activeElement);
   items[event.key==="Home"?0:event.key==="End"?items.length-1:(i+(event.key==="ArrowDown"?1:-1)+items.length)%items.length].focus();
 }
 if(event.key==="Tab"&&menu)closeMenu(false);
});
document.querySelectorAll("[data-proposal]").forEach(tab=>tab.addEventListener("click",()=>{
 proposal=tab.dataset.proposal;
 document.querySelectorAll("[data-proposal]").forEach(t=>{t.setAttribute("aria-selected",t===tab);t.tabIndex=t===tab?0:-1});
 render();
}));
$(".tabs").addEventListener("keydown",event=>{
 if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();
 const tabs=[...document.querySelectorAll("[data-proposal]")],i=tabs.indexOf(document.activeElement);
 const tab=tabs[event.key==="Home"?0:event.key==="End"?4:(i+(event.key==="ArrowRight"?1:-1)+5)%5];tab.click();tab.focus();
});
$("#page").addEventListener("change",()=>{page=$("#page").value;render()});
document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>{
 $("#mockups").className="mockups view-"+button.dataset.view;
 document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b===button));
}));
$("#sheet-copy").addEventListener("click",()=>{$("#sheet-status").textContent="Simulated: current-page link copied. No clipboard was changed."});
$("#close-sheet").addEventListener("click",()=>$("#sheet").close());
$("#sheet-done").addEventListener("click",()=>$("#sheet").close());
$("#sheet").addEventListener("click",event=>{if(event.target===$("#sheet")){const r=$("#sheet").getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$("#sheet").close()}});
$("#sheet").addEventListener("close",()=>{if(opener?.isConnected)opener.focus()});
render();
</script>
</body>
</html>
