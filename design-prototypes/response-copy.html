<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-orb · response copy study</title>
<style>
:root{color-scheme:light;--w:#fff;--k:#000;--g1:#f2f2f2;--g2:#999;--g3:#555;--ok:#1a7e37;--ok-bg:#e6f4ea;--bad:#b42318;--bad-bg:#fdecea;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--w);color:var(--k);font:13px/20px var(--mono);font-variant-numeric:tabular-nums}button,textarea{font:inherit;color:inherit}button{min-height:20px;padding:0 8px;border:1px solid var(--k);border-radius:0;background:var(--w);cursor:pointer}button:hover,button:focus-visible,button[aria-pressed="true"]{color:var(--w);background:var(--k);outline:0}button:focus-visible{outline:2px solid var(--k);outline-offset:2px}a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}code{font:inherit;background:var(--g1);padding:0 3px}::selection{color:var(--k);background:var(--g2)}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.study{padding:8px 12px;border-bottom:1px solid var(--k)}.study-top{display:flex;align-items:baseline;gap:12px}.study h1{margin:0;font-size:13px;line-height:20px;letter-spacing:.08em;text-transform:uppercase}.study-note{color:var(--g3)}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}.selectors{display:flex;flex-wrap:wrap;gap:4px}.selectors b{margin-right:5px}.mode-controls{display:flex;gap:4px;margin-left:auto}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(1220px,calc(100% - 24px));margin:12px auto}.candidate{min-width:0;border:1px solid var(--k);background:var(--w)}.candidate:last-child{grid-column:1/-1}.candidate-head{display:flex;align-items:center;height:28px;padding:0 8px;border-bottom:1px solid var(--k)}.candidate-head h2{margin:0;font-size:13px;line-height:20px}.candidate-head .num{margin-right:8px}.recommended{margin-left:auto;color:var(--g3);font-size:11px}.conversation{min-width:0}.turn{position:relative;min-width:0;padding:8px 12px;overflow-wrap:anywhere}.turn.user{color:var(--w);background:var(--k)}.turn p{margin:0 0 8px}.turn p:last-child{margin-bottom:0}.response{position:relative;min-width:0}.response h3{margin:8px 0 0;font-size:13px;line-height:20px;letter-spacing:.08em;text-transform:uppercase}.response ul{margin:0 0 8px;padding-left:3ch}.response a{border-color:currentColor}.activity{margin:0 0 6px;border:1px solid var(--g2);background:var(--w)}.activity summary{min-height:20px;padding:0 7px;color:var(--g3);cursor:pointer;list-style:none}.activity summary::-webkit-details-marker{display:none}.activity summary::before{content:"▸";display:inline-block;width:2ch}.activity[open] summary::before{content:"▾"}.activity div{padding:3px 8px;border-top:1px solid var(--g2);background:var(--g1);color:var(--g3)}.markdown-code{position:relative;margin:0 0 8px;border:1px solid var(--k);background:var(--g1)}.markdown-code pre{max-width:100%;margin:0;margin-right:26px;padding:2px 8px;overflow-x:auto;white-space:pre}.icon-button{display:inline-grid;width:20px;height:20px;min-height:20px;padding:0;place-items:center;border:0;background:transparent;color:var(--g3)}.icon-button:hover,.icon-button:focus-visible{color:var(--w);background:var(--k)}.icon-button svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square}.code-copy{position:absolute;z-index:2;top:2px;right:2px}.code-copy[data-state="copied"],.response-copy[data-state="copied"]{color:var(--ok);background:var(--w)}.code-copy[data-state="failed"],.response-copy[data-state="failed"]{color:var(--bad);background:var(--w)}
.copy-status{min-height:20px;color:var(--g3);font-size:11px}.copy-status.ok{color:var(--ok)}.copy-status.bad{color:var(--bad)}.manual{margin:4px 0 0;border:1px solid var(--bad);background:var(--w)}.manual-head{padding:2px 6px;color:var(--bad);border-bottom:1px solid var(--bad)}.manual textarea{display:block;width:100%;height:100px;padding:4px 6px;resize:vertical;border:0;border-radius:0;background:var(--g1);font-size:12px;line-height:16px}.manual textarea:focus{color:var(--w);background:var(--k);outline:0}
/* 1 — icon-only quiet footer. */.quiet .response{padding-bottom:28px}.quiet .response-copy{position:absolute;bottom:4px;left:0}.quiet .copy-status{position:absolute;bottom:4px;left:24px;right:0}
/* 2 — corner action, withheld until the response is addressed. */.corner .response{padding-right:24px}.corner .response-copy{position:absolute;top:0;right:0;opacity:0}.corner .response:hover .response-copy,.corner .response:focus-within .response-copy,.corner .response-copy[data-state]{opacity:1}.corner .copy-status{margin-right:-24px;text-align:right}
/* 3 — closing rule with a ruled action cell. */.end-rule .response-end{display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:stretch;margin-top:8px;border-top:1px solid var(--k)}.end-rule .copy-status{padding-top:2px}.end-rule .response-copy{width:28px;height:28px;border-left:1px solid var(--k)}
/* 4 — icon follows the final rendered sentence. */.inline-tail .tail-line{display:inline}.inline-tail .response-copy{display:inline-grid;margin-left:4px;vertical-align:-5px}.inline-tail .copy-status{display:inline;margin-left:4px;vertical-align:1px}
/* 5 — a black tab occupies the paper edge. */.edge-tab .response{padding-right:36px}.edge-tab .response-copy{position:absolute;top:8px;right:-12px;width:32px;height:44px;color:var(--w);background:var(--k)}.edge-tab .response-copy:hover,.edge-tab .response-copy:focus-visible{color:var(--k);background:var(--w);border:1px solid var(--k)}.edge-tab .response-copy[data-state="copied"]{color:var(--ok);background:var(--ok-bg)}.edge-tab .response-copy[data-state="failed"]{color:var(--bad);background:var(--bad-bg)}.edge-tab .copy-status{margin-right:-24px;text-align:right}
.gallery.focus{display:block;max-width:920px}.gallery.focus .candidate{display:none}.gallery.focus .candidate.active{display:block}.gallery.phone{display:block;width:390px;max-width:calc(100% - 16px)}.gallery.phone .candidate{margin-bottom:12px}.gallery.phone:not(.focus) .candidate{display:block}.gallery.phone .response-copy,.gallery.phone .icon-button{min-width:44px;width:44px;min-height:44px;height:44px}.gallery.phone .code-copy{top:0;right:0}.gallery.phone .markdown-code pre{margin-right:46px;min-height:44px;padding-block:11px}.gallery.phone .quiet .response{padding-bottom:48px}.gallery.phone .quiet .response-copy{bottom:2px;left:0}.gallery.phone .quiet .copy-status{bottom:12px;left:48px}.gallery.phone .corner .response{padding-right:44px}.gallery.phone .corner .response-copy{opacity:1}.gallery.phone .end-rule .response-end{grid-template-columns:minmax(0,1fr) 44px}.gallery.phone .end-rule .response-copy{width:44px;height:44px}.gallery.phone .inline-tail .response-copy{vertical-align:-17px}.gallery.phone .edge-tab .response{padding-right:48px}.gallery.phone .edge-tab .response-copy{right:-12px;width:44px}.gallery.phone .manual textarea{font-size:16px;line-height:20px}
@media(hover:none){.corner .response-copy{opacity:1}}@media(max-width:700px){.study{padding:8px}.study-top{display:block}.study-note{display:none}.controls{display:block}.selectors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.selectors button{min-width:0;min-height:44px;padding:2px 5px;text-align:left;line-height:16px}.mode-controls{margin-top:4px}.mode-controls button{min-height:44px}.gallery{display:block;width:calc(100% - 16px);margin-block:8px}.candidate{margin-bottom:8px}.candidate:last-child{margin-bottom:0}.icon-button{min-width:44px;width:44px;min-height:44px;height:44px}.code-copy{top:0;right:0}.markdown-code pre{margin-right:46px;min-height:44px;padding-block:11px}.quiet .response{padding-bottom:48px}.quiet .response-copy{bottom:2px}.quiet .copy-status{bottom:12px;left:48px}.corner .response{padding-right:44px}.corner .response-copy{opacity:1}.end-rule .response-end{grid-template-columns:minmax(0,1fr) 44px}.end-rule .response-copy{width:44px;height:44px}.inline-tail .response-copy{vertical-align:-17px}.edge-tab .response{padding-right:48px}.edge-tab .response-copy{width:44px}.manual textarea{font-size:16px;line-height:20px}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M6 6h7v8H6z M3 10H2V2h8v1"/></symbol></svg>
<header class="study"><div class="study-top"><h1>Response copy</h1><span class="study-note">Raw Markdown · five placements</span></div><div class="controls"><nav class="selectors" aria-label="Response copy designs"><button type="button" data-focus="1"><b>1</b>Quiet footer</button><button type="button" data-focus="2"><b>2</b>Corner action</button><button type="button" data-focus="3"><b>3</b>End rule</button><button type="button" data-focus="4"><b>4</b>Inline tail</button><button type="button" data-focus="5"><b>5</b>Edge tab</button></nav><div class="mode-controls"><button id="compare" type="button" aria-pressed="true">Compare</button><button id="phone" type="button" aria-pressed="false">Phone width</button></div></div></header>
<main class="gallery" id="gallery"></main>
<script>
const SOURCES={
  rich:'### I found two constraints:\n\n- Preserve the `stale_head` guard.\n- Copy the [raw response](https://example.test/runtime), not rendered text.\n\n```ts\nconst head = snapshot.head;\nawait socket.send({ head });\n```\n\nThe **snapshot gate** remains unchanged.',
  short:'Done — the response source stays intact.'
};
const COPY_ICON='<svg aria-hidden="true"><use href="#i-copy"></use></svg>';
const designs=[['quiet','Quiet footer',false],['corner','Corner action',true],['end-rule','End rule',false],['inline-tail','Inline tail',false],['edge-tab','Edge tab',false]];
function responseButton(key){return `<button type="button" class="icon-button response-copy" data-source="${key}" aria-label="Copy response Markdown" title="Copy response Markdown">${COPY_ICON}</button>`}
function status(key){return `<span class="copy-status" data-status="${key}" role="status" aria-live="polite"></span>`}
function endControl(kind,key){
  if(kind==='end-rule')return `<div class="response-end">${status(key)}${responseButton(key)}</div>`;
  if(kind==='inline-tail')return `${responseButton(key)}${status(key)}`;
  return `${responseButton(key)}${status(key)}`;
}
function richResponse(kind){return `<article class="turn assistant"><span class="visually-hidden">Orb:</span><details class="activity"><summary>thinking · checking runtime ownership</summary><div>Snapshot ordering and transport state are inspected separately.</div></details><div class="response" data-response="rich"><h3>I found two constraints:</h3><ul><li>Preserve the <code>stale_head</code> guard.</li><li>Copy the <a href="https://example.test/runtime">raw response</a>, not rendered text.</li></ul><div class="markdown-code"><button type="button" class="icon-button code-copy" data-code="const head = snapshot.head;\nawait socket.send({ head });" aria-label="Copy code block" title="Copy code block">${COPY_ICON}</button><pre><code>const head = snapshot.head;\nawait socket.send({ head });</code></pre></div><details class="activity"><summary>read · runtime socket</summary><div>apps/web/src/lib/runtime-socket.ts · 42 lines</div></details><p class="${kind==='inline-tail'?'tail-line':''}">The <strong>snapshot gate</strong> remains unchanged.</p>${endControl(kind,'rich')}</div></article>`}
function shortResponse(kind){return `<article class="turn assistant"><span class="visually-hidden">Orb:</span><div class="response" data-response="short"><p class="${kind==='inline-tail'?'tail-line':''}">Done — the response source stays intact.</p>${endControl(kind,'short')}</div></article>`}
function candidate([kind,name,recommended],index){return `<section class="candidate ${kind}" data-design="${index+1}"><header class="candidate-head"><span class="num">${index+1}</span><h2>${name}</h2>${recommended?'<span class="recommended">recommended</span>':''}</header><div class="conversation"><article class="turn user"><span class="visually-hidden">You:</span><p>Add a copy action to every agent response. It must copy the original Markdown, never thinking or tool details.</p></article>${richResponse(kind)}<article class="turn user"><span class="visually-hidden">You:</span><p>Does this also work for a one-line answer?</p></article>${shortResponse(kind)}</div></section>`}
const gallery=document.querySelector('#gallery');gallery.innerHTML=designs.map(candidate).join('');
function copyResult(ok,error){return ok?{ok:true}:{ok:false,error};}
async function writeClipboard(text){
  if(!navigator.clipboard?.writeText)return copyResult(false,'unavailable');
  try{await navigator.clipboard.writeText(text);return copyResult(true);}catch{return copyResult(false,'denied');}
}
function clearManual(response){response.querySelector('.manual')?.remove();}
function showManual(response,text){
  clearManual(response);const box=document.createElement('div');box.className='manual';box.innerHTML='<div class="manual-head">Clipboard blocked · copy raw Markdown manually</div><textarea readonly aria-label="Raw response Markdown"></textarea>';const area=box.querySelector('textarea');area.value=text;response.append(box);area.focus();area.select();
}
function setFeedback(button,result,text){
  const response=button.closest('.response');const key=button.dataset.source;const output=response.querySelector(`[data-status="${key}"]`);button.dataset.state=result.ok?'copied':'failed';button.setAttribute('aria-label',result.ok?'Copied response Markdown':'Clipboard blocked; raw Markdown shown below');button.title=button.getAttribute('aria-label');output.textContent=result.ok?'copied':'copy failed';output.className=`copy-status ${result.ok?'ok':'bad'}`;clearTimeout(button._reset);if(result.ok){clearManual(response);button._reset=setTimeout(()=>{button.removeAttribute('data-state');button.setAttribute('aria-label','Copy response Markdown');button.title='Copy response Markdown';output.textContent='';output.className='copy-status'},1600)}else showManual(response,text);
}
async function copyResponse(button){const text=SOURCES[button.dataset.source];setFeedback(button,await writeClipboard(text),text)}
async function copyCode(button){const result=await writeClipboard(button.dataset.code);button.dataset.state=result.ok?'copied':'failed';button.setAttribute('aria-label',result.ok?'Copied code block':'Copy code failed');button.title=button.getAttribute('aria-label');clearTimeout(button._reset);button._reset=setTimeout(()=>{button.removeAttribute('data-state');button.setAttribute('aria-label','Copy code block');button.title='Copy code block'},1600)}
document.addEventListener('click',event=>{const response=event.target.closest?.('.response-copy');if(response){copyResponse(response);return}const code=event.target.closest?.('.code-copy');if(code)copyCode(code)});
function compare(){gallery.classList.remove('focus');gallery.querySelectorAll('.candidate').forEach(card=>card.classList.remove('active'));document.querySelectorAll('[data-focus]').forEach(button=>button.setAttribute('aria-pressed','false'));document.querySelector('#compare').setAttribute('aria-pressed','true')}
document.querySelectorAll('[data-focus]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.focus;gallery.classList.add('focus');gallery.querySelectorAll('.candidate').forEach(card=>card.classList.toggle('active',card.dataset.design===id));document.querySelectorAll('[data-focus]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelector('#compare').setAttribute('aria-pressed','false')}));
document.querySelector('#compare').addEventListener('click',compare);document.querySelector('#phone').addEventListener('click',event=>{const on=gallery.classList.toggle('phone');event.currentTarget.setAttribute('aria-pressed',String(on));event.currentTarget.textContent=on?'Fluid width':'Phone width'});compare();
</script>
</body>
</html>
