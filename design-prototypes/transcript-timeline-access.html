<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-orb · timeline access study</title>
<style>
/* Product faces, served from the repository; system faces when opened elsewhere. */
@font-face{font-family:"Iosevka Etoile";src:url("../apps/web/public/fonts/iosevka-etoile-regular-989cbc25c646.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Iosevka Etoile";src:url("../apps/web/public/fonts/iosevka-etoile-bold-7ec739ec82b2.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Iosevka Etoile";src:url("../apps/web/public/fonts/iosevka-etoile-italic-ff9ea6b1ef88.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../apps/web/public/fonts/jetbrains-mono-regular-fa06becb7e66.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../apps/web/public/fonts/jetbrains-mono-bold-f73d6b79ab0c.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

/* Signal / Boards tokens (apps/web/src/styles.css) plus the chart constants used by
   the waterfall (design-prototypes/transcript-timeline.html, variant D). Light only. */
:root{color-scheme:light;--w:#fff;--k:#000;--g1:#f2f2f2;--g2:#999;--g3:#555;--pale:#d9d9d9;--grid:#e6e6e6;--ok:#1a7e37;--bad:#b42318;--bad-bg:#fdecea;--start:#966100;--alert:#b21f2d;
  --text:"Iosevka Etoile",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--row:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--w);color:var(--k);font:13px/20px var(--text);font-variant-numeric:tabular-nums;font-feature-settings:"calt" 1;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentcolor}
a:hover{background:var(--k);color:var(--w);border-color:var(--k)}
button,input,textarea{font:inherit;color:inherit;background:transparent;border:0;margin:0;font-variant-numeric:tabular-nums}
button{cursor:pointer;padding:0 8px;line-height:18px;border:1px solid var(--k);background:var(--w);border-radius:0}
button:hover:not(:disabled){background:var(--k);color:var(--w)}
:focus-visible{outline:0;background:var(--k);color:var(--w)}
button.icon-button,a.icon-button{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;color:var(--g3);background:transparent}
button.icon-button:hover:not(:disabled),a.icon-button:hover{background:var(--k);color:var(--w)}
button.icon-button.danger{color:var(--bad)}
button.icon-button.danger:hover:not(:disabled){background:var(--bad);color:var(--w)}
.ic{display:block;width:16px;height:16px}
.glyph{display:inline-block;width:16px;height:16px;flex:none;vertical-align:middle}
.tile{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.tile.s12{width:12px;height:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.error-text{color:var(--bad)}
h1,h2{margin:0;font-size:13px;line-height:20px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* ================= study shell ================= */
body.shell{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--g1)}
.study,.why,.addr{flex:none}
.study{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--w);border-bottom:1px solid var(--k)}
.study nav,.study .dev{display:flex;flex-wrap:wrap;gap:4px}
.study .dev{margin-left:auto}
.study button{min-height:20px}
.study button[aria-pressed=true]{background:var(--k);color:var(--w)}
.why{display:flex;gap:8px;align-items:baseline;padding:2px 12px;background:var(--w);border-bottom:1px solid var(--g2);white-space:nowrap;overflow:hidden}
.why b{flex:none}
.why span{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--g3)}
.addr{display:flex;background:var(--w);border-bottom:1px solid var(--k)}
.addr input{flex:1;min-width:0;padding:0 12px;font:11px/20px var(--mono);color:var(--g3)}
.addr input:focus{outline:0;color:var(--k);background:var(--w)}
.stage{display:flex;flex:1;min-height:0;overflow:auto}
.stage iframe{display:block;flex:none;border:0;background:var(--w);width:100%;height:100%}
.stage.phone{padding:12px 0;justify-content:center;align-items:flex-start}
.stage.phone iframe{width:392px;height:min(846px,100%);border:1px solid var(--k)}
@media(max-width:600px){
    .study{padding-inline:8px}.why{display:block;white-space:normal;padding-inline:8px}.why span{overflow:visible}
  .study button{min-height:32px}
  .study .dev{display:none}
  .stage.phone{padding:0}
  .stage iframe,.stage.phone iframe{width:100%;height:100%;border:0}
}

/* ================= product mock (apps/web/src/styles.css) ================= */
body.frame{overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.orb-page{display:grid;flex:1;min-height:0;overflow:hidden;grid-template-columns:236px minmax(0,1fr)}
.orb-index{position:fixed;top:0;left:0;width:236px;height:100dvh;overflow-y:auto;border-right:1px solid var(--k)}
.ix-brand{gap:8px;position:sticky;z-index:4;top:0;display:flex;height:24px;align-items:center;padding:0 10px;background:var(--w);border-bottom:1px solid var(--k)}
.ix-project+.ix-project{border-top:1px solid var(--k)}
.project-head{padding:0 10px;border-bottom:1px solid var(--k);position:sticky;z-index:3;top:24px;background:var(--w)}
.project-head-line{display:flex;height:24px;min-width:0;align-items:center;gap:8px;white-space:nowrap}
.project-name{min-width:0;flex:1;overflow:hidden;font-size:18px;line-height:24px;text-overflow:ellipsis}
a.project-new-orb-icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;color:var(--g3);margin-right:-10px;border-left:1px solid var(--k)}
.ix-row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;height:20px;padding:0 10px 0 12px;border-bottom:1px solid var(--g1)}
.ix-row:hover{color:inherit;background:var(--g1);border-bottom-color:var(--g1)}
.ix-age{color:var(--g3);font-size:11px}
.ix-row-current,.ix-row-current:hover{color:var(--w);background:var(--k);border-bottom-color:var(--k);font-weight:700}
.ix-row-current .ix-age{color:var(--w)}
.orb-main{grid-column:2;display:flex;min-width:0;min-height:0;overflow:hidden;flex-direction:column}
.orb-header-stack{position:relative;z-index:20;display:flex;flex:none;min-width:0;flex-direction:column;background:var(--w)}
.orb-header{position:relative;display:flex;height:24px;flex:none;align-items:center;gap:0;padding:0;background:var(--w);border-bottom:1px solid var(--k);white-space:nowrap}
.orb-name{overflow:hidden;text-overflow:ellipsis;font-weight:700}
.orb-life{display:inline-flex;flex:none;align-items:center;gap:6px;order:1;height:23px;padding:0 8px;border-left:1px solid var(--k)}
.orb-identity{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:50px;height:23px;padding:0 8px 0 12px}
.orb-header-actions{display:contents}
.orb-header-actions>button[aria-label="Stop orb"]{order:2;margin-right:4px}
.orb-settings{display:flex;order:3;height:23px;min-width:70px;max-width:40%;flex:0 1 auto}
.orb-settings button{border:0;border-left:1px solid var(--k);padding:0 8px;color:var(--g3);background:transparent;line-height:23px}
.orb-settings button:hover:not(:disabled){background:var(--k);color:var(--w)}
.orb-header-actions>button:not([aria-label="Stop orb"]){order:4;position:relative;width:20px;height:20px;margin:0 4px}
.orb-header-actions>button[aria-label="Open terminal"]::before,.orb-header-actions>button[aria-label="Archive orb"]::before,.orb-header-actions>button[aria-label="Delete orb"]::before{content:"";position:absolute;left:-4px;top:-2px;height:23px;width:1px;background:var(--k)}
.orb-header-actions>.icon-button[aria-pressed=true]{color:var(--w);background:var(--k)}
.orb-phone-home,button.orb-phone-menu{display:none}
.orb-work{position:relative;display:flex;flex:1;min-height:0;min-width:0}
.orb-body{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.orb-body[hidden]{display:none}
.orb-transcript-scroll{position:relative;display:block;flex:1;min-height:40px;overflow:auto;overscroll-behavior:contain}
.orb-transcript-content{position:relative;display:flow-root}
.history{display:flex;min-width:0;flex-direction:column;padding-bottom:8px}
.rec{display:block;padding:4px 12px}
.rec-bd{min-width:0}
.rec-you{position:relative;padding:9px 12px;color:var(--w);background:var(--k);border-top:1px solid var(--k);border-bottom:1px solid var(--k)}
.rec-alert{padding:4px 0}
.alert-band{padding:10px 12px;background:var(--alert);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.rec-status{margin-right:6px;padding:0 5px;color:inherit;border:1px solid currentcolor;line-height:16px}
.chat-markdown{overflow-wrap:anywhere}
.chat-markdown p{margin:0 0 8px}
.chat-markdown>:last-child{margin-bottom:0}
.response-markdown{position:relative;min-width:0;padding-right:24px;overflow-wrap:anywhere;margin:2px 0 6px}
.rec-bd>.error-text{margin:0 0 4px}
code{font-family:var(--mono);font-size:12px}
.activity-rail-row{margin-bottom:4px;background:var(--w);border:1px solid var(--g2)}
.activity-rail-row>summary{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:8px;align-items:center;min-height:20px;cursor:pointer;list-style:none;padding:0 8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.activity-rail-row>summary::-webkit-details-marker{display:none}
.activity-rail-row>summary:hover{background:var(--g1)}
.rec-orb>.rec-bd>.activity-rail-row{position:relative;border:0}
.rec-orb>.rec-bd>.response-markdown+.activity-rail-row{margin-top:4px}
.rec-orb>.rec-bd>.activity-rail-row::before{position:absolute;z-index:1;top:0;bottom:-4px;left:calc(8px + .5ch);width:1px;background:var(--g2);content:"";pointer-events:none}
.rec-orb>.rec-bd>.activity-rail-row:not(.activity-rail-row+.activity-rail-row)::before{top:12px}
.rec-orb>.rec-bd>.activity-rail-row:not(:has(+.activity-rail-row))::before{bottom:0}
.rec-orb>.rec-bd>.activity-rail-row:not([open]):not(:has(+.activity-rail-row))::before{bottom:calc(100% - 12px)}
.activity-rail-marker{color:var(--g3)}
.activity-rail-marker::before{content:"\25b8"}
.activity-rail-row[open]>summary .activity-rail-marker::before{content:"\25be"}
.rec-orb>.rec-bd>.activity-rail-row>summary .activity-rail-marker{position:relative;z-index:2;width:1ch;height:12px;line-height:12px;align-self:center;background:var(--w);text-align:center}
.activity-rail-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity-rail-headline,.activity-rail-metric{color:var(--g3);white-space:nowrap}
.activity-rail-row-failed .activity-rail-marker,.activity-rail-row-failed .activity-rail-label,.tool-activity-failed,.tool-diff-removed{color:var(--bad)}
.tool-diff-added{color:var(--ok)}
.reasoning-body,.tool-activity-calls{margin:0;padding:2px 8px 4px calc(2ch + 16px);color:var(--g3);background:var(--g1);white-space:pre-wrap;overflow-wrap:anywhere}
.tool-activity-calls div{font:12px/18px var(--mono)}
.tool-activity-calls .out{color:var(--g3);padding-left:2ch}
.tool-activity-calls .out.bad{color:var(--bad)}
.composer{position:relative;z-index:30;flex:none;padding:4px 12px;background:var(--w);border-top:1px solid var(--k)}
.composer-line{position:relative;display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:1ch}
.composer-prefix{color:var(--k);font-weight:700;text-align:right}
.text-field-frame{display:block;position:relative;min-width:0}
.text-field-frame:focus-within::after{position:absolute;z-index:2;inset:-3px;content:"";pointer-events:none;background:linear-gradient(var(--k),var(--k)) left top/11px 1px no-repeat,linear-gradient(var(--k),var(--k)) left top/1px 11px no-repeat,linear-gradient(var(--k),var(--k)) right top/11px 1px no-repeat,linear-gradient(var(--k),var(--k)) right top/1px 11px no-repeat,linear-gradient(var(--k),var(--k)) left bottom/11px 1px no-repeat,linear-gradient(var(--k),var(--k)) left bottom/1px 11px no-repeat,linear-gradient(var(--k),var(--k)) right bottom/11px 1px no-repeat,linear-gradient(var(--k),var(--k)) right bottom/1px 11px no-repeat}
.composer-input{display:block;width:100%;height:80px;min-height:80px;padding:0;resize:vertical;border:0;line-height:20px;color:var(--k);background:var(--w);caret-color:var(--k)}
.composer-input:focus,.composer-input:focus-visible{outline:0;background:var(--w);color:var(--k)}
.composer-phone-pad,.composer-phone-rail{display:none}
.command-picker{position:absolute;grid-column:2/-1;z-index:25;bottom:calc(100% + 4px);left:0;width:min(420px,100%);max-height:280px;overflow-y:auto;padding:4px;border:1px solid var(--k);background:var(--w)}

.command-picker button{display:flex;justify-content:space-between;gap:16px;text-align:left;width:100%;padding:5px 8px;border:0}
.command-picker button.selected{background:var(--k);color:var(--w)}
.page{display:flex;flex-direction:column;gap:8px}
.simple-page{padding:20px 12px;align-items:flex-start}
/* ===== waterfall encodings, tooltip and table: transcript-timeline.html (variant D) ===== */
/* shared encodings: model wait outlined, thinking as a bit raster, streaming ink,
   tools pale, failure red, Luna grey, compaction hatched */
.ev{position:absolute;z-index:1;cursor:pointer}
.seg{position:absolute;top:0;bottom:0}
.s-wait{background:var(--w);border:1px solid var(--k)}
.s-think{background:repeating-conic-gradient(var(--k) 0 25%,var(--w) 0 50%) 0 0/4px 4px}
.s-stream{background:var(--k)}
.llm.err .s-wait,.llm.err .s-think{border:1px solid var(--bad);background:var(--bad-bg)}
.llm.err .s-think{background:repeating-conic-gradient(var(--bad) 0 25%,var(--bad-bg) 0 50%) 0 0/4px 4px}
.call{background:var(--pale);color:var(--k);font:11px/11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:3px}
.call.fail{background:var(--bad);color:var(--w)}
.call.aborted{background:var(--w);border:1px solid var(--bad);color:var(--bad)}
.call.inner{background:var(--g1);border:1px solid var(--pale);line-height:7px;font-size:9px}
.luna{background:var(--g2)}
.compact{background:repeating-linear-gradient(135deg,var(--g2) 0 1px,var(--w) 1px 4px);border:1px solid var(--g2)}
.hot{outline:2px solid var(--k);outline-offset:1px;z-index:3}
.crop{position:absolute;pointer-events:none;z-index:6}
.crop i{position:absolute;width:9px;height:9px;border:0 solid var(--k)}
.crop i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}
.crop i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}
.crop i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}
.crop i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}

/* tooltip: the chart tooltip (chart-tip) */
.tip{position:fixed;z-index:50;max-width:min(380px,calc(100vw - 16px));padding:2px 8px;color:var(--k);background:var(--w);border:1px solid var(--k);font:11px/16px var(--mono);pointer-events:none}
.tip b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip table{border-collapse:collapse}.tip td.k{white-space:nowrap}.tip td{padding:0;vertical-align:top}.tip td+td{padding-left:12px}
.tip .k,.inspect dt,.kv dt{color:var(--g3)}
.tip .bad,.inspect .bad,.kv .bad{color:var(--bad)}

/* inspection: bordered box, mono facts */
.inspect{margin:8px 12px 12px;border:1px solid var(--k);background:var(--w)}
.inspect-h{display:flex;align-items:center;gap:8px;min-height:22px;padding:0 0 0 8px;border-bottom:1px solid var(--k)}
.inspect-h strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspect-h button{border:0;border-left:1px solid var(--k);width:24px;height:22px;padding:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0 16px;margin:0;padding:4px 8px;font:11px/18px var(--mono)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media(min-width:900px){.inspect .kv{grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr)}}
/* ---------- D · waterfall ---------- */
.d-scroll{overflow:auto;max-height:calc(100dvh - 120px)}
.d-table{width:100%;table-layout:fixed;border-collapse:collapse;font:11px/18px var(--mono)}
.d-table col.c-start{width:calc(8ch + 16px)}
.d-table col.c-call{width:min(32ch,22vw)}
.d-table th{position:sticky;top:0;z-index:4;background:var(--w);border-bottom:1px solid var(--k);font-weight:400;color:var(--g3);text-align:left;padding:2px 8px;white-space:nowrap}
.d-table td{padding:0 8px;text-align:left;vertical-align:top;white-space:nowrap;border-bottom:1px solid var(--g1)}
.d-table td.name{overflow:hidden;text-overflow:ellipsis}
.d-table td.name .a{color:var(--g3)}
.d-table td.wf{position:relative;padding:0}
.wfi{position:absolute;top:0;bottom:0;left:8px;right:12px}
.d-table tr[data-did]{cursor:pointer}
.d-table tr.ev-row:hover td{background:var(--g1)}
.d-table tr.sel td:not(.wf){background:var(--k)!important;color:var(--w)}
.d-table tr.sel td.name{white-space:normal;overflow-wrap:anywhere}
.d-table tr.sel td .a,.d-table tr.sel td .bad{color:var(--w)}
.d-table .bad{color:var(--bad)}
.d-table tr.side td{color:var(--g3)}
.d-table tr.band td{background:var(--k);color:var(--w);border-bottom:0;font:13px/20px var(--text);padding-top:4px;padding-bottom:4px;vertical-align:top}
.d-table tr.band td.n{font:11px/20px var(--mono)}
.d-table tr.band td.txt{white-space:normal;overflow-wrap:anywhere}
.d-table tr.alertrow td,.d-table tr.alertrow:hover td{background:var(--alert);color:#fff;overflow:hidden;text-overflow:ellipsis}
.d-table tr.alertrow.sel td{white-space:normal;overflow-wrap:anywhere}
.d-table tr.gaprow td{background:var(--g1);color:var(--g3);text-align:center}
.d-table tr.detail td{background:var(--g1);white-space:normal;padding:2px 8px 6px}
.wfbar{position:absolute;top:4px;height:10px}
.wfbar.inst{width:2px;background:var(--k)}.wfbar.inst.bad{background:var(--bad)}
.tip b.full{white-space:normal;overflow-wrap:anywhere}
.d-ind{display:inline-block;width:2ch;color:var(--g2)}
.d-nest{border-left:1px solid var(--k);padding-left:1ch;margin-left:.5ch}

[hidden]{display:none!important}
/* ================= waterfall host (variant D) ================= */
.wf{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;background:var(--w)}
.wf-scroll{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 12px;border-bottom:1px solid var(--g1);font:11px/20px var(--mono);background:var(--w)}
.vbar .sep{width:8px}
.vbar button[aria-pressed=true]{background:var(--k);color:var(--w)}
.d-table th{border-bottom:0!important;box-shadow:inset 0 -1px 0 var(--k)}
.d-table tr.band.thin td{padding-top:0;padding-bottom:0;font:11px/14px var(--mono)}
.d-table tr.hot td:not(.wf),.d-table tr.pin td:not(.wf){background:var(--g1)}
.d-table tr.hot td:first-child,.d-table tr.pin td:first-child,.d-table tr.inview td:first-child{box-shadow:inset 3px 0 0 var(--k)}
.d-table tr.band.inview td:first-child,.d-table tr.band.hot td:first-child{box-shadow:inset 3px 0 0 var(--g2)}
.d-table tr.band.hot td{background:var(--g3)}
.tip{position:fixed;z-index:80;max-width:min(380px,calc(100vw - 16px));padding:2px 8px;color:var(--k);background:var(--w);border:1px solid var(--k);font:11px/16px var(--mono);pointer-events:none}
.tip[hidden]{display:none}
.tip table{border-collapse:collapse}.tip td.k{white-space:nowrap}.tip td{padding:0;vertical-align:top}.tip td+td{padding-left:12px}

/* transcript ↔ timeline link */
.tx-hot{background:var(--g1)!important}
.tx-hot>summary .activity-rail-marker{background:var(--g1)!important}
.rec-you.tx-hot,.rec-alert .alert-band.tx-hot{background:var(--k)!important;outline:2px solid var(--g2);outline-offset:-5px}
.rec-alert .alert-band.tx-hot{background:var(--alert)!important}

/* 1 · route */
.route-tl{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}
.route-tl[hidden]{display:none}

/* 2 · flip */
#tx.flipped>.orb-transcript-content{display:none}
#tx>.d-table{display:none}
#tx.flipped>.d-table{display:table}

/* 3 · per turn */
.band-time{position:absolute;top:9px;right:8px}
.rec-you:has(.band-time){padding-right:40px}

function llm(lane,t,o){
  const model=o.model||(lane==='root'?'sol':'terra');

  const inp=err?0:ctx[lane],cr=err?0:Math.min(lastIn[lane],inp),out=err?0:(o.out||0),p=PRICE[model];
  const e=add({kind:'llm',lane,model,start:t,ttft:t+w,thinkEnd:t+w+th,end:t+w+th+st,inp,cr,out,cost:((inp-cr)*p[0]+cr*p[1]+out*p[2])/1e6,limit:CTX_LIMIT[model],stop:o.stop||'toolUse',head:o.head,text:o.text,say:o.say,err:o.err,attempt:o.attempt,backoff:o.backoff});

}

function step(lane,t,o,list){const L=llm(lane,t,o);const end=list?calls(lane,L.end+30,L,list):L.end;return {L,t:end+(list?80:0)}}
function inner(code,off,dur,name,arg,ok,out){return add({kind:'inner',lane:code.lane,name,arg,start:code.start+off*S,end:code.start+(off+dur)*S,ok,out,parent:code.id})}

function makeWF({turns=null,bands='full'}={}){
  const st={show:{llm:true,tools:true,luna:true,host:true},errors:false,open:null};
  const bar=document.createElement('div');bar.className='vbar';
  const table=document.createElement('table');table.className='d-table';
  const W={st,bar,table,scroll:null,onHover:null,onRender:null};
  const vis=e=>{if(st.errors&&!failed(e)&&e.kind!=='abort'&&e.kind!=='alert')return false;if(e.kind==='llm'||e.kind==='compact')return st.show.llm;if(['tool','code','spawn','inner'].includes(e.kind))return st.show.tools;if(e.kind==='luna')return st.show.luna;if(e.kind==='life')return st.show.host;return !st.errors||e.kind==='abort'||e.kind==='alert'};
  function band(T){
    const det=st.open===T.user.id?dDetail(dTurnFacts(T)):'';
    if(thin())return `<tr class="band thin" data-did="${T.user.id}" data-turn="${T.n}"><td class="n">${clock(T.start)}</td><td colspan="2"></td></tr>`+det;
    return `<tr class="band" data-did="${T.user.id}" data-turn="${T.n}"><td class="n">${clock(T.start)}</td><td class="txt" colspan="2">${T.user.mode==='queued'?'<span class="rec-status">queued</span>':''}${esc(T.user.text)}</td></tr>`+det;
  }
  // Beside the transcript (thin bands), rows do not repeat text the transcript already shows.
  const thin=()=>bands==='thin'||(bands==='auto'&&innerWidth>600);
  function row(e,v0,v1){
    const sel=st.open===e.id?' sel':'';
    if(e.kind==='alert')return `<tr class="alertrow${sel}" data-did="${e.id}"><td>${clock(e.start)}</td><td colspan="2">${thin()?'':esc(e.text)}</td></tr>`+(sel?dDetail(dFacts(e)):'');
    const [name,arg]=dCall(e),bad=failed(e)||e.kind==='abort',side=e.kind==='luna'||e.kind==='life';
    const pre=(e.lane==='sub1'?'<span class="d-nest"></span>':'')+(e.kind==='inner'?'<span class="d-ind">└</span>':'')+(e.kind==='life'?tile(e.state,'s12')+' ':'');
    const nm=e.kind==='user'?`<span class="rec-status">${esc(name)}</span>${thin()?'':esc(arg)}`:`<span${bad?' class="bad"':''}>${esc(name)}</span> <span class="a">${esc(arg)}</span>`;
    return `<tr class="ev-row${side?' side':''}${sel}" data-did="${e.id}"><td>${clock(e.start)}</td><td class="name">${pre}${nm}</td><td class="wf"><div class="wfi">${dWf(e,v0,v1)}</div></td></tr>`+(sel?dDetail(dFacts(e)):'');
  }
  W.render=()=>{
    const chip=(k)=>`<button type="button" data-show="${k}" aria-pressed="${st.show[k]}">${k}</button>`;
    bar.innerHTML=`${chip('llm')}${chip('tools')}${chip('luna')}${chip('host')}<span class="sep"></span><button type="button" data-errors aria-pressed="${st.errors}">errors</button>`;
    const rows=[];
    for(const T of TURNS.filter(T=>!turns||turns.includes(T.n))){
      const next=TURNS.find(x=>x.n===T.n+1),hi=next?next.start:Infinity;
      const gaps=GAPS.filter(g=>g.start>=T.start&&g.start<hi);let gi=0;
      const flush=t=>{while(gi<gaps.length&&gaps[gi].start<=t){const g=gaps[gi++];rows.push(`<tr class="gaprow" data-did="${g.id}"><td colspan="3">${g.reason!=='waiting'?tile(g.reason,'s12')+' ':''}${fmtDur(g.end-g.start)}</td></tr>`)}};
      const evs=EV.filter(e=>e.turn===T.n&&e!==T.user&&vis(e));
      const v0=T.start,v1=Math.max(T.end,...evs.filter(e=>e.kind==='luna').map(e=>e.end));
      if(bands!=='none')rows.push(band(T));
      for(const e of evs){flush(e.start);if(e.kind==='life'&&(e.state==='sleeping'||e.state==='stopped'))continue;rows.push(row(e,v0,v1))}
      flush(Infinity);
    }
    table.innerHTML=`<colgroup><col class="c-start"><col class="c-call"><col></colgroup><thead><tr><th>start</th><th>call</th><th></th></tr></thead><tbody>${rows.join('')}</tbody>`;
    W.hot&&W.setHot(W.hot);W.pin&&W.setPin(W.pin);

  };
  W.rows=()=>[...table.querySelectorAll('tbody tr[data-did]')];
  W.rowFor=id=>table.querySelector(`tbody tr[data-did="${id}"]`);
  W.rowNear=id=>{const r=W.rowFor(id);if(r)return r;const t=byId[id]?.start??0;return W.rows().find(r=>(byId[r.dataset.did]?.start??0)>=t)||W.rows().pop()};
  W.thH=()=>table.tHead?table.tHead.offsetHeight:0;
  W.topRow=()=>{const top=W.scroll.getBoundingClientRect().top+W.thH();return W.rows().find(r=>r.getBoundingClientRect().bottom>top+1)};
  W.scrollToRow=(r,y)=>{const h=W.scroll;h.scrollTop+=r.getBoundingClientRect().top-h.getBoundingClientRect().top-(y??W.thH())};
  W.setPin=id=>{W.pin=id;table.querySelectorAll('tr.pin').forEach(r=>r.classList.remove('pin'));if(id)W.rowFor(id)?.classList.add('pin')};
  W.setHot=ids=>{W.hot=ids;table.querySelectorAll('tr.hot').forEach(r=>r.classList.remove('hot'));for(const id of ids||[])W.rowFor(id)?.classList.add('hot')};
  bar.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.show)st.show[b.dataset.show]=!st.show[b.dataset.show];else if(b.hasAttribute('data-errors'))st.errors=!st.errors;W.render()});
  table.addEventListener('click',ev=>{const tr=ev.target.closest('tr[data-did]');if(!tr||tr.classList.contains('gaprow'))return;st.open=st.open===tr.dataset.did?null:tr.dataset.did;W.render()});

    if(tr.classList.contains('gaprow'))showTip(id,ev,tipHTML(byId[id]));
    else if(tr.dataset.turn)showTip(id,ev,`<b>turn ${tr.dataset.turn}</b><table>${dTurnFacts(turnOf(+tr.dataset.turn)).map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`);
    else showTip(id,ev,dTip(byId[id]));
  });
  table.addEventListener('pointerleave',()=>{hideTip();W.onHover&&W.onHover(null)});
  return W;
}

/* composer with command mode (docs/web-ui.md, command mode) */
const C={mode:'message',sel:0};
function commandOptions(text){const o=['model','thinking','compact'];if(PROP===2)o.push(P2.on?'transcript':'timeline');return o.filter(n=>n.startsWith(text.trim().toLowerCase()))}
function wireComposer(){
  const input=$('#input'),line=$('.composer-line');
  const paint=()=>{
    $('#prefix').textContent=C.mode==='command'?'/':'>';$('#pad .composer-prefix').textContent=C.mode==='command'?'/':'>';
    $('#pad .composer-draft-preview').textContent=input.value;
    line.querySelector('.command-picker')?.remove();
    if(C.mode!=='command')return;
    const opts=commandOptions(input.value);C.sel=Math.min(C.sel,Math.max(0,opts.length-1));
    const p=document.createElement('div');p.className='command-picker';p.setAttribute('role','listbox');p.setAttribute('aria-label','Commands');
    p.innerHTML=opts.length?opts.map((o,i)=>`<button type="button" role="option" aria-selected="${i===C.sel}" class="${i===C.sel?'selected':''}" data-cmd="${o}"><span>${o}</span><span aria-hidden="true">${o==='model'||o==='thinking'?'→':''}</span></button>`).join(''):'<div class="command-empty">No matching command or value.</div>';
    p.addEventListener('mousedown',ev=>ev.preventDefault());
    p.addEventListener('click',ev=>{const b=ev.target.closest('[data-cmd]');if(b)choose(b.dataset.cmd)});
    line.prepend(p);
  };
  const reset=()=>{C.mode='message';C.sel=0;input.value='';paint()};
  const choose=cmd=>{if(cmd==='model'||cmd==='thinking'){input.value=cmd+' ';paint();return}reset();if(cmd==='timeline'||cmd==='transcript'){fold();P2.flip(cmd==='timeline')}};
  const fold=()=>{$('#composer').dataset.expanded='false';$('#pad').setAttribute('aria-expanded','false');input.blur()};
  C.paint=paint;
  input.addEventListener('keydown',ev=>{
    if(C.mode==='command'){
      const opts=commandOptions(input.value);
      if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();C.sel=opts.length?(C.sel+(ev.key==='ArrowDown'?1:-1)+opts.length)%opts.length:0;paint();return}
      if(ev.key==='Enter'||(ev.key==='Tab'&&!ev.shiftKey)){ev.preventDefault();if(opts[C.sel])choose(opts[C.sel]);return}
      if(ev.key==='Escape'||(ev.key==='Backspace'&&input.value===''&&input.selectionStart===0)){ev.preventDefault();reset();return}
    }
    if(ev.key==='/'&&C.mode==='message'&&input.selectionStart===0&&input.selectionEnd===0&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){ev.preventDefault();C.mode='command';C.sel=0;paint()}
  });
  input.addEventListener('input',()=>{if(C.mode==='message'&&input.value.startsWith('/')){C.mode='command';input.value=input.value.slice(1)}C.sel=0;paint()});
  $('#pad').addEventListener('click',()=>{$('#composer').dataset.expanded='true';$('#pad').setAttribute('aria-expanded','true');input.focus()});
  $('#fold').addEventListener('click',fold);
}

/* ======================================================================
   2 · Flip — `/timeline` in command mode turns the transcript scroller into
   the waterfall; `/transcript` or Escape turns it back. The row (or message)
   at the top keeps its height on screen in both directions.
   ====================================================================== */
const P2={on:false,W:null,
  init(){
    P2.W=makeWF({bands:'full'});P2.W.scroll=$('#tx');$('#tx').append(P2.W.table);
    P2.W.bar.hidden=true;$('#hscroll').append(P2.W.bar);
    document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&P2.on&&!ev.target.closest('textarea'))P2.flip(false)});
  },
  flip(on){
    if(on===P2.on)return;const W=P2.W,sc=$('#tx');
    if(on){
      const a=topTx();W.render();P2.on=true;sc.classList.add('flipped');W.bar.hidden=false;
      const id=a&&idsOf(a.el)[0];const r=id&&W.rowNear(id);
      if(r)W.scrollToRow(r,Math.max(W.thH(),a.off));
    }else{
      const r=W.topRow(),off=r?r.getBoundingClientRect().top-sc.getBoundingClientRect().top:0;
      P2.on=false;sc.classList.remove('flipped');W.bar.hidden=true;hideTip();
      const el=r&&txFor(r.dataset.did);if(el)scrollTxTo(el,Math.max(0,off-W.thH()));
    }
    C.paint&&C.paint();
  }};

/* ======================================================================
   3 · Per turn — a waterfall control on each paper band swaps that turn's
   activity for its own waterfall (same rows, turn time scale); the band
   stays put on screen. Several turns can be open at once.
   ====================================================================== */
const P3={
  init(){
    $('#hist').addEventListener('click',ev=>{
      const b=ev.target.closest('.band-time');if(!b)return;
      const sec=b.closest('.turn'),n=+sec.dataset.turn,band=b.closest('.rec-you'),body=sec.querySelector('.turn-body'),box=sec.querySelector('.turn-wf');
      const y=band.getBoundingClientRect().top,open=b.getAttribute('aria-pressed')!=='true';
      if(open){if(!box.W){box.W=makeWF({turns:[n],bands:'none'});mountWF(box.W,box);box.W.scroll=$('#tx')}box.W.render();body.hidden=true;box.hidden=false}
      else{box.hidden=true;body.hidden=false;hideTip()}
      b.setAttribute('aria-pressed',String(open));
      $('#tx').scrollTop+=band.getBoundingClientRect().top-y;
    });
  }};

/* ======================================================================
   4 · Rail drawer — the activity rail is the handle. Click (or drag) a
   point on it: a drawer opens with the waterfall at that moment; hovering
   rows lights the transcript and vice versa. Phone: long-press a rail row.
   ====================================================================== */
const P4={W:null,open:false,drag:null,
  init(){
    const d=document.createElement('aside');d.className='drawer';d.id='drawer';d.hidden=true;d.setAttribute('aria-label','Timeline');
    d.innerHTML='<div class="drawer-head"></div>';$('#work').append(d);
    const W=P4.W=makeWF({bands:'auto'});
    d.querySelector('.drawer-head').append(W.bar);
    d.querySelector('.drawer-head').insertAdjacentHTML('beforeend',`<button type="button" class="icon-button" id="drawer-close" aria-label="Close timeline" title="close">${icon('x')}</button>`);
    const s=document.createElement('div');s.className='wf-scroll';s.append(W.table);d.append(s);W.scroll=s;s.addEventListener('scroll',hideTip,{passive:true});
    $('#drawer-close').addEventListener('click',()=>P4.close());
    W.onHover=id=>{$$('#hist .tx-hot').forEach(e=>e.classList.remove('tx-hot'));if(!id)return;const el=txFor(id);if(el){el.classList.add('tx-hot');nearestInView(el)}};
    $('#hist').addEventListener('pointerover',ev=>{if(!P4.open||ev.pointerType!=='mouse')return;const el=ev.target.closest('[data-tx]');W.setHot(el?idsOf(el):null)});
    $('#hist').addEventListener('pointerleave',()=>{if(P4.open)W.setHot(null)});
    $('#hist').addEventListener('toggle',()=>P4.layout(),true);
    document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&P4.open)P4.close()});
    // rail hit strips
    const txc=$('#txc');
    txc.addEventListener('pointerdown',ev=>{const h=ev.target.closest('.rail-hit');if(!h)return;ev.preventDefault();h.setPointerCapture(ev.pointerId);P4.drag={id:ev.pointerId};P4.at(ev.clientY)});
    txc.addEventListener('pointermove',ev=>{if(P4.drag&&P4.drag.id===ev.pointerId)P4.at(ev.clientY)});
    const end=ev=>{if(P4.drag&&P4.drag.id===ev.pointerId)P4.drag=null};
    txc.addEventListener('pointerup',end);txc.addEventListener('pointercancel',end);
    // phone: long-press a rail row
    let lp=null,swallow=false;
    $('#hist').addEventListener('pointerdown',ev=>{const s=ev.target.closest('.activity-rail-row>summary');if(!s||ev.button>0)return;const x=ev.clientX,y=ev.clientY;clearTimeout(lp?.t);lp={x,y,t:setTimeout(()=>{lp=null;swallow=true;const ids=idsOf(s.parentElement);P4.openAt(byId[ids[0]].start,ids)},500)}});
    const cancel=()=>{if(lp){clearTimeout(lp.t);lp=null}};
    $('#hist').addEventListener('pointermove',ev=>{if(lp&&Math.hypot(ev.clientX-lp.x,ev.clientY-lp.y)>8)cancel()});
    $('#hist').addEventListener('pointerup',cancel);$('#hist').addEventListener('pointercancel',cancel);$('#tx').addEventListener('scroll',cancel,{passive:true});
    $('#hist').addEventListener('click',ev=>{if(swallow){swallow=false;ev.preventDefault();ev.stopPropagation()}},true);
    $('#hist').addEventListener('contextmenu',ev=>{if(ev.target.closest('.activity-rail-row>summary'))ev.preventDefault()});
    REFLOW.push(()=>{if(P4.open)P4.W.render();P4.layout()});
    P4.layout();
  },
  // One strip per visible stretch of rail between two chevrons; each remembers the rows it joins.
  layout(){
    const txc=$('#txc');if(!txc)return;txc.querySelectorAll('.rail-hit').forEach(h=>h.remove());
    const base=txc.getBoundingClientRect();const out=[];
    for(const bd of $$('#hist .rec-orb>.rec-bd')){
      if(!bd.offsetParent)continue;
      const rows=[...bd.children].filter(c=>c.matches('.activity-rail-row'));
      for(let i=0;i<rows.length;i++){
        const r=rows[i],m=r.querySelector('.activity-rail-marker').getBoundingClientRect(),cx=m.left+m.width/2-base.left,cy=m.top+m.height/2-base.top;
        const nx=r.nextElementSibling&&r.nextElementSibling.matches('.activity-rail-row')?r.nextElementSibling:null;
        let y1;if(nx){const n=nx.querySelector('.activity-rail-marker').getBoundingClientRect();y1=n.top+n.height/2-base.top-7}else if(r.open)y1=r.getBoundingClientRect().bottom-base.top;else continue;
        const y0=cy+7;if(y1-y0<3)continue;
        out.push(`<div class="rail-hit" data-a="${r.dataset.tx}" data-b="${(nx||r).dataset.tx}" style="left:${cx-5.5}px;top:${y0}px;height:${y1-y0}px"></div>`);
      }
    }
    txc.insertAdjacentHTML('beforeend',out.join(''));
  },
  // A y position on the rail → a moment: interpolate from the end of the row above to the start of the row below.
  at(clientY){
    const hits=$$('#txc .rail-hit');if(!hits.length)return;
    let best=null,bd=Infinity;for(const h of hits){const r=h.getBoundingClientRect(),d=clientY<r.top?r.top-clientY:clientY>r.bottom?clientY-r.bottom:0;if(d<bd){bd=d;best=h}}
    const r=best.getBoundingClientRect(),f=Math.min(1,Math.max(0,(clientY-r.top)/r.height));
    const own=k=>{const l=TX_IDS[k].map(i=>byId[i]).filter(e=>e.lane!=='sub1'&&e.kind!=='luna'&&e.kind!=='life'&&e.kind!=='gap');return l.length?l:TX_IDS[k].map(i=>byId[i])};const A=own(best.dataset.a),B=own(best.dataset.b);
    let ta=best.dataset.a===best.dataset.b?Math.min(...A.map(e=>e.start)):Math.max(...A.map(e=>e.end)),tb=best.dataset.a===best.dataset.b?Math.max(...A.map(e=>e.end)):Math.min(...B.map(e=>e.start));
    tb=Math.max(ta,tb);hits.forEach(h=>h.classList.toggle('on',h===best));
    const el=$(`#hist [data-tx="${best.dataset.a}"]`),sc=$('#tx').getBoundingClientRect();
    P4.openAt(ta+(tb-ta)*f,null,{el,off:el.getBoundingClientRect().top-sc.top});
  },
  openAt(t,ids,anchor){
    const W=P4.W;
    if(!P4.open){const a=anchor||topTx();P4.open=true;$('#drawer').hidden=false;W.render();if(a)scrollTxTo(a.el,a.off);P4.layout()}
    const rows=W.rows().filter(r=>!r.classList.contains('band'));let pick=rows[0];for(const r of rows){if((byId[r.dataset.did]?.start??0)<=t)pick=r;else break}
    if(ids){const r=ids.map(i=>W.rowFor(i)).find(Boolean);if(r)pick=r}
    if(pick){W.setPin(pick.dataset.did);W.scrollToRow(pick,W.scroll.clientHeight/3)}
  },
  close(){const a=topTx();P4.open=false;$('#drawer').hidden=true;P4.W.setHot(null);P4.W.setPin(null);$$('#txc .rail-hit.on').forEach(h=>h.classList.remove('on'));$$('#hist .tx-hot').forEach(e=>e.classList.remove('tx-hot'));hideTip();if(a)scrollTxTo(a.el,a.off);P4.layout()}
};

/* ======================================================================
   5 · Dock — a grip on the composer's top rule pulls a waterfall up from
   under the transcript. Drag to size, click to toggle. Both panes scroll
   together: whichever one you touch leads; the rows on screen in the
   transcript carry a black edge in the dock.
   ====================================================================== */
const P5={W:null,open:false,h:0,lead:'tx',busy:false,
  init(){
    const g=document.createElement('div');g.className='dock-grip';g.innerHTML='<button type="button" id="grip" aria-label="Timeline" title="timeline" aria-expanded="false"></button>';
    const d=document.createElement('div');d.className='dock';d.id='dock';d.hidden=true;d.setAttribute('aria-label','Timeline');
    $('#body').insertBefore(g,$('#composer'));$('#body').insertBefore(d,$('#composer'));
    const W=P5.W=makeWF({bands:'thin'});mountWF(W,d);
    W.onRender=()=>{P5.mark();if(P5.lead==='tx')P5.follow()};
    const grip=$('#grip');let drag=null;
    grip.addEventListener('pointerdown',ev=>{ev.preventDefault();grip.setPointerCapture(ev.pointerId);drag={y:ev.clientY,h:P5.open?P5.h:0,moved:false}});
    grip.addEventListener('pointermove',ev=>{if(!drag)return;const dy=ev.clientY-drag.y;if(Math.abs(dy)>3)drag.moved=true;if(!drag.moved)return;const h=drag.h-dy;if(h>24){if(!P5.open)P5.show(true,h);else P5.size(h)}else if(P5.open)P5.size(24)});
    grip.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(!d.moved)P5.show(!P5.open);else if(P5.open&&P5.h<64)P5.show(false)});
    grip.addEventListener('pointercancel',()=>{drag=null});
    grip.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();P5.show(!P5.open)}else if(P5.open&&(ev.key==='ArrowUp'||ev.key==='ArrowDown')){ev.preventDefault();P5.size(P5.h+(ev.key==='ArrowUp'?24:-24))}});
    const claim=who=>()=>{P5.lead=who};
    for(const t of ['wheel','touchstart','pointerdown','keydown']){$('#tx').addEventListener(t,claim('tx'),{passive:true});W.scroll.addEventListener(t,claim('dock'),{passive:true})}
    let raf=0;const on=src=>()=>{if(!P5.open||P5.busy)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(src==='tx'){P5.mark();if(P5.lead==='tx')P5.follow()}else if(P5.lead==='dock')P5.pull()})};
    $('#tx').addEventListener('scroll',on('tx'),{passive:true});W.scroll.addEventListener('scroll',on('dock'),{passive:true});
    document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&P5.open&&!ev.target.closest('textarea'))P5.show(false)});
    REFLOW.push(()=>{if(P5.open)P5.size(P5.h)});
  },
  max(){return $('#body').clientHeight-(innerWidth<=600?96:120)},
  size(h){P5.h=Math.max(24,Math.min(P5.max(),Math.round(h)));$('#dock').style.height=P5.h+'px'},
  show(on,h){
    const a=topTx();
    P5.open=on;$('#dock').hidden=!on;$('#grip').setAttribute('aria-expanded',String(on));
    if(on){P5.size(h??$('#body').clientHeight*(innerWidth<=600?.5:.42));P5.lead='tx';P5.W.render()}else hideTip();
    if(a)scrollTxTo(a.el,a.off);
    if(on)P5.follow();
  },
  // transcript leads: the dock puts the transcript's top message's row at its top
  follow(){const a=topTx();if(!a)return;const W=P5.W,id=idsOf(a.el)[0],r=id&&W.rowNear(id);if(!r)return;P5.busy=true;W.scrollToRow(r);requestAnimationFrame(()=>{P5.busy=false})},
  // dock leads: the transcript puts the dock's top row's message at its top
  pull(){const r=P5.W.topRow();const el=r&&txFor(r.dataset.did);if(!el)return;P5.busy=true;scrollTxTo(el,0);P5.mark();requestAnimationFrame(()=>{P5.busy=false})},
  mark(){
    const W=P5.W,sc=$('#tx').getBoundingClientRect(),ids=new Set();
    for(const el of $$('#hist [data-tx]')){const r=el.getBoundingClientRect();if(r.bottom>sc.top&&r.top<sc.bottom)for(const id of idsOf(el))ids.add(id)}
    W.table.querySelectorAll('tr.inview').forEach(r=>r.classList.remove('inview'));
    for(const r of W.rows())if(ids.has(r.dataset.did))r.classList.add('inview');
  }};

/* ---------------- boot ---------------- */
if(PROP>=1&&PROP<=5)frame();else shell();
</script>
</body>
</html>
