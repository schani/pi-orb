<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-orb · activity strip</title>
<style>
@font-face { font-family: "Iosevka Etoile"; font-weight: 400; src: url("fonts/iosevka-etoile-regular-ad661117aee2.woff2"), url("../apps/web/public/fonts/iosevka-etoile-regular-ad661117aee2.woff2"); }
@font-face { font-family: "Iosevka Etoile"; font-weight: 700; src: url("fonts/iosevka-etoile-bold-94f81a8590a8.woff2"), url("../apps/web/public/fonts/iosevka-etoile-bold-94f81a8590a8.woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("fonts/jetbrains-mono-regular-fa06becb7e66.woff2"), url("../apps/web/public/fonts/jetbrains-mono-regular-fa06becb7e66.woff2"); }
:root {
  --w: #fff; --k: #000; --g1: #f2f2f2; --g2: #999; --g3: #555;
  --ok: #1a7e37; --bad: #b42318;
  --text: "Iosevka Etoile", serif; --mono: "JetBrains Mono", monospace;
  --row: 20px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--w); color: var(--k); font: 13px/var(--row) var(--text); }
header.study { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; height: 32px; padding: 0 12px; background: var(--w); border-bottom: 1px solid var(--k); }
header.study b { font-weight: 700; }
header.study nav { display: flex; }
header.study nav:first-of-type { margin-left: auto; }
header.study a, header.study button { height: 22px; margin-left: -1px; padding: 0 8px; color: var(--k); background: none; border: 1px solid var(--k); font: inherit; line-height: 20px; text-decoration: none; cursor: pointer; }
header.study a:hover, header.study button:hover { background: var(--g1); }
header.study button[aria-pressed="true"] { color: var(--w); background: var(--k); }
section { max-width: 920px; margin: 0 auto; padding: 24px 12px 28px; border-bottom: 1px solid var(--g2); scroll-margin-top: 32px; }
section h2 { margin: 0; font-size: 13px; font-weight: 700; }
section p.why { margin: 0 0 10px; color: var(--g3); }
.frame { position: relative; border: 1px solid var(--k); }

/* ---- production transcript CSS ---- */
.rec-you { padding: 9px 12px; color: var(--w); background: var(--k); }
.rec-orb { padding: 4px 12px; }
.rec-bd { min-width: 0; }
.prose { margin: 4px 0; }
.activity-rail-row { position: relative; margin-bottom: 4px; background: var(--w); }
.activity-rail-row > summary { display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto; gap: 8px; align-items: center; min-height: var(--row); padding: 0 8px; list-style: none; cursor: pointer; user-select: none; }
summary::-webkit-details-marker { display: none; }
.activity-rail-row > summary:hover { background: var(--g1); }
.activity-rail-marker { position: relative; z-index: 2; width: 1ch; height: 12px; line-height: 12px; color: var(--g3); background: var(--w); text-align: center; }
.activity-rail-marker::before { content: "\25b8"; }
.activity-rail-row[open] > summary .activity-rail-marker::before { content: "\25be"; }
.activity-rail-summary { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-rail-headline, .activity-rail-metric { color: var(--g3); white-space: nowrap; }
.running > summary .activity-rail-marker, .running > summary .activity-rail-label { color: var(--ok); }
.failed > summary .activity-rail-marker, .failed > summary .activity-rail-label, .failed > summary .activity-rail-metric { color: var(--bad); }
.body { padding: 2px 8px 4px calc(2ch + 16px); color: var(--g3); background: var(--g1); }
.code { color: var(--k); font: 12px/18px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.body > .activity-rail-row { margin: 2px 0; background: var(--g1); }
.body > .activity-rail-row > summary { padding: 0; }
.body > .activity-rail-row > summary:hover { background: var(--w); }
.body > .activity-rail-row .activity-rail-marker { background: var(--g1); }
.body > .activity-rail-row > .body { padding-left: calc(2ch + 8px); background: var(--w); }

/* ---- shared strip scaffolding ---- */
.mid { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mid > .activity-rail-label { flex: none; }
.strip { position: relative; display: flex; align-items: center; min-width: 0; }
.readout { min-height: var(--row); padding-left: calc(2ch + 16px); overflow: hidden; color: var(--g3); text-overflow: ellipsis; white-space: nowrap; }
.readout b, .rk { color: var(--k); font-weight: 400; }
.readout .bad { color: var(--bad); }
.readout .ok { color: var(--ok); }
.picked:not(:empty) { margin-bottom: 4px; padding-left: calc(2ch + 16px); }
.picked > .activity-rail-row { margin: 0 0 2px; }
.picked .activity-rail-row > summary { padding: 0; }
@keyframes blink { 50% { opacity: .15; } }
.running-blink { animation: blink 1s steps(2) infinite; }

/* 1 cells */
.v1 .strip { flex: 1; flex-wrap: wrap; gap: 2px; padding: 4px 0; }
.v1 .c { width: 6px; height: 12px; background: var(--k); }
.v1 .c.thinking { height: 6px; background: none; border: 1px solid var(--g2); }
.v1 .c.failed { background: var(--bad); }
.v1 .c.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v1 .c.h { outline: 1px solid var(--k); outline-offset: 1px; }

/* 2 barcode */
.v2 .strip { flex: none; gap: 1px; height: 12px; align-items: flex-end; cursor: crosshair; }
.v2 .c { width: 1px; height: 12px; background: var(--k); }
.v2 .c.thinking { height: 5px; background: var(--g2); }
.v2 .c.failed { background: var(--bad); }
.v2 .c.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v2 .c.h { height: 16px; margin-bottom: -2px; background: var(--k); }
.v2 .c.h.thinking { background: var(--g3); }
.v2 .c.h.failed { background: var(--bad); }
.v2 .c.h.running { background: var(--ok); }
.v2 .hl { min-width: 0; overflow: hidden; color: var(--g3); text-overflow: ellipsis; white-space: nowrap; }

/* 3 dots */
.v3 .strip { flex: 1; height: var(--row); overflow: hidden; align-items: stretch; }
.v3 .c { flex: none; display: flex; align-items: center; justify-content: center; width: 12px; cursor: pointer; }
.v3 .c::before { width: 6px; height: 6px; border-radius: 50%; background: var(--k); content: ""; }
.v3 .c.thinking::before { width: 3px; height: 3px; background: var(--g2); }
.v3 .c.failed::before { background: var(--bad); }
.v3 .c.running::before { background: var(--ok); box-shadow: 0 0 0 2px var(--w), 0 0 0 3px var(--ok); animation: blink 1s steps(2) infinite; }
.v3 .c.h { background: #ddd; }
.v3 .c.h::before { transform: scale(1.6); }
.v3 .c.h.running::before { box-shadow: 0 0 0 2px #ddd, 0 0 0 3px var(--ok); }
.v3 .more { flex: none; align-self: center; margin-right: 4px; color: var(--g3); cursor: pointer; }
.v3 .more { flex: none; color: var(--g3); cursor: pointer; }
.v3 .more:hover { color: var(--k); text-decoration: underline; }
.tip { position: absolute; z-index: 20; max-width: 60ch; padding: 0 6px; overflow: hidden; color: var(--w); background: var(--k); text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.tip .bad { color: #ff7a6b; }
.tip .ok { color: #59d77f; }
.tip .dim { color: #aaa; }

/* 4 glyphs */
.v4 .strip { flex: 1; overflow-x: auto; scrollbar-width: none; font: 13px/20px var(--mono); white-space: nowrap; }
.v4 .strip::-webkit-scrollbar { display: none; }
.v4 .c { display: inline-block; width: 1ch; text-align: center; cursor: pointer; }
.v4 .c.thinking { color: var(--g2); }
.v4 .c.failed { color: var(--bad); }
.v4 .c.running { color: var(--ok); animation: blink 1s steps(2) infinite; }
.v4 .c.h { color: var(--w); background: var(--k); }
.v4 .c.h.failed { background: var(--bad); }
.v4 .c.h.running { background: var(--ok); }
.v4 .fade { position: absolute; top: 0; bottom: 0; left: 0; width: 24px; background: linear-gradient(to right, var(--w), transparent); pointer-events: none; }
.v4 .ghost { padding-left: calc(2ch + 16px); }
.v4 .ghost > .activity-rail-row { margin: 0 0 2px; background: var(--g1); }
.v4 .ghost > .activity-rail-row > summary { padding: 0 4px; }
.v4 .ghost .activity-rail-marker { background: var(--g1); }

/* 5 lanes */
.v5 .strip { flex: 1; display: grid; grid-auto-flow: column; grid-template-rows: 4px 4px; gap: 1px; justify-content: start; outline: none; cursor: pointer; }
.v5 .l { width: 3px; height: 4px; background: var(--g1); }
.v5 .l.t { background: var(--g3); }
.v5 .l.success { background: var(--k); }
.v5 .l.failed { background: var(--bad); }
.v5 .l.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v5 .l.h { box-shadow: 0 -2px 0 0 var(--k), 0 2px 0 0 var(--k); }
.v5 .l.h.top { box-shadow: 0 -3px 0 0 var(--k); }
.v5 .l.h.bot { box-shadow: 0 3px 0 0 var(--k); }
.v5 .strip:focus-visible { outline: 1px dotted var(--k); outline-offset: 3px; }
.v5 .idx { color: var(--k); }

/* 6 bars + loupe */
.v6 .strip { flex: 1; gap: 1px; height: 14px; align-items: flex-end; cursor: zoom-in; }
.v6 .c { flex: none; width: 2px; height: 12px; background: var(--k); }
.v6 .c.thinking { height: 4px; background: var(--g2); }
.v6 .c.failed { background: var(--bad); }
.v6 .c.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.loupe { position: absolute; z-index: 20; padding: 4px 6px 0; background: var(--w); border: 1px solid var(--k); pointer-events: none; }
.loupe .row { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.loupe .c { width: 6px; height: 14px; background: var(--k); }
.loupe .c.thinking { height: 5px; background: none; border: 1px solid var(--g2); }
.loupe .c.failed { background: var(--bad); }
.loupe .c.running { background: var(--ok); }
.loupe .c.ctr { outline: 1px solid var(--k); outline-offset: 1px; }
.loupe .c.void { background: none; border: 0; }
.loupe .txt { max-width: 56ch; overflow: hidden; color: var(--g3); text-overflow: ellipsis; white-space: nowrap; }
.loupe .txt b { color: var(--k); font-weight: 400; }

/* 7 runs */
.v7 .strip { flex: none; gap: 1px; height: 14px; }
.v7 .seg { position: relative; flex: 0 0 auto; min-width: 1px; height: 14px; overflow: hidden; color: var(--w); background: var(--k); font: 10px/14px var(--mono); text-align: center; cursor: pointer; }
.v7 .seg.thinking { color: var(--g3); background: #ddd; }
.v7 .seg.failed { background: var(--bad); }
.v7 .seg.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v7 .seg.h { outline: 1px solid var(--k); outline-offset: 1px; }
.v7 .readout { white-space: normal; max-height: 60px; }

/* 8 band */
.v8 > summary { position: relative; padding-bottom: 6px !important; }
.v8 .bandhit { position: absolute; right: 8px; bottom: 0; left: calc(2ch + 16px); height: 9px; display: flex; align-items: flex-end; cursor: pointer; }
.v8 .band { display: flex; width: 100%; height: 3px; align-items: flex-end; }
.v8 .c { flex: 1 1 0; min-width: 0; height: 3px; background: var(--k); }
.v8 .c.thinking { background: #ccc; }
.v8 .c.failed { background: var(--bad); }
.v8 .c.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v8 .c.h { height: 7px; }
.v8 .c.sel { height: 7px; box-shadow: inset 0 0 0 1px var(--k); }

/* 9 inverted */
.v9 > summary { color: var(--w); background: var(--k) !important; }
.v9 > summary .activity-rail-marker { color: #aaa; background: var(--k); }
.v9 > summary .activity-rail-label { color: var(--w) !important; }
.v9 > summary .activity-rail-metric { color: #aaa; }
.v9 .strip { flex: none; height: 12px; align-items: flex-end; }
.v9 .c { flex: none; height: 12px; background: var(--w); }
.v9 .c.thinking { height: 5px; background: #777; }
.v9 .c.failed { background: #ff5a4a; }
.v9 .c.running { background: #3fd16b; animation: blink 1s steps(2) infinite; }
.v9 .c.h { box-shadow: 0 0 0 1px var(--k), 0 0 0 2px var(--w); }
.v9 .ro { min-width: 0; overflow: hidden; color: #bbb; text-overflow: ellipsis; white-space: nowrap; }
.v9 .ro b { color: var(--w); font-weight: 400; }
.v9 .ro .bad { color: #ff7a6b; }
.v9 .ro .ok { color: #59d77f; }

/* 10 grid */
.v10 > summary { min-height: 24px; }
.v10 .strip { flex: 1; display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, 5px); gap: 1px; justify-content: start; }
.v10 .c { width: 5px; height: 5px; background: var(--k); cursor: pointer; }
.v10 .c.thinking { background: none; border: 1px solid var(--g2); }
.v10 .c.failed { background: var(--bad); }
.v10 .c.running { background: var(--ok); animation: blink 1s steps(2) infinite; }
.v10 .c.h { outline: 1px solid var(--k); outline-offset: 1px; }
.card { position: absolute; z-index: 20; width: 52ch; padding: 4px 8px; background: var(--w); border: 1px solid var(--k); pointer-events: none; }
.card .k { display: flex; justify-content: space-between; color: var(--k); }
.card .k span:last-child { color: var(--g3); }
.card .k.bad span:first-child { color: var(--bad); }
.card .k.ok span:first-child { color: var(--ok); }
.card .t { display: -webkit-box; overflow: hidden; color: var(--g3); -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.card .code { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
</style>
</head>
<body>
<header class="study">
  <b>activity strip</b>
  <nav id="jump"></nav>
  <nav id="sizes"></nav>
  <nav><button id="live" aria-pressed="true">live</button><button id="done" aria-pressed="false">done</button></nav>
</header>
<main id="main"></main>

<script>
const VARIANTS = [
  ["v1", "Cells", "Thinking hollow and short, success black. Wraps up to three lines, then bins. Hover reads below; click opens."],
  ["v2", "Barcode", "1px ticks. Fits the width, bins when denser. Hover scrubs: the headline follows the cursor."],
  ["v3", "Dots", "One line of dots, newest on the right; older steps collapse to +N. Each dot owns a 12×20px target with no gaps between targets. Hover shows a black tip."],
  ["v4", "Glyphs", "Monospace text: · ▪ ✕. Scrolls sideways, pinned to the newest. Hover previews the step's production row; click pins it."],
  ["v5", "Lanes", "Two-lane bit register: thinking above, actions below. Bins when dense. Arrow keys step through; Enter opens."],
  ["v6", "Bars + loupe", "Dense 2px bars that fit any count. Hover opens a loupe with the surrounding steps at full size, unbinned."],
  ["v7", "Runs", "Consecutive steps of one kind merge into a segment, width by count. Hover lists the segment's steps."],
  ["v8", "Band", "The summary row stays as today; a 3px band underlines it, one slice per step. Hover swaps the row to that step; click pins."],
  ["v9", "Inverted", "Black row, cells shrink from 6px to 1px as steps accumulate, then bin. The readout lives inside the bar."],
  ["v10", "Grid", "Three-row column grid, oldest top-left. Grows sideways, bins past the width. Hover shows a card."],
];
const SIZES = [6, 35, 300, 3000];

const RAW = [
  ["n", "Receipts ready: .context/pr267-babysit/resume-guard/RESULTS.md. One-line move only; diff --check clean. Fresh configured 12 iterations PASS; full root suite queued."],
  ["t", "Clarifying reconnect behavior · Evaluating idle-timer isolation"],
  ["t", "Refreshing visible connection · Updating reset-tab setup"],
  ["t", "Checking annotated replay snapshots · Inspecting control activity API"],
  ["t", "Planning test-client reconnect · Checking client reconnect logic"],
  ["c", "text(await tools.bash({command:\"sed -n '285,345p' apps/control-plane/src/domain/control-state.ts; sed -n '190,225p' apps/control-plane/src/domain/lifecycle.ts\"}))"],
  ["t", "Selecting reconnect correction · Validating reconnect registration"],
  ["t", "Reviewing replay logic · Authorizing root-gate fix"],
  ["c", "text(await tools.steer_subagent({agent_id:\"5944:call_7f5fa0288de34514baaa159be3d3db04|ctc_03c25a7d/c2\",message:\"Authorize root-gate fix; keep diff minimal\"}))"],
  ["n", "Ignored instrumented pre/post copies now confirm exact root cause dynamically; tracked source+trace SHA256 unchanged. Post-fix setup-tab visible on first reconnect."],
  ["n", "Correction count: 42 lifecycle events pre and 42 post, messages+virtual timestamps exactly equal (not 44). Instrumentation snapshots confirm live registration."],
  ["t", "Reconnecting the test connection · Checking CI test status"],
  ["c", "text(await tools.bash({command:\"gh pr checks 267 --json name,state,link; git diff --stat; date -u +'%FT%TZ'\",timeout:30})); text(await tools.get_subagent_result({agent_id:\"5944:call_7f5f…\"}))"],
  ["n", "Reconnect fix original trace replay now diverges as expected at position 16539: baseline reconcile-loop tick at t334339.913 versus new 'store latency' checkpoint."],
  ["t", "Inspecting seed configuration"],
  ["c", "text(await tools.bash({command:\"sed -n '70,195p' apps/control-plane/src/testkit/sim.ts; python3 - <<'PY'\\nimport json\\np='test-failures/resume-guard-three-attempts.json'\\nPY\"}))"],
  ["t", "Checking recovery-state invariants · Checking unreachable recovery ordering"],
  ["t", "Checking reconnect behavior · Checking idle guard behavior"],
  ["t", "Checking test harness timing · Adjusting test timing setup"],
  ["t", "Reviewing harness timeout setup · Reviewing recovery assertions"],
  ["t", "Waiting for fresh failure · Monitoring pending test runs"],
  ["t", "Waiting for author"],
  ["c", "// @options: {\"timeout_ms\": 1200000, \"max_output_tokens\": 3000}\ntext(await tools.get_subagent_result({agent_id:\"5944:call_7f5f…\"}))"],
  ["n", "Corrected tiny diff ready: lifecycle test +2 reconnect lines, move unregister; docs/testing +8 evidence lines and postmortem final paragraph only (no source change)."],
  ["n", "Pushed 9afe5b0dd3b844f590fdb73218a70a9207df3dbe to same PR267 branch; working tree clean. Starting full root Vitest --maxWorkers=1 then test:integration."],
  ["t", "Reviewing corrected source and docs · Updating corrected PR body"],
  ["f", "text(await tools.bash({command:\"gh pr edit 267 --body-file .context/pr267-body.md\"}))\n✕ could not read .context/pr267-body.md: no such file"],
  ["t", "Monitoring old-head failure logs · Checking old-run failures"],
  ["t", "Capturing current run table"],
  ["c", "text(await tools.bash({command:\"gh run list --branch fix/claude-initial-input-completion --limit 12 --json databaseId,headSha,workflowName,status,conclusion,url\"}))"],
  ["t", "Checking workflow statuses"],
  ["c", "text(await tools.bash({command:\"gh run list --branch fix/claude-initial-input-completion --limit 12 --json databaseId,headSha,workflowName,status,conclusion --jq '.[]|[.workflowName,.status]'\"}))"],
  ["t", "Monitoring full unit run · Waiting for CI completion"],
  ["t", "Preparing squash commit message · Preparing squash merge"],
  ["c", "// @options: {\"timeout_ms\": 1200000, \"max_output_tokens\": 3000}\ntext(await tools.get_subagent_result({agent_id:\"5944:call_7f5f…\"}))"],
];
const SUB = "Stabilize resume-budget DST";

let live = true, size = 35;

function raw(n) {
  if (n === 35) return RAW;
  if (n === 6) return RAW.slice(25, 31);
  let seed = 11;
  const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (k) => { const xs = RAW.filter((x) => x[0] === k); return xs[Math.floor(r() * xs.length)]; };
  const out = [];
  let prevT = false;
  for (let i = 0; i < n; i++) {
    const x = r();
    const thinkP = prevT ? 0.62 : 0.5;
    if (x < 0.005) out.push(RAW[26]);
    else if (x < thinkP) { out.push(pick("t")); prevT = true; continue; }
    else out.push(pick(r() < 0.75 ? "c" : "n"));
    prevT = false;
  }
  out[n - 1] = RAW[34];
  return out;
}
function steps() {
  const R = raw(size);
  return R.map(([k, text], i) => {
    const kind = k === "t" ? "thinking" : k === "n" ? "notification" : "codemode";
    const st = k === "t" ? "thinking" : k === "f" ? "failed" : live && i === R.length - 1 ? "running" : "success";
    return { i, kind, st, text };
  });
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const firstLine = (s) => s.split("\n").find((l) => !l.startsWith("// @options")) ?? s;
const stCls = (st) => (st === "failed" ? "bad" : st === "running" ? "ok" : "");

function row({ label, headline, metric, state = "", body = "", open = false }) {
  return `<details class="activity-rail-row ${state}"${open ? " open" : ""}><summary><span class="activity-rail-marker"></span><span class="activity-rail-summary"><span class="activity-rail-label">${label}</span>${headline !== undefined ? ` · <span class="activity-rail-headline">${esc(headline)}</span>` : ""}</span>${metric !== undefined ? `<span class="activity-rail-metric">${metric}</span>` : ""}</summary>${body ? `<div class="body">${body}</div>` : ""}</details>`;
}
function stepRow(s, open = false) {
  const body = s.kind === "codemode" ? `<div class="code">${esc(s.text)}</div>` : esc(s.text);
  if (s.kind === "thinking") return row({ label: "thinking", headline: s.text, body, open });
  if (s.kind === "notification") return row({ label: "notification", headline: s.text, metric: SUB, body, open });
  const state = s.st === "failed" ? "failed" : s.st === "running" ? "running" : "";
  const metric = s.st === "failed" ? "2 calls · 1 failed" : s.st === "running" ? "running" : undefined;
  return row({ label: "codemode", headline: firstLine(s.text), metric, state, body, open });
}

/* Bins: running and failed always win; otherwise majority of thinking vs success. */
function bins(S, cap) {
  cap = Math.max(1, Math.floor(cap));
  const n = Math.ceil(S.length / cap);
  const out = [];
  for (let a = 0; a < S.length; a += n) {
    const steps = S.slice(a, a + n);
    const has = (st) => steps.some((s) => s.st === st);
    const t = steps.filter((s) => s.st === "thinking").length;
    const st = has("running") ? "running" : has("failed") ? "failed" : t * 2 > steps.length ? "thinking" : "success";
    out.push({ k: out.length, i: a, j: a + steps.length - 1, steps, st });
  }
  return out;
}
function counts(steps) {
  const c = { thinking: 0, codemode: 0, notification: 0 };
  let f = 0;
  steps.forEach((s) => { c[s.kind]++; if (s.st === "failed") f++; });
  const parts = Object.entries(c).filter(([, v]) => v).map(([k, v]) => `${v} ${k}`);
  if (f) parts.push(`<span class="bad">${f} failed</span>`);
  return parts.join(" · ");
}
/* One line of HTML describing a bin or a step. */
function describe(b) {
  if (b.steps.length === 1) {
    const s = b.steps[0];
    return `<b class="${stCls(s.st)}">${s.kind}</b> · ${esc(firstLine(s.text))}`;
  }
  return `<b>${b.i + 1}–${b.j + 1}</b> · ${counts(b.steps)}`;
}
const lastBin = (B) => B[B.length - 1];

/* Shared shell: turn, rail row with label + strip area, lazy full list, picked slot. */
function shell(frame, v, { extra = "", below = "" } = {}) {
  const S = frame._S;
  const running = S.some((s) => s.st === "running");
  const after = live ? "" : `<div class="prose">PR 267 merged (squash). Reconnect re-registers before the idle guard runs; 12/12 fresh iterations and the original trace replay pass.</div>`;
  frame.innerHTML = `<div class="rec-you">babysit PR 267</div><div class="rec-orb"><div class="rec-bd"><div class="prose">CI failed on the resume-budget DST. Replaying the trace and delegating root cause.</div><details class="activity-rail-row ${v}${running ? " running" : ""}"><summary><span class="activity-rail-marker"></span><span class="mid"><span class="activity-rail-label">activity</span><span class="strip"></span>${extra}</span><span class="activity-rail-metric">${S.length}</span></summary><div class="body all"></div></details>${below}<div class="picked"></div>${after}</div></div>`;
  const det = frame.querySelector("details");
  det.addEventListener("toggle", () => {
    const body = det.querySelector(".all");
    body.innerHTML = det.open ? S.slice(0, 400).map((s) => stepRow(s)).join("") + (S.length > 400 ? `<div>… ${S.length - 400} more</div>` : "") : "";
  });
  const strip = frame.querySelector(".strip");
  strip.addEventListener("click", (e) => e.preventDefault());
  return { det, strip, summary: det.querySelector("summary"), picked: frame.querySelector(".picked"), readout: frame.querySelector(".readout") };
}
function openPicked(frame, picked, b) {
  if (frame._open === b.i) { picked.innerHTML = ""; frame._open = null; return false; }
  frame._open = b.i;
  picked.innerHTML = b.steps.length === 1 ? stepRow(b.steps[0], true) : b.steps.map((s) => stepRow(s)).join("");
  return true;
}
function stripWidth(frame, strip) { return strip.getBoundingClientRect().width || 600; }
function relPos(frame, el) {
  const f = frame.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - f.left, y: r.top - f.top, w: r.width, h: r.height, fw: f.width };
}
function hoverDelegate(strip, sel, onEnter, onLeave) {
  let cur = null;
  strip.addEventListener("mousemove", (e) => {
    const el = e.target.closest(sel);
    if (el === cur) return;
    if (cur) cur.classList.remove("h");
    cur = el;
    if (el) { el.classList.add("h"); onEnter(el, e); } else onLeave();
  });
  strip.addEventListener("mouseleave", () => { if (cur) cur.classList.remove("h"); cur = null; onLeave(); });
}

const R = {};

R.v1 = (frame) => {
  const S = frame._S;
  const { strip, picked, readout } = shell(frame, "v1", { below: `<div class="readout"></div>` });
  const perLine = Math.floor((stripWidth(frame, strip) + 2) / 8);
  const B = bins(S, perLine * 3);
  strip.innerHTML = B.map((b) => `<span class="c ${b.st}" data-k="${b.k}"></span>`).join("");
  const def = () => (readout.innerHTML = describe(lastBin(B)));
  def();
  hoverDelegate(strip, ".c", (el) => (readout.innerHTML = describe(B[+el.dataset.k])), def);
  strip.addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) openPicked(frame, picked, B[+el.dataset.k]); });
};

R.v2 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v2", { extra: `<span class="hl"></span>` });
  const hl = frame.querySelector(".hl");
  const max = Math.floor(stripWidth(frame, frame.querySelector(".mid")) * 0.45);
  const B = bins(S, max / 2);
  strip.style.gap = `${Math.max(1, Math.min(3, Math.floor(max / B.length) - 1))}px`;
  strip.innerHTML = B.map((b) => `<span class="c ${b.st}" data-k="${b.k}"></span>`).join("");
  const latestT = [...S].reverse().find((s) => s.st === "thinking");
  const def = () => (hl.innerHTML = latestT ? esc(latestT.text) : "");
  def();
  const els = [...strip.children];
  let cur = null;
  strip.addEventListener("mousemove", (e) => {
    const r = strip.getBoundingClientRect();
    const k = Math.max(0, Math.min(B.length - 1, Math.floor(((e.clientX - r.left) / r.width) * B.length)));
    if (cur === k) return;
    if (cur !== null) els[cur].classList.remove("h");
    cur = k; els[k].classList.add("h");
    hl.innerHTML = describe(B[k]);
    frame._hover = k;
  });
  strip.addEventListener("mouseleave", () => { if (cur !== null) els[cur].classList.remove("h"); cur = null; def(); });
  strip.addEventListener("click", () => { if (cur !== null) openPicked(frame, picked, B[cur]); });
  strip.style.padding = "4px 0";
};

R.v3 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v3");
  const cap = Math.floor((stripWidth(frame, strip) - 44) / 12);
  const shown = S.length > cap ? S.slice(S.length - cap) : S;
  const hidden = S.length - shown.length;
  strip.innerHTML = (hidden ? `<span class="more">+${hidden}</span>` : "") + shown.map((s) => `<span class="c ${s.st}" data-i="${s.i}"></span>`).join("");
  const tip = document.createElement("div");
  tip.className = "tip"; tip.hidden = true; frame.appendChild(tip);
  hoverDelegate(strip, ".c", (el) => {
    const s = S[+el.dataset.i];
    tip.innerHTML = `<span class="${stCls(s.st)}">${s.kind}</span> <span class="dim">·</span> ${esc(firstLine(s.text))}`;
    tip.hidden = false;
    const p = relPos(frame, el);
    tip.style.top = `${p.y - 22}px`;
    tip.style.left = `${Math.min(Math.max(4, p.x - 16), p.fw - tip.offsetWidth - 4)}px`;
  }, () => (tip.hidden = true));
  strip.addEventListener("click", (e) => {
    if (e.target.closest(".more")) { openPicked(frame, picked, { i: -1, steps: S.slice(0, hidden) }); return; }
    const el = e.target.closest(".c");
    if (el) openPicked(frame, picked, { i: +el.dataset.i, steps: [S[+el.dataset.i]] });
  });
};

R.v4 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v4", { below: `<div class="ghost"></div>` });
  const glyph = { thinking: "·", success: "▪", failed: "✕", running: "▪" };
  strip.innerHTML = S.map((s) => `<span class="c ${s.st}" data-i="${s.i}">${glyph[s.st]}</span>`).join("");
  strip.scrollLeft = strip.scrollWidth;
  if (strip.scrollWidth > strip.clientWidth) { const f = document.createElement("span"); f.className = "fade"; strip.parentElement.style.position = "relative"; strip.after(f); f.style.left = `${strip.offsetLeft}px`; }
  const ghost = frame.querySelector(".ghost");
  hoverDelegate(strip, ".c", (el) => (ghost.innerHTML = stepRow(S[+el.dataset.i])), () => (ghost.innerHTML = ""));
  strip.addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) openPicked(frame, picked, { i: +el.dataset.i, steps: [S[+el.dataset.i]] }); });
};

R.v5 = (frame) => {
  const S = frame._S;
  const { strip, picked, readout } = shell(frame, "v5", { below: `<div class="readout"></div>` });
  strip.tabIndex = 0;
  const B = bins(S, stripWidth(frame, strip) / 4);
  strip.innerHTML = B.map((b) => {
    const t = b.steps.some((s) => s.st === "thinking");
    const acts = b.steps.filter((s) => s.st !== "thinking");
    const a = acts.some((s) => s.st === "running") ? "running" : acts.some((s) => s.st === "failed") ? "failed" : acts.length ? "success" : "";
    return `<span class="l top${t ? " t" : ""}" data-k="${b.k}"></span><span class="l bot ${a}" data-k="${b.k}"></span>`;
  }).join("");
  const cols = (k) => strip.querySelectorAll(`[data-k="${k}"]`);
  let cur = null;
  const show = (k) => {
    if (cur !== null) cols(cur).forEach((c) => c.classList.remove("h"));
    cur = k;
    if (k === null) { readout.innerHTML = `<span class="idx">${S.length}</span> · ${describe(lastBin(B))}`; return; }
    cols(k).forEach((c) => c.classList.add("h"));
    const b = B[k];
    readout.innerHTML = `<span class="idx">${b.steps.length === 1 ? b.i + 1 : ""}</span>${b.steps.length === 1 ? " · " : ""}${describe(b)}`;
  };
  show(null);
  strip.addEventListener("mousemove", (e) => { const el = e.target.closest(".l"); if (el && +el.dataset.k !== cur) show(+el.dataset.k); });
  strip.addEventListener("mouseleave", () => { if (document.activeElement !== strip) show(null); });
  strip.addEventListener("click", () => { if (cur !== null) openPicked(frame, picked, B[cur]); });
  strip.addEventListener("focus", () => { if (cur === null) show(B.length - 1); });
  strip.addEventListener("blur", () => show(null));
  strip.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); show(Math.max(0, (cur ?? B.length) - 1)); }
    else if (e.key === "ArrowRight") { e.preventDefault(); show(Math.min(B.length - 1, (cur ?? -1) + 1)); }
    else if (e.key === "Enter") { e.preventDefault(); if (cur !== null) openPicked(frame, picked, B[cur]); }
    else if (e.key === "Escape") { strip.blur(); }
  });
};

R.v6 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v6");
  const w = stripWidth(frame, strip);
  const B = bins(S, w / 3);
  strip.innerHTML = B.map((b) => `<span class="c ${b.st}"></span>`).join("");
  const used = B.length * 3;
  const loupe = document.createElement("div");
  loupe.className = "loupe"; loupe.hidden = true; frame.appendChild(loupe);
  let cur = null;
  strip.addEventListener("mousemove", (e) => {
    const r = strip.getBoundingClientRect();
    const x = e.clientX - r.left;
    if (x > used) { loupe.hidden = true; cur = null; return; }
    const i = Math.max(0, Math.min(S.length - 1, Math.floor((x / used) * S.length)));
    if (i === cur) return;
    cur = i;
    const cells = [];
    for (let d = -12; d <= 12; d++) {
      const s = S[i + d];
      cells.push(s ? `<span class="c ${s.st}${d === 0 ? " ctr" : ""}"></span>` : `<span class="c void"></span>`);
    }
    const s = S[i];
    loupe.innerHTML = `<div class="row">${cells.join("")}</div><div class="txt">${i + 1} · <b class="${stCls(s.st)}">${s.kind}</b> · ${esc(firstLine(s.text))}</div>`;
    loupe.hidden = false;
    const p = relPos(frame, strip);
    loupe.style.top = `${p.y - 50}px`;
    loupe.style.left = `${Math.min(Math.max(4, p.x + x - loupe.offsetWidth / 2), p.fw - loupe.offsetWidth - 4)}px`;
  });
  strip.addEventListener("mouseleave", () => { loupe.hidden = true; cur = null; });
  strip.addEventListener("click", () => { if (cur !== null) openPicked(frame, picked, { i: cur, steps: [S[cur]] }); });
};

R.v7 = (frame) => {
  const S = frame._S;
  const { strip, picked, readout } = shell(frame, "v7", { below: `<div class="readout"></div>` });
  const w = stripWidth(frame, frame.querySelector(".mid")) - 70;
  const segs = [];
  for (const b of bins(S, w / 3)) {
    const last = segs[segs.length - 1];
    if (last && last.st === b.st && b.st !== "failed" && b.st !== "running") last.steps.push(...b.steps);
    else segs.push({ st: b.st, i: b.i, steps: [...b.steps] });
  }
  const gaps = segs.length - 1;
  const unit = Math.min(7, Math.max(0.1, (w - gaps) / S.length));
  strip.innerHTML = segs.map((g, k) => {
    const px = Math.max(1, g.steps.length * unit);
    const num = g.steps.length >= 3 && px >= 16 ? g.steps.length : "";
    return `<span class="seg ${g.st}" data-k="${k}" style="width:${px}px">${num}</span>`;
  }).join("");
  if (strip.scrollWidth > w) { strip.style.width = `${w}px`; strip.style.overflow = "hidden"; strip.style.justifyContent = "flex-end"; }
  const def = () => { const g = segs[segs.length - 1]; readout.innerHTML = segText(g); };
  const segText = (g) => {
    if (g.steps.length === 1) return describe({ steps: g.steps });
    if (g.steps.some((s) => s.st !== g.st)) return `<b>${g.i + 1}–${g.i + g.steps.length}</b> · ${counts(g.steps)}`;
    const kinds = [...new Set(g.steps.map((s) => s.kind))].join(" / ");
    return `<b>${g.steps.length} ${kinds}</b> · ${g.steps.slice(-6).map((s) => esc(firstLine(s.text).split(" · ")[0])).join(" / ")}${g.steps.length > 6 ? " …" : ""}`;
  };
  def();
  hoverDelegate(strip, ".seg", (el) => (readout.innerHTML = segText(segs[+el.dataset.k])), def);
  strip.addEventListener("click", (e) => { const el = e.target.closest(".seg"); if (el) openPicked(frame, picked, segs[+el.dataset.k]); });
};

R.v8 = (frame) => {
  const S = frame._S;
  const { summary, strip, picked } = shell(frame, "v8");
  strip.remove();
  const latestT = [...S].reverse().find((s) => s.st === "thinking");
  const mid = frame.querySelector(".mid");
  mid.innerHTML = `<span class="activity-rail-summary"><span class="activity-rail-label">activity</span> · <span class="activity-rail-headline"></span></span>`;
  const label = mid.querySelector(".activity-rail-label"), head = mid.querySelector(".activity-rail-headline");
  const hit = document.createElement("span");
  hit.className = "bandhit";
  hit.innerHTML = `<span class="band"></span>`;
  summary.appendChild(hit);
  const band = hit.firstChild;
  const w = band.getBoundingClientRect().width;
  const B = bins(S, w);
  band.style.gap = w / B.length >= 4 ? "1px" : "0";
  band.innerHTML = B.map((b) => `<span class="c ${b.st}" data-k="${b.k}"></span>`).join("");
  const els = [...band.children];
  let cur = null, sel = null;
  const set = (k) => {
    if (k === null) { label.textContent = "activity"; label.className = "activity-rail-label"; head.textContent = latestT ? latestT.text : ""; return; }
    const b = B[k];
    if (b.steps.length === 1) { const s = b.steps[0]; label.textContent = s.kind; label.className = `activity-rail-label ${stCls(s.st)}`; label.style.color = s.st === "failed" ? "var(--bad)" : s.st === "running" ? "var(--ok)" : ""; head.textContent = firstLine(s.text); }
    else { label.textContent = `${b.i + 1}–${b.j + 1}`; label.style.color = ""; head.innerHTML = counts(b.steps); }
  };
  set(null);
  hit.addEventListener("mousemove", (e) => {
    const r = band.getBoundingClientRect();
    const k = Math.max(0, Math.min(B.length - 1, Math.floor(((e.clientX - r.left) / r.width) * B.length)));
    if (k === cur) return;
    if (cur !== null) els[cur].classList.remove("h");
    cur = k; els[k].classList.add("h"); set(k);
  });
  hit.addEventListener("mouseleave", () => { if (cur !== null) els[cur].classList.remove("h"); cur = null; set(sel); if (sel === null) label.style.color = ""; });
  hit.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    if (cur === null) return;
    if (sel !== null) els[sel].classList.remove("sel");
    const opened = openPicked(frame, picked, B[cur]);
    sel = opened ? cur : null;
    if (sel !== null) els[sel].classList.add("sel");
  });
};

R.v9 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v9", { extra: `<span class="ro"></span>` });
  const ro = frame.querySelector(".ro");
  const max = Math.floor(stripWidth(frame, frame.querySelector(".mid")) * 0.5);
  const pitch = Math.max(2, Math.min(8, Math.floor(max / S.length)));
  const B = bins(S, max / pitch);
  const cw = pitch >= 4 ? pitch - 2 : pitch - 1;
  strip.style.gap = `${pitch - cw}px`;
  strip.innerHTML = B.map((b) => `<span class="c ${b.st}" data-k="${b.k}" style="width:${cw}px"></span>`).join("");
  const def = () => (ro.innerHTML = describe(lastBin(B)));
  def();
  hoverDelegate(strip, ".c", (el) => (ro.innerHTML = describe(B[+el.dataset.k])), def);
  strip.addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) openPicked(frame, picked, B[+el.dataset.k]); });
  strip.style.padding = "4px 0";
};

R.v10 = (frame) => {
  const S = frame._S;
  const { strip, picked } = shell(frame, "v10");
  const cols = Math.floor((stripWidth(frame, strip) + 1) / 6);
  const B = bins(S, cols * 3);
  strip.innerHTML = B.map((b) => `<span class="c ${b.st}" data-k="${b.k}"></span>`).join("");
  const card = document.createElement("div");
  card.className = "card"; card.hidden = true; frame.appendChild(card);
  hoverDelegate(strip, ".c", (el) => {
    const b = B[+el.dataset.k];
    if (b.steps.length === 1) {
      const s = b.steps[0];
      card.innerHTML = `<div class="k ${stCls(s.st)}"><span>${s.kind}${s.st === "failed" ? " · failed" : s.st === "running" ? " · running" : ""}</span><span>${s.i + 1} / ${S.length}</span></div>${s.kind === "codemode" ? `<div class="code">${esc(firstLine(s.text))}</div>` : `<div class="t">${esc(s.text)}</div>`}`;
    } else {
      card.innerHTML = `<div class="k"><span>${b.i + 1}–${b.j + 1}</span><span>${S.length}</span></div><div class="t">${counts(b.steps)}</div>`;
    }
    card.hidden = false;
    const p = relPos(frame, el);
    card.style.top = `${p.y + p.h + 6}px`;
    card.style.left = `${Math.min(Math.max(4, p.x - 10), p.fw - card.offsetWidth - 4)}px`;
  }, () => (card.hidden = true));
  strip.addEventListener("click", (e) => { const el = e.target.closest(".c"); if (el) openPicked(frame, picked, B[+el.dataset.k]); });
};

function build() {
  document.getElementById("main").innerHTML = VARIANTS.map(([id, name, why], n) => `<section id="${id}"><h2>${n + 1} · ${name}</h2><p class="why">${why}</p><div class="frame" data-v="${id}"></div></section>`).join("");
  document.getElementById("jump").innerHTML = VARIANTS.map(([id], n) => `<a href="#${id}">${n + 1}</a>`).join("");
  document.getElementById("sizes").innerHTML = SIZES.map((n) => `<button data-size="${n}" aria-pressed="${n === size}">${n}</button>`).join("");
  document.querySelectorAll("[data-size]").forEach((b) => b.addEventListener("click", () => {
    size = +b.dataset.size;
    document.querySelectorAll("[data-size]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));
}
function render() {
  const S = steps();
  document.querySelectorAll("[data-v]").forEach((frame) => {
    frame.querySelectorAll(".tip,.loupe,.card").forEach((x) => x.remove());
    frame._S = S; frame._open = null;
    R[frame.dataset.v](frame);
  });
}
for (const id of ["live", "done"]) {
  document.getElementById(id).addEventListener("click", () => {
    live = id === "live";
    document.getElementById("live").setAttribute("aria-pressed", String(live));
    document.getElementById("done").setAttribute("aria-pressed", String(!live));
    render();
  });
}
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
build();
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
