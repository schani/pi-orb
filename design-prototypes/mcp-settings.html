<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP settings — five directions</title>
<style>
:root{font:13px/20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#191919;background:#efeeeb;--muted:#72716c;--line:#d9d8d2;--green:#28754e}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid #bdbcb5;padding:7px 12px;border-radius:0}button:hover{background:#efeeeb}button:focus-visible,a:focus-visible{outline:2px solid #28754e;outline-offset:3px}button.primary{background:#191919;color:white;border-color:#191919}button.quiet{border-color:transparent;background:transparent}button.icon{padding:4px 8px;font-size:17px}button.danger{color:#b6362d}button[aria-pressed=true]{background:#191919;color:white}input,select,textarea{width:100%;background:white;border:1px solid #bdbcb5;padding:9px 10px;border-radius:0}input:focus,textarea:focus,select:focus{outline:2px solid #28754e;outline-offset:1px}input::placeholder{color:#92918b}label{display:block;margin:16px 0 5px;color:#5d5c57;font-size:12px}h1,h2,h3,p{margin:0}h1{font-size:18px;line-height:26px}h2{font-size:15px}h3{font-size:13px}a{color:inherit}.workbench{max-width:1180px;margin:auto;padding:36px 30px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.intro{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:8px 0 24px}.intro p{color:var(--muted);font-size:12px}.directions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.directions button{text-align:left;background:transparent;border-color:#cccac2;padding:12px}.directions button[aria-pressed=true]{background:#191919;color:white;border-color:#191919}.directions small{display:block;opacity:.6;font-size:10px;letter-spacing:.1em;margin-bottom:5px}.description{min-height:64px;padding:18px 0;color:#65645f;max-width:900px}.stage{padding:40px;background:#e3e2dc;border:1px solid #d5d3cb;min-height:620px;display:flex;align-items:flex-start;justify-content:center}.app{background:white;border:1px solid #252525;width:880px;box-shadow:0 16px 35px #00000009;min-height:380px}.app-head{padding:23px 26px 0}.project{display:flex;align-items:center;justify-content:space-between;gap:16px}.project h2{font-size:18px;line-height:24px;font-weight:500}.tabs{display:flex;gap:25px;margin-top:22px}.tabs span{padding-bottom:12px;color:var(--muted)}.tabs .selected{color:#171717;border-bottom:2px solid #171717}.body{border-top:1px solid var(--line)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px}.muted{color:var(--muted)}.small{font-size:11px}.row{display:flex;align-items:center;gap:12px;padding:18px 24px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.grow{flex:1;min-width:0}.row .sub{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.status{width:8px;height:8px;display:inline-block;background:var(--green);border-radius:50%;flex:none}.status.warn{background:#bb771e}.server-name{background:transparent;border:0;text-align:left;padding:0;font-weight:600}.server-name:hover{text-decoration:underline;background:transparent}.chip{font-size:10px;background:#f2f1ed;padding:2px 6px;color:#686760;white-space:nowrap}.footer{border-top:1px solid var(--line);padding:10px 24px;color:var(--muted);font-size:10px}.editor{padding:0 24px 24px;max-width:620px}.editor.wide{max-width:none}.back{padding:18px 24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.auth{display:flex;gap:0;margin-top:5px}.auth button{flex:1}.auth button+button{border-left:0}.actions{display:flex;gap:8px;align-items:center;margin-top:24px}.actions .spacer{flex:1}details{margin-top:22px}summary{cursor:pointer;color:var(--muted);font-size:12px}details[open] summary{margin-bottom:12px}.header-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.header-fields label{margin-top:0}.presets{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.presets button{font-size:11px;padding:5px 9px}.split{display:grid;grid-template-columns:220px 1fr;min-height:375px}.rail{background:#f8f7f4;border-right:1px solid var(--line);padding:14px 0}.rail-item{display:flex;align-items:center;gap:10px;padding:14px 18px;width:100%;border:0;background:none;text-align:left}.rail-item.active{background:#e9e8e1;box-shadow:inset 2px 0 #171717}.rail>button:last-child{margin:18px}.detail{padding:24px}.detail .editor{padding:0}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.detail-head h3{font-size:16px}.expanded{background:#f8f7f4;border-top:1px solid var(--line);padding:0 26px 24px 46px}.expanded .editor{padding:0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 24px 24px}.card{border:1px solid var(--line);padding:17px;min-height:156px;display:flex;flex-direction:column}.card-head{display:flex;align-items:center;gap:9px;margin-bottom:15px}.card .endpoint{font-size:11px;overflow-wrap:anywhere;color:var(--muted)}.card-bottom{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between}.add-card{align-items:center;justify-content:center;border-style:dashed;background:#fafaf7}.command-list .row{padding-top:15px;padding-bottom:15px}.command-list .row.active{background:#f0f0e9;box-shadow:inset 3px 0 #191919}.command-add{padding:20px 24px;border-top:1px solid var(--line)}.command-add .inputline{display:flex;gap:8px}.command-add .inputline input{min-width:0;flex:1}.selection-actions{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:#fafaf7}.selected-title{padding:6px 0;margin-right:auto;font-size:12px}.overlay{position:fixed;inset:0;background:#1117;display:flex;align-items:center;justify-content:center;z-index:10;padding:25px}.sheet{background:white;border:1px solid #191919;width:530px;max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0003}.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px}.sheet .editor{max-width:none}.notice{margin-top:18px;color:#66655e;font-size:11px;display:flex;justify-content:space-between;gap:16px}.empty{padding:45px 24px;text-align:center}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#191919;color:white;padding:10px 18px;z-index:20;max-width:90vw}.menu{display:flex;gap:6px;flex-wrap:wrap;padding:10px 24px;background:#f8f7f4;border-top:1px solid var(--line)}.error{color:#b6362d;margin-top:12px}.sheet-head h2{font-size:14px}.identity{display:flex;align-items:center;gap:9px}.theme-caption{font-size:11px;letter-spacing:.03em}.row button:not(.server-name){flex-shrink:0}@media(max-width:850px){.workbench{padding:22px 14px}.stage{padding:18px 8px}.directions{grid-template-columns:repeat(3,1fr)}.intro{display:block}.intro p{margin-top:8px}.split{grid-template-columns:170px 1fr}.chip{display:none}.detail{padding:18px}}@media(max-width:560px){.stage{padding:0;background:transparent;border:0}.app-head{padding:20px 16px 0}.row,.toolbar{padding:16px}.split{display:block}.rail{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;padding:4px}.rail-item{width:auto;padding:10px}.rail>button:last-child{margin:2px}.cards{grid-template-columns:1fr;padding:0 16px 16px}.two{grid-template-columns:1fr;gap:0}.notice{display:block}.directions button{padding:8px}.description{min-height:86px}.row .sub{max-width:190px}.project h2{font-size:15px}.header-fields{grid-template-columns:1fr}.expanded{padding-left:20px}.row{gap:8px}.row .quiet{padding:5px}}
</style></head><body>
<main class="workbench"><div class="eyebrow">Design study · MCP settings</div><div class="intro"><h1>Five ways to make this smaller.</h1><p>Interactive mockups. No live connections.</p></div><nav class="directions" aria-label="Design directions"></nav><p class="description" id="description"></p><div class="stage"><section class="app" aria-label="Project configuration mockup"><header class="app-head"><div class="project"><h2>Cloudflare OAuth test</h2><button class="icon quiet" aria-label="Close project configuration" onclick="note('Prototype only — the project stays open.')">×</button></div><div class="tabs"><span>General</span><span class="selected">MCPs</span><span>Secrets</span></div></header><div class="body" id="content"></div><div class="footer">Catalog changes apply on next start</div></section></div><div class="notice"><span id="tradeoff"></span><button class="quiet small" onclick="reset()">Reset mockup</button></div></main><div id="overlay"></div><div id="feedback" aria-live="polite"></div>
<script>
const directions=[
 ['Quiet index','A compact list. Select a server to replace the list with its editor. Add is a separate view.','My pick for two to ten servers. The least UI when nothing needs attention.'],
 ['Connection browser','A persistent server rail and one detail pane. Selection, configuration and authorization live in one place.','Best for frequent editing. Faster switching, but the selected server always occupies space.'],
 ['Inline workbench','Rows expand in place. Open only the connection you want to change; the rest remain visible.','Best for occasional quick edits. Can grow tall, so only one row opens at a time.'],
 ['Connection cards','Each connection is its own compact object. Editing and adding happen in a focused sheet.','Best for a small catalog. Clear separation, at the cost of lower information density.'],
 ['Command list','Select a row; act in one shared command bar. Add by pasting a URL into the dock, not by choosing a provider first.','Best for keyboard-heavy use. Arrow keys select; Enter edits; Escape closes the editor.']
];
const initial=[{name:'cloudflare',url:'https://mcp.cloudflare.com/mcp',auth:'oauth',connected:true},{name:'datadog',url:'https://mcp.us5.datadoghq.com/v1/mcp',auth:'oauth',connected:true},{name:'posthog',url:'https://mcp.posthog.com/mcp',auth:'headers',connected:true}];
let servers=structuredClone(initial), direction=0, selected=0, expanded=-1, view='list', menu=-1, timer, draft;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marker=s=>`<span class="status ${s.connected?'':'warn'}" role="img" aria-label="${s.auth==='oauth'?(s.connected?'Connected':'Authorization required'):'Header authentication configured'}" title="${s.auth==='oauth'?(s.connected?'Connected':'Authorization required'):'Header authentication configured'}"></span>`;
const authLabel=s=>s.auth==='oauth'?'OAuth':'Secret headers';
function note(text){clearTimeout(timer);$('#feedback').innerHTML=`<div class="toast">${esc(text)}</div>`;timer=setTimeout(()=>$('#feedback').innerHTML='',3000)}
function reset(){servers=structuredClone(initial);selected=0;expanded=-1;view='list';menu=-1;setDraft(0);closeSheet();clearTimeout(timer);$('#feedback').innerHTML='';render()}
function switchDirection(i){direction=i;selected=0;expanded=-1;view='list';menu=-1;setDraft(0);closeSheet();clearTimeout(timer);$('#feedback').innerHTML='';render()}
function toolbar(){return `<div class="toolbar"><span class="small muted">${servers.length} servers</span><button onclick="add()">+ Add server</button></div>`}
function row(i,mode){let s=servers[i];return `<div class="row ${mode==='command'&&selected===i?'active':''}">${marker(s)}<div class="grow"><button class="server-name" onclick="choose(${i})">${esc(s.name)}</button><span class="sub">${esc(new URL(s.url).host+new URL(s.url).pathname)}</span></div><span class="chip">${authLabel(s)}</span>${!s.connected&&s.auth==='oauth'?`<button onclick="connect(${i})">Connect</button>`:''}${mode==='expand'?`<button class="quiet icon" aria-label="${expanded===i?'Collapse':'Edit'} ${esc(s.name)}" onclick="choose(${i})">${expanded===i?'−':'+'}</button>`:mode==='command'?'':`<button class="quiet icon" aria-label="Actions for ${esc(s.name)}" onclick="menu=menu===${i}?-1:${i};render()">⋯</button>`}</div>${menu===i&&mode!=='command'?menuHtml(i):''}`}
function menuHtml(i){const s=servers[i];return `<div class="menu"><button class="quiet" onclick="edit(${i})">Edit</button>${s.auth==='oauth'?`<button class="quiet" onclick="connect(${i})">${s.connected?'Reconnect':'Connect'}</button>${s.connected?`<button class="quiet" onclick="disconnect(${i})">Disconnect</button>`:''}`:''}<button class="quiet danger" onclick="removeServer(${i})">Remove</button></div>`}
function render(){
 $('.directions').innerHTML=directions.map((d,i)=>`<button aria-pressed="${direction===i}" onclick="switchDirection(${i})"><small>0${i+1}</small>${d[0]}</button>`).join('');$('#description').textContent=directions[direction][1];$('#tradeoff').textContent=directions[direction][2];
 let html='';
 if(direction===0){html=view==='edit'?`<div class="back"><button class="quiet" onclick="view='list';render()">← Servers</button></div>${editorHtml()}`:toolbar()+servers.map((_,i)=>row(i,'list')).join('')}
 if(direction===1){html=`<div class="split"><aside class="rail">${servers.map((s,i)=>`<button class="rail-item ${selected===i?'active':''}" onclick="choose(${i})">${marker(s)}${esc(s.name)}</button>`).join('')}<button class="quiet" onclick="add()">+ Add server</button></aside><div class="detail">${servers.length||view==='edit'?`${draft?.index===-1?'<div class="detail-head"><h3>Add server</h3></div>':''}${editorHtml()}`:'<button onclick="add()">Add server</button>'}</div></div>`}
 if(direction===2){html=toolbar()+servers.map((_,i)=>row(i,'expand')+(expanded===i?`<div class="expanded">${editorHtml()}</div>`:'')).join('')}
 if(direction===3){html=`<div class="toolbar"><span class="small muted">${servers.length} servers</span></div>`+`<div class="cards">${servers.map((s,i)=>`<article class="card"><div class="card-head">${marker(s)}<h3 class="grow">${esc(s.name)}</h3></div><span class="endpoint">${esc(s.url)}</span><div class="card-bottom"><span class="chip">${authLabel(s)}</span>${!s.connected&&s.auth==='oauth'?`<button onclick="connect(${i})">Connect</button>`:`<button class="quiet small" onclick="edit(${i})">Configure</button>`}</div></article>`).join('')}<button class="card add-card" onclick="add()">+ Add server</button></div>`}
 if(direction===4){html=`<div class="command-list">${servers.map((_,i)=>row(i,'command')).join('')}</div>${servers[selected]?`<div class="selection-actions"><span class="grow"></span><button onclick="edit(${selected})">Edit</button>${servers[selected].auth==='oauth'?`<button onclick="connect(${selected})">${servers[selected].connected?'Reconnect':'Connect'}</button>${servers[selected].connected?`<button class="quiet" onclick="disconnect(${selected})">Disconnect</button>`:''}`:''}<button class="quiet danger" onclick="removeServer(${selected})">Remove</button></div>`:''}<form class="command-add" onsubmit="event.preventDefault();add(document.getElementById('quick-url').value)"><div class="inputline"><input id="quick-url" type="url" required placeholder="https://…/mcp" aria-label="New server endpoint"><button type="submit">Add →</button></div></form>`}
 $('#content').innerHTML=html;
}
function setDraft(i){const s=servers[i];draft=!s?{index:-1,name:'',url:'',auth:'oauth',description:''}:{...s,index:i,description:s.description||''}}
function choose(i){selected=i;if(direction===0)edit(i);else if(direction===1){setDraft(i);view='edit';render()}else if(direction===2){expanded=expanded===i?-1:i;setDraft(i);render()}else render()}
function edit(i){selected=i;menu=-1;setDraft(i);view='edit';if(direction===0||direction===1){render()}else if(direction===2){expanded=i;render()}else openSheet()}
function add(url=''){setDraft(-1);draft.url=url;view='edit';if(direction===0||direction===1){render()}else openSheet()}
function editorHtml(){if(!draft)setDraft(selected);const s=draft;return `<form class="editor" onsubmit="event.preventDefault();saveDraft()">${s.index===-1?`<div class="presets">${['Cloudflare','Datadog US5','PostHog'].map((n,i)=>`<button type="button" onclick="preset(${i})">${n}</button>`).join('')}</div>`:''}<label for="server-url">Endpoint</label><input id="server-url" type="url" required value="${esc(s.url)}" placeholder="https://…/mcp" oninput="draft.url=this.value"><div class="two"><div><label for="server-name">Name</label><input id="server-name" required value="${esc(s.name)}" placeholder="my-server" oninput="draft.name=this.value"></div><div><label>Authentication</label><div class="auth"><button type="button" aria-pressed="${s.auth==='oauth'}" onclick="changeAuth('oauth')">OAuth</button><button type="button" aria-pressed="${s.auth==='headers'}" onclick="changeAuth('headers')">Headers</button></div></div></div>${s.auth==='headers'?`<div class="header-fields"><div><label for="header-name">Header</label><input id="header-name" value="Authorization" aria-label="Header name"></div><div><label for="secret-name">Secret reference</label><select id="secret-name"><option>POSTHOG_KEY</option><option>MCP_TOKEN</option><option>DD_API_KEY</option></select></div><div><label for="header-prefix">Prefix</label><input id="header-prefix" value="Bearer " aria-label="Header value prefix"></div></div>`:''}<details><summary>Advanced</summary><label for="server-description">Description</label><textarea id="server-description" rows="2" oninput="draft.description=this.value">${esc(s.description||'')}</textarea><button type="button" class="quiet small" onclick="note('Metadata refresh would use this connection’s authentication.')">Fetch description</button><details><summary>Additional headers</summary><div class="header-fields"><input placeholder="Header name" aria-label="Additional header name"><select aria-label="Additional header source"><option>Secret reference</option><option>Literal value</option></select></div></details></details><div class="actions">${s.index>=0&&s.auth==='oauth'?`<button type="button" onclick="connect(${s.index})">${servers[s.index]?.connected?'Reconnect':'Connect'}</button>`:''}<span class="spacer"></span><button type="button" class="quiet" onclick="cancelEditor()">Cancel</button><button type="submit" class="primary">${s.index<0?(s.auth==='oauth'?'Add & connect':'Add server'):'Save'}</button></div>${s.index>=0?`<div class="actions">${s.auth==='oauth'&&servers[s.index]?.connected?`<button type="button" class="quiet small" onclick="disconnect(${s.index})">Disconnect</button>`:''}<button type="button" class="quiet danger small" onclick="removeServer(${s.index})">Remove server</button></div>`:''}</form>`}
function refreshEditor(){if($('#overlay').children.length)openSheet();else render()}
function changeAuth(value){draft.auth=value;refreshEditor()}
function preset(i){const p=initial[i];draft={...draft,name:p.name,url:p.url,auth:p.auth};refreshEditor()}
function openSheet(){const title=draft.index<0?'Add server':draft.name;$('#overlay').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="quiet icon" aria-label="Close editor" onclick="cancelEditor()">×</button></div>${editorHtml()}</section></div>`;$('#overlay input')?.focus();$('.workbench').inert=true;$('.workbench').setAttribute('aria-hidden','true')}
function closeSheet(){$('.workbench').inert=false;$('.workbench').removeAttribute('aria-hidden');$('#overlay').innerHTML=''}
function cancelEditor(){closeSheet();view='list';expanded=-1;setDraft(Math.min(selected,servers.length-1));render()}
function saveDraft(){const i=draft.index;const item={...draft,connected:i<0?true:servers[i].connected};delete item.index;if(i<0){servers.push(item);selected=servers.length-1}else servers[i]=item;closeSheet();expanded=-1;view='list';setDraft(selected);render();note(i<0&&item.auth==='oauth'?'Prototype: saved connection → browser consent → connected.':'Prototype: saved. Catalog changes apply on next start.')}
function connect(i){servers[i].connected=true;menu=-1;closeSheet();if(draft?.index===i)setDraft(i);render();note('Prototype: browser consent completed. No real authorization was requested.')}
function disconnect(i){servers[i].connected=false;menu=-1;closeSheet();if(draft?.index===i)setDraft(i);render();note('Prototype: new token grants stopped. Already-issued tokens last until expiry.')}
function removeServer(i){if(!confirm(`Remove ${servers[i].name}?`))return;servers.splice(i,1);selected=Math.max(0,Math.min(selected,servers.length-1));expanded=-1;menu=-1;view='list';closeSheet();setDraft(selected);render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){cancelEditor();return}if(direction!==4||$('#overlay').children.length||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+servers.length)%servers.length;render()}if(e.key==='Enter'&&servers[selected])edit(selected)});
setDraft(0);render();
</script></body></html>
