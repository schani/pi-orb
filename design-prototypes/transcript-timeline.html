<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi-orb · transcript timeline study</title>
<style>
/* Product faces, served from the repository; system monospace when opened elsewhere. */
@font-face{font-family:"Iosevka Etoile";src:url("../apps/web/public/fonts/iosevka-etoile-regular-989cbc25c646.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Iosevka Etoile";src:url("../apps/web/public/fonts/iosevka-etoile-bold-7ec739ec82b2.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../apps/web/public/fonts/jetbrains-mono-regular-fa06becb7e66.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../apps/web/public/fonts/jetbrains-mono-bold-f73d6b79ab0c.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

/* Signal / Boards tokens (apps/web/src/styles.css) plus the chart constants
   (apps/web/src/lib/chart-spec.ts: PALE, GRID). Dark is a study-only inversion:
   the product is light-only by decision (docs/web-ui.md, Visual design). */
:root{color-scheme:light;--w:#fff;--k:#000;--g1:#f2f2f2;--g2:#999;--g3:#555;--pale:#d9d9d9;--grid:#e6e6e6;--ok:#1a7e37;--bad:#b42318;--bad-bg:#fdecea;--start:#966100;--alert:#b21f2d;
  --text:"Iosevka Etoile",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
:root[data-theme=dark]{color-scheme:dark;--w:#0f0f0f;--k:#ececec;--g1:#1e1e1e;--g2:#6a6a6a;--g3:#a6a6a6;--pale:#3d3d3d;--grid:#242424;--ok:#4cbf6b;--bad:#ff6b5d;--bad-bg:#3b1612;--start:#d39a2c;--alert:#c42a37}
*{box-sizing:border-box}
html,body{margin:0;background:var(--w);color:var(--k);font:13px/20px var(--text);font-variant-numeric:tabular-nums;font-feature-settings:"calt" 1;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:var(--w);border:1px solid var(--k);border-radius:0;padding:0 8px;min-height:20px;cursor:pointer;line-height:18px}
button:hover,button[aria-pressed=true]{background:var(--k);color:var(--w)}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.mono{font-family:var(--mono)}

/* study chrome */
.study{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;border-bottom:1px solid var(--k)}
.study h1{margin:0;font-size:13px;line-height:20px;text-transform:uppercase;letter-spacing:.08em}
.study nav{display:flex;flex-wrap:wrap;gap:4px}
.study .theme{margin-left:auto}
.orb-header{display:flex;align-items:center;gap:10px;height:24px;padding:0 12px;border-bottom:1px solid var(--k);white-space:nowrap;overflow:hidden}
.orb-header .name{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.orb-header .totals{margin-left:auto;color:var(--g3);font:11px/24px var(--mono)}
.tile{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.tile.s12{width:12px;height:12px}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:6px 12px;border-bottom:1px solid var(--g1);font:11px/20px var(--mono)}
.vbar .sep{width:8px}
.vbar .crumbs{display:flex;flex-wrap:wrap;gap:0 4px;min-width:0;color:var(--g3)}
.vbar .crumbs button{border:0;padding:0 2px;max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .crumbs button:last-child{color:var(--k)}
.vbar .crumbs button:last-child:hover{color:var(--w)}
section[hidden]{display:none}

/* shared encodings: model wait outlined, thinking as a bit raster, streaming ink,
   tools pale, failure red, Luna grey, compaction hatched */
.ev{position:absolute;z-index:1;cursor:pointer}
.seg{position:absolute;top:0;bottom:0}
.s-wait{background:var(--w);border:1px solid var(--k)}
.s-think{background:repeating-conic-gradient(var(--k) 0 25%,var(--w) 0 50%) 0 0/4px 4px}
.s-stream{background:var(--k)}
.llm.err .s-wait,.llm.err .s-think{border:1px solid var(--bad);background:var(--bad-bg)}
.llm.err .s-think{background:repeating-conic-gradient(var(--bad) 0 25%,var(--bad-bg) 0 50%) 0 0/4px 4px}
.call{background:var(--pale);color:var(--k);font:11px/11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:3px}
.call.fail{background:var(--bad);color:var(--w)}
.call.aborted{background:var(--w);border:1px solid var(--bad);color:var(--bad)}
.call.inner{background:var(--g1);border:1px solid var(--pale);line-height:7px;font-size:9px}
.luna{background:var(--g2)}
.compact{background:repeating-linear-gradient(135deg,var(--g2) 0 1px,var(--w) 1px 4px);border:1px solid var(--g2)}
.hot{outline:2px solid var(--k);outline-offset:1px;z-index:3}
.crop{position:absolute;pointer-events:none;z-index:6}
.crop i{position:absolute;width:9px;height:9px;border:0 solid var(--k)}
.crop i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}
.crop i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}
.crop i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}
.crop i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}

/* tooltip: the chart tooltip (chart-tip) */
.tip{position:fixed;z-index:50;max-width:min(380px,calc(100vw - 16px));padding:2px 8px;color:var(--k);background:var(--w);border:1px solid var(--k);font:11px/16px var(--mono);pointer-events:none}
.tip b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip table{border-collapse:collapse}.tip td.k{white-space:nowrap}.tip td{padding:0;vertical-align:top}.tip td+td{padding-left:12px}
.tip .k,.inspect dt,.kv dt{color:var(--g3)}
.tip .bad,.inspect .bad,.kv .bad{color:var(--bad)}

/* inspection: bordered box, mono facts */
.inspect{margin:8px 12px 12px;border:1px solid var(--k);background:var(--w)}
.inspect-h{display:flex;align-items:center;gap:8px;min-height:22px;padding:0 0 0 8px;border-bottom:1px solid var(--k)}
.inspect-h strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspect-h button{border:0;border-left:1px solid var(--k);width:24px;height:22px;padding:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0 16px;margin:0;padding:4px 8px;font:11px/18px var(--mono)}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media(min-width:900px){.inspect .kv{grid-template-columns:max-content minmax(0,1fr) max-content minmax(0,1fr)}}

/* ---------- A · lanes ---------- */
.a-wrap{display:grid;grid-template-columns:var(--lab,104px) minmax(0,1fr);border-bottom:1px solid var(--k)}
.a-labels{position:relative;border-right:1px solid var(--k)}
.a-lab{position:absolute;left:0;right:0;padding:0 6px 0 12px;font:11px/16px var(--mono);color:var(--g3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-scroll{position:relative;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;cursor:grab}
.a-scroll.drag{cursor:grabbing}
.a-canvas{position:relative}
.a-lane{position:absolute;left:0;right:0;border-bottom:1px solid var(--g1)}
.a-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.a-ticklab{position:absolute;top:3px;font:11px/16px var(--mono);color:var(--g3);white-space:nowrap;transform:translateX(-50%)}
.a-gap{position:absolute;top:0;bottom:0;background:var(--g1);border-left:1px solid var(--g2);border-right:1px solid var(--g2)}
.a-gap::before,.a-gap::after{content:"";position:absolute;top:6px;width:7px;height:12px;border-left:1px solid var(--g3);transform:skewX(-20deg)}
.a-gap::before{left:3px}.a-gap::after{right:-1px}
.a-gaplab{position:absolute;top:22px;left:0;right:0;text-align:center;font:11px/16px var(--mono);color:var(--g3);white-space:nowrap}
.a-turn{position:absolute;width:1px;background:var(--g2)}
.mk-user{position:absolute;width:8px;height:8px;background:var(--k)}
.mk-user.hollow{background:var(--w);border:1px dotted var(--k)}
.mk-queue{position:absolute;height:8px;border:1px solid var(--k);border-right:0;background:var(--w)}
.mk-abort{position:absolute;width:2px;background:var(--bad)}
.mk-abort::before{content:"✕";position:absolute;left:-4px;top:-14px;font:11px/12px var(--mono);color:var(--bad)}
.mk-alert{position:absolute;width:2px;background:var(--bad)}
.mk-alert::before{content:"";position:absolute;left:2px;top:0;border-top:7px solid var(--bad);border-right:12px solid transparent}
.mk-link{position:absolute;z-index:0;width:0;border-left:1px dashed var(--g3);pointer-events:none}
.mk-notify{position:absolute;width:7px;height:7px;background:var(--w);border:1px solid var(--k);transform:rotate(45deg)}
.mk-done{position:absolute;width:7px;height:7px;background:var(--k)}
.run-rule{position:absolute;height:1px;background:var(--k);pointer-events:none}
.life{background:var(--g1);display:flex;align-items:center;padding-left:2px;overflow:hidden}
.life.starting{background:var(--w);border:1px solid var(--start)}
.life.replace{background:repeating-linear-gradient(135deg,var(--start) 0 1px,transparent 1px 4px);border:1px solid var(--start)}
.life.restart{background:var(--start)}
.life.point{background:none;padding:0}

/* ---------- B · rail clock ---------- */
.b-feed{position:relative;padding:8px 0 24px}
.b-row{display:grid;grid-template-columns:64px 52px minmax(0,1fr);align-items:start}
.b-time{font:11px/20px var(--mono);color:var(--g3);text-align:right;padding-right:8px;white-space:nowrap}
.b-body{min-width:0;padding-right:12px}
.b-body.nested{padding-left:16px}
.b-row.hot .rail>summary,.b-row.hot .b-plain{background:var(--g1)}
.b-bars{position:absolute;top:0;bottom:0;left:64px;width:52px}
.b-bars .ev{min-height:2px}
.b-bars .vrule{position:absolute;width:1px;background:var(--grid)}
.b-nest{position:absolute;width:1px;background:var(--k);pointer-events:none}
.b-user{padding:9px 12px;margin:4px 0;color:var(--w);background:var(--k);white-space:pre-wrap;overflow-wrap:anywhere}
.b-user.q{border-left:2px dotted var(--w)}
.rec-status{margin-right:6px;padding:0 5px;border:1px solid currentcolor;line-height:16px}
.rail{margin:0}
.rail>summary{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:8px;align-items:center;min-height:20px;padding:0 8px;cursor:pointer;list-style:none;user-select:none}
.rail>summary::-webkit-details-marker{display:none}
.rail>summary:hover{background:var(--g1)}
.rail .mk{color:var(--g3)}.rail .mk::before{content:"\25b8"}.rail[open]>summary .mk::before{content:"\25be"}
.rail .sm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .hl,.rail .mt{color:var(--g3);white-space:nowrap}
.rail .mt{font:11px/20px var(--mono)}
.rail.failed .lb,.rail.failed .mk{color:var(--bad)}
.rail-body{padding:2px 8px 4px calc(2ch + 16px);background:var(--g1);color:var(--g3)}
.rail-body .kv{padding:0}
.inner-list{margin:2px 0 6px;padding:0;list-style:none;font:11px/18px var(--mono)}
.inner-list li{display:grid;grid-template-columns:minmax(0,1fr) 56px auto;gap:8px;align-items:center;color:var(--k)}
.inner-list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inner-list .ib{position:relative;height:6px;background:var(--w)}
.inner-list .ib i{position:absolute;top:0;bottom:0;background:var(--g3)}
.b-prose{margin:2px 0 6px;padding:0 8px;overflow-wrap:anywhere}
.b-plain{padding:0 8px;color:var(--g3);display:flex;align-items:center;gap:8px;min-height:20px}
.b-plain.bad{color:var(--bad)}
.alert-band{margin:4px 0;padding:10px 12px;background:var(--alert);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.b-gap{margin:6px 0;height:28px;display:flex;align-items:center;justify-content:center;gap:6px;font:11px/16px var(--mono);color:var(--g3);background:var(--g1);border-top:1px solid var(--g2);border-bottom:1px solid var(--g2)}
.b-gaprow .b-time{line-height:40px}

/* ---------- C · icicle ---------- */
.c-stage{position:relative;margin:0 12px;overflow:hidden}
.c-axis{position:relative;height:36px;border-bottom:1px solid var(--k)}
.c-axis span{position:absolute;top:3px;font:11px/16px var(--mono);color:var(--g3);white-space:nowrap}
.c-grid{position:absolute;top:36px;bottom:0;width:1px;background:var(--grid)}
.c-node{position:absolute;height:20px;overflow:hidden;cursor:pointer;background:var(--w);border:1px solid var(--g2);font:11px/14px var(--mono);white-space:nowrap}
.c-node>span{display:block;padding:1px 4px 0;overflow:hidden;text-overflow:ellipsis}
.c-node .strip{position:absolute;left:0;right:0;bottom:0;height:5px}
.c-node .strip.call{padding:0}
.c-node.c-step{background:var(--g1);border-color:var(--w);color:var(--k)}
.c-node.c-turn{background:var(--k);border-color:var(--k);color:var(--w);font-family:var(--text);font-size:13px;line-height:18px}
.c-node.c-run{border-color:var(--k)}
.c-node.fail{border-color:var(--bad);color:var(--bad)}
.c-node.thin{border:0;background:none}
.c-node.thin .strip{height:100%}
.c-node:hover{outline:1px solid var(--k);z-index:2}
.c-band{position:absolute;left:0;right:0;font:11px/16px var(--mono);color:var(--g3)}
.c-mark{position:absolute;top:18px;bottom:0;width:0;border-left:1px dashed var(--k);pointer-events:none}
.c-mark.bad{border-left:2px solid var(--bad)}
.c-pin{position:absolute;top:22px;width:8px;height:8px;margin-left:-4px;cursor:pointer}
.c-pin.steer{background:var(--w);border:1px dotted var(--k)}
.c-pin.notify{background:var(--w);border:1px solid var(--k);transform:rotate(45deg)}
.c-pin.alert{background:var(--bad)}
.c-pin.abort{color:var(--bad);font:11px/8px var(--mono);width:auto}
.c-pin.life{top:19px;width:12px;height:12px;margin-left:-6px}
.c-where{position:relative;height:20px;margin:12px 12px 0;display:flex}
.c-where>div{position:relative;height:20px;overflow:hidden;font:11px/20px var(--mono);white-space:nowrap;cursor:default}
.c-where>div+div{border-left:2px solid var(--w)}
.c-where span{position:relative;padding:0 4px;background:var(--w);color:var(--k)}
.c-where .s-stream span{background:none;color:var(--w)}
.c-where .call span{background:none}
.c-where .idle{background:var(--g1)}
.c-where .idle span{background:none;color:var(--g3)}

/* ---------- D · waterfall ---------- */
.d-scroll{overflow:auto;max-height:calc(100dvh - 120px)}
.d-table{width:100%;table-layout:fixed;border-collapse:collapse;font:11px/18px var(--mono)}
.d-table col.c-start{width:calc(8ch + 16px)}
.d-table col.c-call{width:min(32ch,22vw)}
.d-table th{position:sticky;top:0;z-index:4;background:var(--w);border-bottom:1px solid var(--k);font-weight:400;color:var(--g3);text-align:left;padding:2px 8px;white-space:nowrap}
.d-table td{padding:0 8px;text-align:left;vertical-align:top;white-space:nowrap;border-bottom:1px solid var(--g1)}
.d-table td.name{overflow:hidden;text-overflow:ellipsis}
.d-table td.name .a{color:var(--g3)}
.d-table td.wf{position:relative;padding:0}
.wfi{position:absolute;top:0;bottom:0;left:8px;right:12px}
.d-table tr[data-did]{cursor:pointer}
.d-table tr.ev-row:hover td{background:var(--g1)}
.d-table tr.sel td:not(.wf){background:var(--k)!important;color:var(--w)}
.d-table tr.sel td.name{white-space:normal;overflow-wrap:anywhere}
.d-table tr.sel td .a,.d-table tr.sel td .bad{color:var(--w)}
.d-table .bad{color:var(--bad)}
.d-table tr.side td{color:var(--g3)}
.d-table tr.band td{background:var(--k);color:var(--w);border-bottom:0;font:13px/20px var(--text);padding-top:4px;padding-bottom:4px;vertical-align:top}
.d-table tr.band td.n{font:11px/20px var(--mono)}
.d-table tr.band td.txt{white-space:normal;overflow-wrap:anywhere}
.d-table tr.alertrow td,.d-table tr.alertrow:hover td{background:var(--alert);color:#fff;overflow:hidden;text-overflow:ellipsis}
.d-table tr.alertrow.sel td{white-space:normal;overflow-wrap:anywhere}
.d-table tr.gaprow td{background:var(--g1);color:var(--g3);text-align:center}
.d-table tr.detail td{background:var(--g1);white-space:normal;padding:2px 8px 6px}
.wfbar{position:absolute;top:4px;height:10px}
.wfbar.inst{width:2px;background:var(--k)}.wfbar.inst.bad{background:var(--bad)}
.tip b.full{white-space:normal;overflow-wrap:anywhere}
.d-ind{display:inline-block;width:2ch;color:var(--g2)}
.d-nest{border-left:1px solid var(--k);padding-left:1ch;margin-left:.5ch}

/* ---------- E · tide ---------- */
.e-scroll{position:relative;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;border-bottom:1px solid var(--k)}
.e-inner{position:relative}
.e-y{position:sticky;left:0;width:0;height:0;z-index:7;pointer-events:none}
.e-y span{position:absolute;left:0;padding:0 4px 0 12px;background:var(--w);font:11px/14px var(--mono);color:var(--g3);white-space:nowrap}
.e-canvas{position:relative}
.e-canvas>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e-canvas>svg.top{z-index:3}
.e-canvas .a-gap{z-index:4;cursor:pointer}
.e-canvas .call{font-size:0;padding:0}
.e-area{fill:var(--g1)}
.e-line{fill:none;stroke:var(--k);stroke-width:2}
.e-sub{fill:none;stroke:var(--g3);stroke-width:1.5}
.e-cost{fill:none;stroke:var(--k);stroke-width:1}
.e-grid{stroke:var(--grid);stroke-width:1}
.e-ceil{stroke:var(--k);stroke-width:1}
.e-base{stroke:var(--g2);stroke-width:1}
.e-cross{stroke:var(--k);stroke-width:1;stroke-dasharray:2 2}
.e-dot{fill:var(--w);stroke:var(--k);stroke-width:2}
.e-sel{stroke:var(--k);stroke-width:6}
.e-lab{font:11px var(--mono);fill:var(--g3)}

/* ---------- F · metro ---------- */
.f-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;border-bottom:1px solid var(--k)}
.f-canvas{position:relative}
.f-canvas svg{display:block;overflow:visible}
.f-main{stroke:var(--k);stroke-width:6}
.f-main.tunnel{stroke-dasharray:5 4}
.f-branch{fill:none;stroke:var(--k);stroke-width:4;stroke-linejoin:round}
.f-luna{stroke:var(--g2);stroke-width:2}
.f-host{stroke:var(--g3);stroke-width:2}
.f-host.off{stroke-dasharray:2 3}
.f-link{stroke:var(--k);stroke-width:1;stroke-dasharray:2 2}
.f-spur{stroke:var(--pale);stroke-width:3}
.f-spur.fail{stroke:var(--bad)}
.f-spur.aborted{stroke:var(--bad);stroke-dasharray:2 2}
.f-cap{fill:var(--w);stroke:var(--g3);stroke-width:1}
.f-st{cursor:pointer;outline:none}
.f-st .hit{fill:transparent}
.f-st:hover .hit,.f-st:focus-visible .hit{stroke:var(--g3);stroke-width:1}
.f-stop{fill:var(--w);stroke:var(--k);stroke-width:2}
.f-ix{fill:var(--w);stroke:var(--k);stroke-width:3}
.f-ix.steer{stroke-width:2;stroke-dasharray:2 2}
.f-ixn{font:700 11px var(--mono);fill:var(--k);text-anchor:middle;dominant-baseline:central}
.f-err{fill:var(--bad);stroke:var(--w);stroke-width:1.5}
.f-hb{fill:var(--w)}.f-hl{stroke:var(--g2);stroke-width:1.5}
.f-compact{fill:url(#f-hatch);stroke:var(--g2);stroke-width:1}
.f-done{fill:var(--k)}
.f-alert{fill:var(--bad)}
.f-notify{fill:var(--w);stroke:var(--k);stroke-width:1.5}
.f-abort{fill:var(--w);stroke:var(--bad);stroke-width:2}
.f-x{stroke:var(--bad);stroke-width:1.5}
.f-lunast{fill:var(--g2)}
.f-lab{font:11px var(--mono);fill:var(--g3)}
.f-lab.ix{fill:var(--k);font-weight:700}
.f-lab.bad{fill:var(--bad)}

/* ---------- G · replay ---------- */
.g-time{margin-left:auto;color:var(--k)}
.g-scrub{position:relative;height:44px;margin:8px 12px 0;border-bottom:1px solid var(--k);cursor:ew-resize;touch-action:none;user-select:none}
.g-scrub:focus-visible{outline:2px solid var(--k);outline-offset:4px}
.g-scrub .call{font-size:0;padding:0}
.g-scrub .a-gap::before,.g-scrub .a-gap::after{top:14px}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ======================================================================
   Shared fake session: one Pi orb, 09:12:04 → 11:46, five turns,
   one subagent, one code-mode script, sleep/wake and a manual Stop/Start.
   ====================================================================== */
const S=1000;
const at=s=>{let v=0;for(const x of s.split(':'))v=v*60+Number(x);return Math.round(v*S)};
const BASE=9*3600+12*60+4;
const p2=n=>String(n).padStart(2,'0');
const clock=(ms,frac)=>{const s=BASE+ms/S;const r=`${p2(Math.floor(s/3600)%24)}:${p2(Math.floor(s/60)%60)}:${p2(Math.floor(s%60))}`;return frac?r+'.'+Math.floor(s*10%10):r};
const MODEL={sol:'openai-codex/gpt-6.1-sol',terra:'openai-codex/gpt-5.6-terra',luna:'openai-codex/gpt-6-luna'};
const PRICE={sol:[1.25,.125,10],terra:[.5,.05,4],luna:[.1,.01,.8]}; // $ per M: input, cache read, output
const CTX_LIMIT={sol:128000,terra:128000,luna:32000}; // context window, tokens
const EV=[];let N=0,TURN=0;
const add=e=>{e.id='e'+(++N);if(e.turn==null)e.turn=TURN;EV.push(e);return e};
const ctx={root:14200,sub1:9800},lastIn={root:0,sub1:0};
function user(t,text,o={}){if(o.mode!=='steering')TURN++;return add({kind:'user',lane:'you',start:t,end:t,text,mode:o.mode||'message',delivered:o.delivered??t})}
function llm(lane,t,o){
  const model=o.model||(lane==='root'?'sol':'terra');
  const w=(o.ttft||0)*S,th=(o.think||0)*S,st=(o.stream||0)*S,err=o.stop==='error';
  const inp=err?0:ctx[lane],cr=err?0:Math.min(lastIn[lane],inp),out=err?0:(o.out||0),p=PRICE[model];
  const e=add({kind:'llm',lane,model,start:t,ttft:t+w,thinkEnd:t+w+th,end:t+w+th+st,inp,cr,out,cost:((inp-cr)*p[0]+cr*p[1]+out*p[2])/1e6,limit:CTX_LIMIT[model],stop:o.stop||'toolUse',head:o.head,text:o.text,say:o.say,err:o.err,attempt:o.attempt,backoff:o.backoff});
  if(!err){lastIn[lane]=inp;ctx[lane]+=out+(o.add??900)*3}
  return e;
}
function calls(lane,t,parent,list){let end=t;list.forEach(([name,arg,dur,ok=true,out],i)=>{const s=t+i*14;const kind=name==='codemode'?'code':name==='subagent'?'spawn':'tool';const e=add({kind,lane,name,arg,start:s,end:s+dur*S,ok,out,parent:parent.id});end=Math.max(end,e.end)});return end}
function step(lane,t,o,list){const L=llm(lane,t,o);const end=list?calls(lane,L.end+30,L,list):L.end;return {L,t:end+(list?80:0)}}
function inner(code,off,dur,name,arg,ok,out){return add({kind:'inner',lane:code.lane,name,arg,start:code.start+off*S,end:code.start+(off+dur)*S,ok,out,parent:code.id})}
function luna(purpose,t,dur,inp,out,text){const p=PRICE.luna;return add({kind:'luna',lane:'luna',model:'luna',purpose,start:t,end:t+dur*S,inp,out,cr:0,cost:(inp*p[0]+out*p[2])/1e6,text})}
function life(state,t,end,text){return add({kind:'life',lane:'host',state,start:t,end,text})}
const last=()=>EV[EV.length-1];

// Turn 1 · find and fix
user(0,'The heatmap renders blank in WebKit when a whole row is zero. Find out why and fix it.');
luna('orb name',300,1.7,2100,9,'heatmap zero rows');
let r={t:350};
r=step('root',r.t,{ttft:2.6,think:5.8,stream:1.9,out:540,head:'Locate the heatmap spec builder',say:'Starting where the heatmap spec is built.',add:9200},[
  ['bash','rg -n "heatmap" apps/web/src',.38,true,'14 matches in 4 files'],
  ['read','apps/web/src/lib/chart-spec.ts',.04,true,'1,244 lines'],
  ['read','apps/web/src/components/Chart.tsx',.03,true,'318 lines']]);
r=step('root',r.t,{ttft:1.8,think:9.2,stream:1.1,out:410,head:'Square-root scale over an all-zero row',say:'An all-zero row gives the square-root scale an empty domain. Checking the heatmap tests before changing it.',add:2600},[
  ['read','apps/web/src/lib/chart-spec.ts:880–1010',.03,true,'131 lines'],
  ['bash','npx vitest run src/lib/chart-spec.test.ts -t heatmap',13.8,true,'4 passed']]);
r=step('root',r.t,{ttft:2.1,think:14.6,stream:6.4,out:1320,head:'Guard the zero domain',say:'Guarding the zero domain so empty rows keep a 1px floor.',add:300},[['edit','apps/web/src/lib/chart-spec.ts',.06,true,'+9 −2']]);
r=step('root',r.t,{ttft:1.5,think:2.2,stream:3.9,out:760,add:300},[['edit','apps/web/src/lib/chart-spec.test.ts',.05,true,'+24 −0']]);
r=step('root',r.t,{ttft:1.4,stream:1.2,out:96,add:700},[['bash','npx vitest run src/lib/chart-spec.test.ts -t heatmap',9.1,true,'5 passed']]);
r=step('root',r.t,{ttft:1.3,stream:1.1,out:88,add:2400},[['bash','npm run test:browser -- charts.spec.ts --project=webkit',108.2,false,'exit 1 · expect(locator).toHaveCount(36) — received 30']]);
luna('headline',last().start+600,1.3,1400,8,'Run WebKit chart tests');
r=step('root',r.t,{ttft:1.9,think:11.8,stream:2.4,out:520,head:'WebKit drops zero-height rect marks',say:'WebKit draws 30 of 36 cells where Chromium draws all of them: zero-height rects are dropped, not drawn transparent.',add:1800},[['read','apps/web/e2e/charts.spec.ts:40–96',.03,true,'57 lines']]);
r=step('root',r.t,{ttft:1.4,think:3.0,stream:2.8,out:380,add:300},[['edit','apps/web/src/lib/chart-spec.ts',.05,true,'+4 −1']]);
r=step('root',r.t,{ttft:1.6,stream:1.0,out:90,add:600},[['bash','npm run test:browser -- charts.spec.ts --project=webkit',97.6,true,'12 passed']]);
r=step('root',r.t,{ttft:1.5,stream:1.2,out:110,add:900},[
  ['bash','npm run typecheck',38.4,true,'0 errors'],
  ['bash','npm run lint -- apps/web/src/lib',21.7,true,'0 problems']]);
let f=llm('root',r.t,{ttft:1.7,think:3.2,stream:9.8,out:690,stop:'stop',add:200,text:'WebKit skips rect marks whose height rounds to zero, so a row of zeros on the square-root scale vanished. Zero cells now draw at a 1px minimum in the pale fill; the WebKit chart suite passes.'});
luna('turn summary',f.end+300,2.4,3800,46,'Heatmap zero rows fixed; WebKit charts pass');

// Turn 2 · code mode against Datadog, provider error and retry
user(at('9:40'),'Chart heatmap render time against cell count from Datadog for the last day.');
r=step('root',at('9:40')+300,{ttft:2.2,think:7.4,stream:8.8,out:1450,head:'Query render timings by cell count',say:'Querying p95 render time and render counts per cell bucket in one script.',add:4200},[['codemode','const [p95, n] = await Promise.all([mcp__datadog__query_metrics(…), …]); await chart({kind: "line", …})',11.4,true,'chart · Heatmap render time by cells']]);
{const code=last();
inner(code,.2,1.4,'mcp__datadog__search_metrics','chart.render.*',true,'6 metrics');
inner(code,1.7,7.9,'mcp__datadog__query_metrics','p95:chart.render.ms{kind:heatmap} by {cells}',true,'1,440 points × 4');
inner(code,1.72,6.1,'mcp__datadog__query_metrics','sum:chart.render.count{kind:heatmap}.as_count()',true,'1,440 points');
inner(code,9.7,.9,'orb_messages','search "render timings"',true,'2 messages');
inner(code,10.7,.25,'chart','Heatmap render time by cells',true,'line · 4 series · 1,440 points');}
{const e1=llm('root',r.t,{ttft:21.0,stop:'error',err:'503 upstream connect error or disconnect/reset before headers',attempt:1});
f=llm('root',e1.end+2000,{ttft:2.4,think:4.1,stream:7.6,out:820,stop:'stop',attempt:2,backoff:2000,add:100,text:'p95 render time stays under 4ms up to 1,600 cells and rises to 23ms at 2,400. Zero rows render as fast as filled ones.'});
f.retryOf=e1.id;}
luna('turn summary',f.end+300,2.1,3100,38,'Render time charted from Datadog');
life('stopped',at('11:30'),at('13:10'),'Stop');
life('starting',at('13:10'),at('13:31'),'Start');

// Turn 3 · subagent in parallel, steering, notification, alert
user(at('13:40'),'Have a subagent audit the other chart kinds for the same zero bug while you write the regression test.');
r=step('root',at('13:40')+300,{ttft:2.0,think:6.1,stream:3.4,out:610,head:'Split the audit from the regression test',say:'A subagent takes the audit; I will write the regression test meanwhile.',add:1200},[
  ['subagent','Audit zero-value handling in every chart kind',.6,true,'started'],
  ['read','apps/web/e2e/charts.spec.ts',.03,true,'212 lines']]);
const spawn=EV.find(e=>e.kind==='spawn');
{let s={t:spawn.end+400};
s=step('sub1',s.t,{ttft:3.1,think:4.2,stream:2.0,out:380,head:'Where domains are computed',say:'Mapping where each chart kind computes its domain.',add:3100},[
  ['bash','rg -n "domain" apps/web/src/lib/chart-spec.ts',.31,true,'22 matches'],
  ['bash','rg -n "values.length" apps/web/src/lib',.28,true,'7 matches'],
  ['read','apps/web/src/lib/chart-spec.ts:460–560',.03,true,'101 lines']]);
s=step('sub1',s.t,{ttft:2.4,think:9.1,stream:1.6,out:300,head:'Histogram bins and timeline spans',add:2600},[
  ['read','apps/web/src/lib/chart-spec.ts:700–800',.03,true,'101 lines'],
  ['read','apps/web/src/lib/chart-spec.ts:1060–1120',.03,true,'61 lines']]);
s=step('sub1',s.t,{ttft:2.0,think:5.5,stream:4.8,out:880,head:'Probe every kind with zeros',say:'One zero-value probe per chart kind, so every failure shows up in a single run.',add:400},[['edit','apps/web/src/lib/chart-spec.test.ts',.05,true,'+41 −0']]);
s=step('sub1',s.t,{ttft:1.3,stream:.9,out:70,add:1900},[['bash','npx vitest run src/lib/chart-spec.test.ts -t zero',11.2,false,'exit 1 · histogram: expected 30 bins, received 27']]);
s=step('sub1',s.t,{ttft:2.2,think:12.0,stream:4.1,out:610,head:'Histogram drops zero-count bins',say:'Histogram drops zero-count bins. Reporting that to the parent before finishing.',add:200},[['notify_parent','Histogram drops zero-count bins at phone width; the heatmap fix does not cover it.',.2,true,'delivered']]);
const np=last();
add({kind:'notify',lane:'root',start:np.end,end:np.end,text:np.arg,from:np.id});
const sf=llm('sub1',s.t,{ttft:1.4,stream:2.6,out:240,stop:'stop',text:'Histogram is the only other kind affected; a failing test reproduces it.'});
add({kind:'done',lane:'sub1',start:sf.end,end:sf.end,text:'completed',from:spawn.id});}
r=step('root',r.t,{ttft:1.9,think:4.0,stream:5.2,out:940,head:'Zero-row regression test',add:300},[['edit','apps/web/e2e/charts.spec.ts',.05,true,'+38 −0']]);
r=step('root',r.t,{ttft:1.5,stream:1.0,out:84,add:1500},[['bash','npm run test:browser -- charts.spec.ts',158.4,true,'24 passed']]);
const steer=user(last().start+61000,'Cover the 320px viewport too.',{mode:'steering'});
r=step('root',r.t,{ttft:1.8,think:3.3,stream:4.4,out:720,head:'Add the 320px case',add:300},[['edit','apps/web/e2e/charts.spec.ts',.05,true,'+12 −1']]);
steer.delivered=r.L.start;
r=step('root',r.t,{ttft:1.4,stream:.9,out:80,add:1400},[['bash','npm run test:browser -- charts.spec.ts',151.1,true,'26 passed']]);
r=step('root',r.t,{ttft:2.1,think:8.8,stream:6.0,out:1100,head:'Histogram zero-count bins',say:'Applying the same floor to histogram bins.',add:300},[['edit','apps/web/src/lib/chart-spec.ts',.06,true,'+7 −3']]);
r=step('root',r.t,{ttft:1.4,stream:1.0,out:90,add:900},[['bash','npx vitest run src/lib/chart-spec.test.ts',8.9,true,'61 passed']]);
r=step('root',r.t,{ttft:1.7,think:2.9,stream:1.6,out:160,head:'Production is affected',say:'The histogram path ships in the current release, so this is live.',add:100},[['orb_alert','Histogram zero-bin bug is live in production.',.7,true,'alert raised']]);
add({kind:'alert',lane:'root',start:last().end,end:last().end,text:'Histogram zero-bin bug is live in production.'});
f=llm('root',r.t,{ttft:1.9,think:2.6,stream:8.9,out:640,stop:'stop',add:100,text:'Heatmap and histogram both keep zero rows now, with Chromium and 320px regression tests. The audit found no other affected kinds.'});
luna('turn summary',f.end+300,2.6,4400,52,'Zero bins fixed in heatmap and histogram');
life('sleeping',at('24:00'),at('2:17:10'),'idle sleep');

// Turn 4 · queued message wakes the orb onto a replacement host; auto-compaction; abort
const q=user(at('2:17:10'),'Run the full browser suite, then open a PR.',{mode:'queued'});
life('starting',at('2:17:10'),at('2:17:52'),'Wake');
life('replace',at('2:17:13'),at('2:17:41'),'previous host reclaimed; replacement provisioned');
q.delivered=at('2:17:53');
add({kind:'compact',lane:'root',start:at('2:17:53'),end:at('2:18:24'),before:ctx.root,after:22400,auto:true});
ctx.root=22400;lastIn.root=0;
r=step('root',at('2:18:24')+100,{ttft:3.4,think:6.0,stream:2.1,out:310,head:'Full browser suite',say:'Running the full browser suite first.',add:0},[['bash','npm run test:browser',1,'aborted','killed by abort']]);
{const b=last();b.end=at('2:20:05');}
add({kind:'abort',lane:'root',start:at('2:20:05'),end:at('2:20:05'),text:'aborted by user'});

// Turn 5 · interrupt, harness restart, PR
user(at('2:20:21'),'Only Chromium; skip WebKit on this host.');
r=step('root',at('2:20:21')+300,{ttft:2.6,think:2.4,stream:1.3,out:120,head:'Chromium only',say:'Restricting the run to Chromium.',add:2600},[['bash','npm run test:browser -- --project=chromium',371,true,'118 passed']]);
luna('headline',last().start+500,1.2,1300,7,'Run Chromium browser suite');
{const hr=llm('root',r.t,{ttft:1.9,think:3.0,stop:'error',err:'agent connection lost: runtime exited 137',attempt:1});
life('restart',hr.end,hr.end+6200,'runtime exited 137; harness restarted');
r=step('root',hr.end+6400,{ttft:2.2,think:2.8,stream:1.4,out:150,attempt:2,backoff:6400,head:'Review the diff',say:'Checking the diff before committing.',add:900},[
  ['bash','git status --short',.09,true,'M 3 files'],
  ['bash','git diff --stat',.11,true,'3 files changed, 112 insertions(+), 6 deletions(-)']]);
r.L.retryOf=hr.id;}
r=step('root',r.t,{ttft:1.6,think:1.2,stream:2.2,out:210,add:200},[['bash','git switch -c fix/chart-zero-domains && git commit -am "Keep zero rows in heatmap and histogram"',.42,true,'[fix/chart-zero-domains 9c41e07]']]);
r=step('root',r.t,{ttft:1.3,stream:.8,out:60,add:200},[['bash','git push -u origin fix/chart-zero-domains',2.8,true,'new branch']]);
r=step('root',r.t,{ttft:1.5,think:1.0,stream:3.6,out:330,add:200},[['bash','gh pr create --fill',3.1,true,'https://github.com/schani/pi-orb/pull/174']]);
r=step('root',r.t,{ttft:1.4,stream:.9,out:70,add:1600},[['bash','gh pr checks 174 --watch',274,true,'9 checks passed']]);
f=llm('root',r.t,{ttft:1.6,think:1.4,stream:4.9,out:260,stop:'stop',text:'Chromium suite passes (118). PR #174 is open and its checks are green.'});
luna('turn summary',f.end+300,2.2,3600,31,'PR #174 opened; Chromium suite green');
life('stop',at('2:43:00'),at('2:43:00'),'idle stop');

/* ---------------- derived ---------------- */
EV.sort((a,b)=>a.start-b.start||a.id.localeCompare(b.id,undefined,{numeric:true}));
const byId=Object.fromEntries(EV.map(e=>[e.id,e]));
const END=Math.max(...EV.map(e=>e.end));
const AGENT=new Set(['root','sub1']);
const TURNS=EV.filter(e=>e.kind==='user'&&e.mode!=='steering').map(u=>({n:u.turn,user:u,start:u.start,end:u.start}));
for(const e of EV){const T=TURNS.find(t=>t.n===e.turn);if(T&&AGENT.has(e.lane))T.end=Math.max(T.end,e.end)}
const turnOf=n=>TURNS.find(t=>t.n===n);

}

const C={turn:3,path:[],sel:null};
function cTree(n){

  const leaf=c=>mk('call',c.start,c.end,callLabel(c),c,EV.filter(i=>i.parent===c.id).map(leaf));
  const steps=lane=>EV.filter(e=>inT(e)&&e.lane===lane&&e.kind==='llm').map(L=>{
    const kids=EV.filter(e=>e.parent===L.id);
    return mk('step',L.start,Math.max(L.end,...kids.map(k=>k.end)),L.head||'',L,[mk('llm',L.start,L.end,'',L),...kids.map(leaf)]);
  });

  const root=mk('turn',T.start,T.end,T.user.text,T.user,[...comp,...steps('root')]);
  const runs=[];

function cBar(){

function renderWhere(focus,lane,v0,v1){

const D={show:{llm:true,tools:true,luna:true,host:true},errors:false,open:null};

function dWf(e,v0,v1){

  const cls=e.kind==='luna'?'luna':e.kind==='compact'?'compact':e.kind==='life'?'life '+e.state:callCls(e);

// The call cell's [name, argument]; facts that repeat it or the start column stay out of the tooltip and detail.
function dCall(e){
  if(e.kind==='llm')return [e.model,e.stop==='error'?e.err:(e.head||'')];
  if(['tool','code','spawn','inner'].includes(e.kind))return [e.kind==='inner'?e.name.replace(/^mcp__([a-z]+)__/,'$1.'):e.name,e.name==='read'||e.name==='edit'?base(e.arg):e.kind==='code'||e.name==='orb_alert'?'':e.arg];

    const ic=`<svg x="${ph?mx+12:mx-6}" y="${ph?my-6:my+10}" width="12" height="12" viewBox="0 0 16 16">${TILES[t.g.reason]}</svg>`;
    const tx=ph?`<text class="f-lab" x="${mx+30}" y="${my+4}">${dur}</text>`:`<text class="f-lab" x="${mx}" y="${my+34}" text-anchor="middle">${dur}</text>`;
    top.push(`<g class="f-st" data-id="${t.g.id}" tabindex="0"><rect class="hit" x="${Math.min(ax,bx)-4}" y="${Math.min(ay,by)-6}" width="${Math.abs(bx-ax)+8}" height="${Math.abs(by-ay)+12}" opacity="0"/>${ic}${tx}</g>`);
  }
  // stations; a label repeating the previous one on its line is dropped
  const prevLab={};
  for(const x of P.st){
    const e=x.e,c=C[x.line],[px,py]=pt(x.s,c);let shape,lc='f-lab';
    if(e.kind==='user'){shape=e.mode==='steering'?'<circle class="f-ix steer" r="5"/>':`<circle class="f-ix" r="8"/><text class="f-ixn">${e.turn}</text>`;lc+=e.mode==='steering'?'':' ix'}
    else if(e.kind==='llm')shape=e.stop==='error'?'<circle class="f-err" r="5"/>':`<circle class="f-stop" r="${e.stop==='stop'?4.5:3.5}"/>`;
    else if(e.kind==='compact')shape='<rect class="f-compact" x="-6" y="-6" width="12" height="12"/>';
    else if(e.kind==='notify')shape='<rect class="f-notify" x="-4" y="-4" width="8" height="8" transform="rotate(45)"/>';
    else if(e.kind==='done')shape='<rect class="f-done" x="-4.5" y="-4.5" width="9" height="9"/>';
    else if(e.kind==='alert')shape='<rect class="f-alert" x="-5" y="-5" width="10" height="10"/>';
    else if(e.kind==='abort')shape='<circle class="f-abort" r="6"/><path class="f-x" d="M-3,-3L3,3M3,-3L-3,3"/>';
    if(failed(e)||e.kind==='abort'||e.kind==='alert')lc+=' bad';
    const t=fmtEl(e.kind==='user'?e.delivered:e.start),main=x.line==='main',dup=prevLab[x.line]===t;prevLab[x.line]=t;
    const lab=dup?'':ph?`<text class="${lc}" x="${main?-14:12}" y="4" text-anchor="${main?'end':'start'}">${t}</text>`
      :`<text class="${lc}" transform="translate(3,${main?-11:10}) rotate(${main?-45:45})" dominant-baseline="${main?'auto':'hanging'}">${t}</text>`;
    top.push(`<g class="f-st" data-id="${e.id}" tabindex="0" transform="translate(${px},${py})"><circle class="hit" r="10"/>${shape}${lab}</g>`);
  }
  // side-line stops: Luna dots, host state tiles
  for(const l of P.lunas){const [px,py]=pt(l.s,C.luna);top.push(`<g class="f-st" data-id="${l.e.id}" tabindex="0" transform="translate(${px},${py})"><circle class="hit" r="8"/><circle class="f-lunast" r="3.5"/></g>`)}
  for(const l of P.hosts){const [px,py]=pt(l.s,C.host);top.push(`<g class="f-st" data-id="${l.e.id}" tabindex="0" transform="translate(${px},${py})"><circle class="hit" r="9"/><svg x="-7" y="-7" width="14" height="14" viewBox="0 0 16 16">${TILES[l.e.state]}</svg></g>`)}
  const len=u(P.total)+(ph?20:56),cross=C.branch+(ph?96:58);
  const [Wd,Hd]=ph?[cross,len]:[len,cross];
  cv.style.width=Wd+'px';cv.style.height=Hd+'px';
  cv.innerHTML=`<svg width="${Wd}" height="${Hd}" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Session map"><defs><pattern id="f-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="f-hb" width="4" height="4"/><line class="f-hl" x1="0" y1="0" x2="0" y2="4"/></pattern></defs>${h.join('')}${top.join('')}</svg>`;
  fSelect(F.sel);
}
function fSelect(id){
  F.sel=id;const cv=$('#f-canvas');cv.querySelectorAll('.crop').forEach(c=>c.remove());
  const el=id&&cv.querySelector(`.f-st[data-id="${id}"]`);if(el)cropAround(el.querySelector('.hit')||el,cv);
  $('#f-inspect').innerHTML=id&&el?inspectHTML(byId[id]):'';
}
$('#f-canvas').addEventListener('click',ev=>{const t=ev.target.closest('.f-st');fSelect(t?t.dataset.id:null)});
$('#f-canvas').addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.f-st')){ev.preventDefault();fSelect(ev.target.dataset.id)}});
$('#f-inspect').addEventListener('click',ev=>{if(ev.target.closest('[data-close]'))fSelect(null)});

/* ======================================================================
   G · Replay — a playhead over the session (idle compressed) rebuilds the
   transcript as it was at that moment; the scrubber is A in miniature.
   ====================================================================== */
const G={t:866*S,playing:false,speed:10,open:new Set(),wall:0,last:0,raf:0,drag:false,X:null,cache:new Map()};
const G_GAP=20*S,GC=makeScale(1,G_GAP,true); // a gap replays as 20s of session time
const BIT=['001','011','010','110','111','101','100','000'];
const gBit=()=>`<span class="bit-register" aria-hidden="true">${BIT[Math.floor(G.wall/400)%8]}</span>`;
const G_TOK={};
const gTokens=e=>G_TOK[e.id]||(G_TOK[e.id]=(e.text||e.say||'').match(/\s*\S{1,4}/g)||[]);
const G_ITEMS=(()=>{
  const it=[];let gi=0;
  for(const e of EV){
    while(gi<GAPS.length&&GAPS[gi].start<=e.start){const g=GAPS[gi++];it.push({key:g.id,gap:g,col:'main'})}
    if(['inner','luna'].includes(e.kind)||(e.kind==='life'&&['replace','sleeping','stopped'].includes(e.state)))continue;
    it.push({key:e.id,e,col:e.lane==='sub1'&&e.kind!=='done'?'sub':'main'});
  }
  while(gi<GAPS.length){const g=GAPS[gi++];it.push({key:g.id,gap:g,col:'main'})}
  return it;
})();
const G_SPAWN=EV.find(e=>e.kind==='spawn'),G_DONE=EV.find(e=>e.kind==='done');
function gRail(e,lb,hl,mt,cls='',extra=''){
  return `<details class="rail ${cls}" data-id="${e.id}"${G.open.has(e.id)?' open':''}><summary><span class="mk"></span><span class="sm"><span class="lb">${esc(lb)}</span>${hl?` · <span class="hl">${esc(hl)}</span>`:''}</span><span class="mt">${esc(mt)}</span></summary><div class="rail-body">${extra}${kvHTML(facts(e).filter(([k])=>!['response','said','result','start'].includes(k)))}</div></details>`;
}
const gLive=(e,lb,hl,mt,extra='')=>`<div class="rail running" data-id="${e.id}"><div class="g-sum"><span class="mk"></span><span class="sm"><span class="lb">${esc(lb)}</span>${hl?` · <span class="hl">${esc(hl)}</span>`:''}</span><span class="mt">${esc(mt)}</span></div>${extra}</div>`;
function gInner(e,t){
  const d=e.end-e.start;
  return `<ul class="inner-list">${EV.filter(i=>i.parent===e.id&&i.start<=t).map(i=>{const run=t<i.end,w=Math.max(.5,(Math.min(t,i.end)-i.start)/d*100);return `<li class="${run?'running':''}" data-id="${i.id}"><span>${esc(callLabel(i))}</span><span class="ib"><i style="left:${(i.start-e.start)/d*100}%;width:${w}%"></i></span><span>${fmtDur(Math.min(t,i.end)-i.start)}</span></li>`}).join('')}</ul>`;
}
function gItem(it,t){
  if(it.gap){const g=it.gap;if(t<g.start)return null;return `<div class="b-gap" data-id="${g.id}">${g.reason!=='waiting'?tile(g.reason,'s12'):''}${fmtDur(Math.min(t,g.end)-g.start)}</div>`}
  const e=it.e;if(t<e.start)return null;
  const live=t<e.end;
  switch(e.kind){
    case 'user':return `<div class="b-user${e.mode!=='message'?' q':''}">${e.mode!=='message'&&t<e.delivered?`<span class="rec-status">${e.mode}</span>`:''}${esc(e.text)}</div>`;
    case 'llm':{
      const think=e.thinkEnd>e.ttft;let out='';
      if(e.stop==='error'){
        if(live)return think&&t>=e.ttft?gLive(e,'thinking','',fmtDur(t-e.ttft)):null;
        return gRail(e,title(e),e.err,fmtDur(e.end-e.start),'failed');
      }
      if(t<e.ttft)return null;
      if(t<e.thinkEnd)return gLive(e,'thinking','',fmtDur(t-e.ttft));
      if(think||!live)out+=gRail(e,think?'thinking':'call',e.head||'',fmtDur(think?e.thinkEnd-e.ttft:e.end-e.start));
      const tk=gTokens(e);
      if(tk.length){const n=live?Math.ceil(tk.length*(t-e.thinkEnd)/(e.end-e.thinkEnd)):tk.length;out+=`<p class="b-prose">${esc(tk.slice(0,n).join(''))}${live?gBit():''}</p>`}
      return out;
    }
    case 'tool':case 'code':case 'spawn':{
      const lb=RAIL_LABEL[e.name]||e.name,hl=e.name==='read'||e.name==='edit'?base(e.arg):e.name==='notify_parent'||e.name==='orb_alert'?'':e.arg;
      if(live)return gLive(e,lb,hl,fmtDur(t-e.start),e.kind==='code'?gInner(e,t):'');
      const ok=e.ok===true;
      return gRail(e,lb,hl,ok?fmtDur(e.end-e.start):e.ok==='aborted'?'aborted':'failed',ok?'':'failed',e.kind==='code'?gInner(e,t):'')+`<div class="g-out${ok?'':' bad'}">${esc(e.out)}</div>`;
    }
    case 'compact':return live?gLive(e,'compacting',fmtTok(e.before),fmtDur(t-e.start)):gRail(e,'context compacted',fmtTok(e.before)+' → '+fmtTok(e.after),fmtDur(e.end-e.start));
    case 'notify':return gRail(e,'notification',e.text,'');
    case 'done':return gRail(e,'subagent',e.text,fmtDur(e.end-G_SPAWN.start));
    case 'abort':return `<div class="b-plain bad" data-id="${e.id}">aborted</div>`;
    case 'alert':return `<div class="alert-band" data-id="${e.id}">${esc(e.text)}</div>`;
    case 'life':{
      const rep=e.state==='starting'&&EV.find(x=>x.state==='replace'&&x.start>=e.start&&x.start<e.end&&x.start<=t);
      return `<div class="b-plain" data-id="${e.id}">${tile(e.state)}${STATE_WORD[e.state]}${rep?' · host replaced':''}${e.end>e.start?' · '+fmtDur(Math.min(t,e.end)-e.start):''}</div>`;
    }
  }
  return null;
}
// busy: an LLM call is waiting or thinking and has no streaming prose to carry the register
const gBusy=(lane,t)=>EV.some(e=>e.kind==='llm'&&e.lane===lane&&t>=e.start&&t<e.end&&(t<e.thinkEnd||!gTokens(e).length));
function gFill(host,items,t,busy){
  const want=[];for(const it of items){const html=gItem(it,t);if(html)want.push([it.key,html])}
  if(busy)want.push(['busy',`<div class="g-busy">${gBit()}</div>`]);
  let cur=host.firstChild;
  for(const [key,html] of want){
    let el=G.cache.get(host.id+key);
    if(!el){el=document.createElement('div');el.dataset.key=key;el._html='';G.cache.set(host.id+key,el)}
    if(el._html!==html){el.innerHTML=html;el._html=html}
    if(el!==cur)host.insertBefore(el,cur);else cur=cur.nextSibling;
  }
  while(cur){const n=cur.nextSibling;cur.remove();cur=n}
}
function gUpdate(tail){
  const t=G.t,st=$('#g-stage'),follow=tail||st.scrollHeight-st.scrollTop-st.clientHeight<40;
  $('#g-clock').textContent=clock(t);
  const sc=$('#g-scrub'),px=G.X?G.X(t):0;
  sc.setAttribute('aria-valuetext',clock(t));sc.setAttribute('aria-valuenow',Math.round(t/S));
  $('#g-head').style.left=px+'px';$('#g-future').style.left=px+'px';
  const run=t>=G_SPAWN.end&&t<G_DONE.end;
  st.classList.toggle('split',run);$('#g-side').hidden=!run;
  gFill($('#g-main'),G_ITEMS.filter(i=>i.col==='main'),t,gBusy('root',t));
  if(run){
    const side=$('#g-side');if(!side.firstChild||!side.firstChild.classList.contains('g-sideh')){side.innerHTML='<div class="g-sideh"></div><div id="g-subrows"></div>'}
    side.firstChild.textContent=fmtDur(t-G_SPAWN.start);
    gFill($('#g-subrows'),G_ITEMS.filter(i=>i.col==='sub'),t,gBusy('sub1',t));
  }
  if(follow)st.scrollTop=st.scrollHeight;
}
function gBar(){
  const play=G.playing?'<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0h3v10H1zM6 0h3v10H6z" fill="currentColor"/></svg>':'<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z" fill="currentColor"/></svg>';
  $('#g-bar').innerHTML=`<button type="button" data-play aria-label="${G.playing?'Pause':'Play'}" title="${G.playing?'Pause':'Play'}" aria-pressed="${G.playing}">${play}</button><span class="sep"></span>${[1,10,60].map(s=>`<button type="button" data-speed="${s}" aria-pressed="${G.speed===s}">${s}×</button>`).join('')}<span class="g-time" id="g-clock"></span>`;
}
function gScrub(){
  const sc=$('#g-scrub'),W=sc.clientWidth,gp=isPhone()?12:20,X=makeScale((W-GAPS.length*gp)/ACTIVE,gp,true);G.X=X;
  const Y={you:2,root:9,rootT:16,sub:22,subT:29,luna:34,host:38},h=[];
  for(const g of GAPS){const a=X(g.start);h.push(`<div class="a-gap" data-id="${g.id}" style="left:${a}px;width:${X(g.end)-a}px"></div>`)}
  for(const e of EV){
    const a=X(e.start),w=Math.max(1,X(e.end)-a);
    if(e.kind==='user')h.push(`<div class="ev" data-id="${e.id}" style="left:${X(e.delivered)-1}px;top:${Y.you}px;width:3px;height:5px;background:var(--k)"></div>`);
    else if(e.kind==='llm')h.push(`<div class="ev llm${e.stop==='error'?' err':''}" data-id="${e.id}" style="left:${a}px;top:${e.lane==='root'?Y.root:Y.sub}px;width:${w}px;height:6px">${segs(e,X,a)}</div>`);
    else if(['tool','code','spawn'].includes(e.kind))h.push(`<div class="ev ${callCls(e)}" data-id="${e.id}" style="left:${a}px;top:${e.lane==='root'?Y.rootT:Y.subT}px;width:${w}px;height:4px"></div>`);
    else if(e.kind==='compact')h.push(`<div class="ev compact" data-id="${e.id}" style="left:${a}px;top:${Y.root}px;width:${w}px;height:6px"></div>`);
    else if(e.kind==='luna')h.push(`<div class="ev luna" data-id="${e.id}" style="left:${a}px;top:${Y.luna}px;width:${Math.max(2,w)}px;height:3px"></div>`);
    else if(e.kind==='life'&&e.end>e.start)h.push(`<div class="ev life ${e.state}" data-id="${e.id}" style="left:${a}px;top:${Y.host}px;width:${Math.max(2,w)}px;height:4px;padding:0"></div>`);
    else if(e.kind==='abort'||e.kind==='alert')h.push(`<div class="ev" data-id="${e.id}" style="left:${a-1}px;top:${Y.root-2}px;width:2px;height:${Y.subT-Y.root}px;background:var(--bad)"></div>`);
  }
  sc.setAttribute('aria-valuemin','0');sc.setAttribute('aria-valuemax',String(Math.round(END/S)));
  sc.innerHTML=h.join('')+'<div class="g-future" id="g-future"></div><div class="g-head" id="g-head"></div>';
}
function renderG(){
  gBar();gScrub();G.cache.clear();$('#g-main').textContent='';$('#g-side').textContent='';
  const st=$('#g-stage');st.style.height=Math.max(240,innerHeight-st.getBoundingClientRect().top-8)+'px';
  gUpdate(true);
}
function gTick(now){
  if(!G.playing||cur!=='g'){G.playing=false;G.raf=0;gBar();gUpdate();return}
  const dt=Math.min(100,now-G.last);G.last=now;G.wall+=dt;
  G.t=Math.min(END,GC.inv(GC(G.t)+dt*G.speed));
  if(G.t>=END){G.playing=false;gBar()}
  gUpdate();
  G.raf=G.playing?requestAnimationFrame(gTick):0;
}
function gPlay(on){
  G.playing=on;if(on&&G.t>=END)G.t=0;gBar();
  if(on&&!G.raf){G.last=performance.now();G.raf=requestAnimationFrame(gTick)}
  gUpdate();
}
function gSeek(clientX,tail=true){const r=$('#g-scrub').getBoundingClientRect();G.t=Math.min(END,Math.max(0,G.X.inv(clientX-r.left)));gUpdate(tail)}
$('#g-bar').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.hasAttribute('data-play'))gPlay(!G.playing);else if(b.dataset.speed){G.speed=+b.dataset.speed;gBar();gUpdate()}});
{const sc=$('#g-scrub');
  sc.addEventListener('pointerdown',ev=>{G.drag=true;sc.setPointerCapture(ev.pointerId);gSeek(ev.clientX)});
  sc.addEventListener('pointermove',ev=>{if(G.drag)gSeek(ev.clientX)});
  sc.addEventListener('pointerup',()=>{G.drag=false});
  sc.addEventListener('keydown',ev=>{
    const d={ArrowLeft:-1,ArrowRight:1}[ev.key];
    if(d){ev.preventDefault();G.t=Math.min(END,Math.max(0,GC.inv(GC(G.t)+d*(ev.shiftKey?60:5)*S)));gUpdate(true)}
    else if(ev.key==='Home'||ev.key==='End'){ev.preventDefault();G.t=ev.key==='Home'?0:END;gUpdate(true)}
    else if(ev.key===' '){ev.preventDefault();gPlay(!G.playing)}
  });
}
$('#g-stage').addEventListener('toggle',ev=>{const d=ev.target;if(!d.matches?.('details.rail'))return;d.open?G.open.add(d.dataset.id):G.open.delete(d.dataset.id)},true);

/* ======================================================================
   page: totals, tabs, theme
   ====================================================================== */
{const cost=EV.reduce((a,e)=>a+(e.cost||0),0);
$('#totals').textContent=`${fmtDur(END)} · ${fmtDur(ACTIVE).replace(/ \d+s$/,'')} active · ${LLMS.length} calls · ${fmtCost(cost)}`;
$('#orb-tile').innerHTML=tile('stopped');$('#orb-tile').title='stopped';}
const RENDER={a:()=>{aBar();renderA()},b:renderB,c:renderC,d:renderD,e:renderE,f:renderF,g:renderG};
let cur='a';
function setTab(t){
  cur=RENDER[t]?t:'a';
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===cur)));
  document.querySelectorAll('main,section[id^=v-]').forEach(s=>s.hidden=s.id!=='v-'+cur);
  hideTip();RENDER[cur]();
}
document.querySelector('.study nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(b){history.replaceState(null,'','#'+b.dataset.tab+(document.documentElement.dataset.theme==='dark'?'/dark':''));setTab(b.dataset.tab)}});
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').setAttribute('aria-pressed',String(dark))}
$('#theme').addEventListener('click',()=>{const d=document.documentElement.dataset.theme!=='dark';setTheme(d);history.replaceState(null,'','#'+cur+(d?'/dark':''))});
function fromHash(){const [t,th]=location.hash.slice(1).split('/');setTheme(th?th==='dark':matchMedia('(prefers-color-scheme: dark)').matches);setTab(t||'a')}
fromHash();addEventListener('hashchange',fromHash);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(cur==='a'&&A.focus!=null){const t0=aFit(A.focus);renderA(A.focus==='all'?0:makeScale(A.k,GAP_PX(),A.collapse)(t0))}else RENDER[cur]()},120)});
document.fonts?.ready.then(()=>RENDER[cur]());
</script>
