<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP compact ledger — product styling</title>
<link rel="stylesheet" href="../apps/web/src/styles.css">
<style>
.study{max-width:1080px;margin:32px auto;padding:0 20px}.study-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:8px}.study-note{color:var(--g3);margin:0 0 20px}.study-stage.project-secrets-backdrop{position:relative;inset:auto;z-index:auto;min-height:590px;padding:1px 0 40px;border:1px solid var(--g2)}.study-stage .project-secrets-dialog{margin-top:80px}.study-feedback{min-height:20px;margin-top:12px;color:var(--g3)}.mcp-body{padding-top:8px}.mcp-block{margin:0 0 4px}.mcp-form{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;margin:4px 0}.mcp-form label{display:block;min-width:0;color:var(--g3)}.mcp-form input,.mcp-form select{display:block;width:100%;min-width:0}.mcp-form select{height:20px;color:var(--k)}.mcp-form .full{grid-column:1/-1}.mcp-form .mcp-actions{display:flex;gap:8px;align-items:center;color:var(--k)}.mcp-actions .space{flex:1}.mcp-preset-options{display:flex;gap:12px;margin-top:4px}.mcp-form [hidden]{display:none!important}.mcp-add-heading{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0}.mcp-add-form{border-top:1px solid var(--g2);padding-top:4px}.mcp-add-trigger{margin-top:8px}.mcp-block .reasoning-body{padding-top:4px;padding-bottom:8px}.mcp-block summary:focus-visible .activity-rail-marker,.mcp-block summary:focus-visible .activity-rail-headline{color:inherit}.mcp-actions button{white-space:nowrap}.project-secrets-dialog .demo-secrets-note{margin:8px 0 0;color:var(--g3)}@media(max-width:560px){.study{padding:0 12px;margin:20px auto}.study-head{display:block}.study-head button{margin-top:8px}.study-stage .project-secrets-dialog{margin-top:40px}.mcp-form{grid-template-columns:minmax(0,1fr)}.mcp-actions{flex-wrap:wrap}.mcp-form .full{grid-column:1}.study-stage.project-secrets-backdrop{min-height:600px}}
</style></head><body><main class="study"><div class="study-head"><h1>MCP · compact ledger / product pass</h1><button onclick="reset()">reset mockup</button></div><p class="study-note">Shared product stylesheet and chat disclosures. General and Secrets are clickable for comparison. No live connections.</p><div class="study-stage project-secrets-backdrop"><section class="project-secrets-dialog" aria-label="Project configuration preview"><header class="project-secrets-header"><div><h2>Config for Cloudflare OAuth test</h2><p id="tab-subtitle" hidden></p></div><button class="project-secrets-close" aria-label="Close project config" onclick="feedback('Preview only; no live settings were changed.')">×</button></header><div class="project-config-tabs" role="tablist" aria-label="Project config"><button id="tab-general" role="tab" aria-controls="general" aria-selected="false" tabindex="-1" onclick="tab('general')">General</button><button id="tab-mcp" role="tab" aria-controls="mcp" aria-selected="true" onclick="tab('mcp')">MCPs</button><button id="tab-secrets" role="tab" aria-controls="secrets" aria-selected="false" tabindex="-1" onclick="tab('secrets')">Secrets</button></div><section id="general" role="tabpanel" aria-labelledby="tab-general" hidden><div class="project-secrets-body"><form class="project-secret-form project-general-form" onsubmit="event.preventDefault();feedback('Mockup only; project changes are not persisted.')"><label>Name<input value="Cloudflare OAuth test" required></label><label>Repository URL<input value="https://github.com/octocat/Hello-World" required type="url"></label><button>save</button></form></div></section><section id="mcp" role="tabpanel" aria-labelledby="tab-mcp"><div class="project-secrets-body mcp-body"><div id="connections"></div><div id="add-area"></div></div></section><section id="secrets" role="tabpanel" aria-labelledby="tab-secrets" hidden><div class="project-secrets-body"><div class="project-secret-row"><span class="project-secret-name">POSTHOG_KEY</span><span class="project-secret-updated">2d ago</span><span class="project-secret-actions"><button onclick="feedback('Mockup only. Secret values are never displayed.')">replace</button><button class="danger" onclick="feedback('Mockup only; no secret removed.')">remove</button></span></div><div class="project-secret-row"><span class="project-secret-name">MCP_TOKEN</span><span class="project-secret-updated">1h ago</span><span class="project-secret-actions"><button onclick="feedback('Mockup only. Secret values are never displayed.')">replace</button><button class="danger" onclick="feedback('Mockup only; no secret removed.')">remove</button></span></div><p class="demo-secrets-note">Mock values only; do not enter real credentials in this preview.</p></div></section></section></div><div class="study-feedback" id="feedback" role="status"></div></main>
<script>
const initial=[{name:'cloudflare',url:'https://mcp.cloudflare.com/mcp',auth:'oauth',connected:true,description:'Cloudflare MCP'},{name:'datadog',url:'https://mcp.us5.datadoghq.com/v1/mcp',auth:'oauth',connected:true,description:'Datadog MCP'},{name:'posthog',url:'https://mcp.posthog.com/mcp',auth:'bearer',secret:'POSTHOG_KEY',description:'PostHog MCP'}];
let servers=structuredClone(initial);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function feedback(s){$('#feedback').textContent=s}
function tab(name){for(const n of ['general','mcp','secrets']){const b=$(`#tab-${n}`);b.setAttribute('aria-selected',String(n===name));b.tabIndex=n===name?0:-1;$(`#${n}`).hidden=n!==name}$('#tab-subtitle').hidden=name==='mcp';$('#tab-subtitle').textContent=name==='general'?'Repository applies to new checkouts':'Changes apply on next start'}
function state(s){return s.auth==='bearer'?'bearer token':s.connected?'connected':'authorization required'}
function form(s={},index=-1){const id=index<0?'new':`server-${index}`;return `<form class="mcp-form" data-index="${index}" onsubmit="event.preventDefault();save(this)"><label>Name<input name="name" value="${esc(s.name)}" placeholder="my-server" required pattern="[a-z0-9][a-z0-9_-]*" autocomplete="off"></label><label>Endpoint<input name="url" value="${esc(s.url)}" placeholder="https://…/mcp" required type="url" pattern="https://.+"></label><label>Authentication<select name="auth" onchange="authChanged(this.form)"><option value="oauth" ${s.auth!=='bearer'?'selected':''}>OAuth</option><option value="bearer" ${s.auth==='bearer'?'selected':''}>Bearer token</option></select></label><label data-secret ${s.auth==='bearer'?'':'hidden'}>Token secret<select name="secret" ${s.auth==='bearer'?'required':'disabled'}><option value="">Select a secret</option>${['POSTHOG_KEY','MCP_TOKEN'].map(k=>`<option ${s.secret===k?'selected':''}>${k}</option>`).join('')}</select></label>${index>=0?`<label class="full">Description<input name="description" value="${esc(s.description)}"></label>`:''}<div class="full mcp-actions">${index<0?`<button class="text-action" type="button" aria-expanded="false" aria-controls="presets-${id}" onclick="const p=document.getElementById('presets-${id}');p.hidden=!p.hidden;this.setAttribute('aria-expanded',String(!p.hidden))">preset</button>`:`<button type="button" data-auth-action onclick="connect(${index})" ${s.auth==='bearer'?'hidden':''}>${s.connected?'reconnect':'connect'}</button>`}<span class="space"></span><button type="button" onclick="${index<0?'closeAdd()':`document.getElementById('connection-${index}').open=false`}">cancel</button><button type="submit" data-save>${index<0?(s.auth==='bearer'?'add server':'add & connect'):'save'}</button></div>${index<0?`<div class="full mcp-preset-options" id="presets-${id}" hidden>${['Cloudflare','Datadog US5','PostHog'].map((p,i)=>`<button class="text-action" type="button" onclick="preset(this.form,${i})">${p}</button>`).join('')}</div>`:`<div class="full mcp-actions"><button type="button" data-disconnect ${s.auth!=='oauth'||!s.connected?'hidden':''} onclick="disconnect(${index})">disconnect</button><span class="space"></span><button class="danger" type="button" onclick="removeConnection(${index})">remove server</button></div>`}<p class="full error" role="alert" hidden></p></form>`}
function renderConnections(){
 $('#connections').innerHTML=servers.map((s,i)=>`<details class="activity-rail-row mcp-block" name="mcp-connections" id="connection-${i}"><summary><span class="activity-rail-marker" aria-hidden="true"></span><span class="activity-rail-summary"><span data-name>${esc(s.name)}</span><span class="activity-rail-headline"> · <span data-state>${state(s)}</span></span></span></summary><div class="reasoning-body">${form(s,i)}</div></details>`).join('');
}
function openAdd(focus=true){$('#add-area').innerHTML=`<div class="mcp-add-heading"><span>add server</span></div><div class="mcp-add-form">${form()}</div>`;if(focus)$('#add-area input').focus()}
function closeAdd(){$('#add-area').innerHTML='<div class="mcp-add-trigger"><button class="text-action" onclick="openAdd()">add server</button></div>'}
function authChanged(f){const bearer=f.elements.auth.value==='bearer';f.querySelector('[data-secret]').hidden=!bearer;f.elements.secret.disabled=!bearer;f.elements.secret.required=bearer;if(f.dataset.index==='-1')f.querySelector('[data-save]').textContent=bearer?'add server':'add & connect';else{f.querySelector('[data-auth-action]').hidden=bearer;f.querySelector('[data-disconnect]').hidden=bearer||!servers[Number(f.dataset.index)].connected}}
function preset(f,i){const s=initial[i];if(!f.elements.name.value)f.elements.name.value=s.name;f.elements.url.value=s.url;f.elements.auth.value=s.auth;f.elements.secret.value=s.secret||'';authChanged(f);f.querySelector('.mcp-preset-options').hidden=true;f.querySelector('[aria-controls]').setAttribute('aria-expanded','false')}
function save(f){const i=Number(f.dataset.index),d=Object.fromEntries(new FormData(f));if(servers.some((s,n)=>n!==i&&s.name===d.name)){const error=f.querySelector('[role=alert]');error.hidden=false;error.textContent='That name already exists.';return}const s={...d,connected:true};if(i<0){servers.push(s);renderConnections();closeAdd()}else{servers[i]=s;renderConnections();$(`#connection-${i}`).open=true}feedback(i<0&&s.auth==='oauth'?'Simulated: saved connection → browser consent.':'Simulated: saved connection.')}
function connect(i){servers[i].connected=true;updateStatus(i);feedback('Simulated consent. No real authorization requested.')}
function disconnect(i){servers[i].connected=false;updateStatus(i);feedback('Simulated disconnect. No live grant was changed.')}
function updateStatus(i){const block=$(`#connection-${i}`);block.querySelector('[data-state]').textContent=state(servers[i]);block.querySelector('[data-auth-action]').textContent=servers[i].connected?'reconnect':'connect';authChanged(block.querySelector('form'))}
function removeConnection(i){if(!confirm(`Remove ${servers[i].name}?`))return;servers.splice(i,1);renderConnections()}
function reset(){servers=structuredClone(initial);renderConnections();openAdd(false);tab('mcp');feedback('')}
$('.project-config-tabs').addEventListener('keydown',e=>{const tabs=['general','mcp','secrets'];const index=tabs.findIndex(n=>`tab-${n}`===e.target.id);if(index<0)return;let next;if(e.key==='ArrowRight')next=(index+1)%3;else if(e.key==='ArrowLeft')next=(index+2)%3;else if(e.key==='Home')next=0;else if(e.key==='End')next=2;else return;e.preventDefault();tab(tabs[next]);$(`#tab-${tabs[next]}`).focus()});
reset();
</script></body></html>
