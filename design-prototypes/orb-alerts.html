<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pi-orb · transcript alerts study</title>
<style>
:root{color-scheme:light;--ink:#000;--paper:#fff;--gray:#f2f2f2;--muted:#555;--red:#b42318;--wash:#fff0ee;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}*{box-sizing:border-box}html,body{margin:0;min-width:0;background:var(--paper);color:var(--ink);font:13px/20px var(--mono)}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);padding:3px 9px}button:hover,button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}a{color:inherit;text-decoration:none}.study{border-bottom:2px solid var(--ink);padding:12px max(12px,calc((100vw - 1256px)/2)) 14px;background:var(--gray)}.study h1{font-size:16px;line-height:24px;margin:0}.study p{margin:0 0 10px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.controls label{display:grid;gap:2px}.controls select,.controls textarea{border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);padding:4px 6px}.controls textarea{width:min(400px,calc(100vw - 24px));height:52px;resize:vertical}.controls select{min-height:36px}.controls button{min-height:36px}.selectors{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}.selectors button{min-height:32px}.gallery{width:min(1256px,calc(100% - 24px));margin:16px auto 48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.candidate{min-width:0;border:1px solid var(--ink)}.candidate-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-height:32px;padding:5px 10px;border-bottom:1px solid var(--ink);background:var(--gray)}.candidate-head h2{font-size:13px;line-height:20px;margin:0}.candidate-head small{color:var(--muted);font-size:11px}.mock{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:240px}.sidebar{border-right:1px solid var(--ink);min-width:0}.brand,.project,.orb-header{height:24px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--ink);white-space:nowrap}.brand{gap:7px;font-weight:bold}.brand-mark{display:inline-grid;place-items:center;background:var(--ink);color:var(--paper);width:16px;height:16px}.project{font-weight:bold;letter-spacing:.06em}.orb-link{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-bottom:1px solid #ddd;min-width:0}.orb-link:hover{background:var(--gray)}.orb-link:focus-visible{outline-offset:-2px}.orb-link .orb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orb-link .age{margin-left:auto;color:var(--muted)}.badge,.state-icon{flex:none;display:block;width:16px;height:16px}.badge svg,.state-icon svg,.alert-icon svg{display:block;width:16px;height:16px}.orb-main{min-width:0}.orb-header{gap:9px;padding:0 12px}.header-link{display:flex;align-items:center;gap:7px;min-width:0;font-weight:bold}.header-link strong{overflow:hidden;text-overflow:ellipsis;text-decoration:underline;text-decoration-color:#999;text-underline-offset:2px}.header-link:hover strong{text-decoration-color:currentColor}.orb-header .life{margin-left:auto;color:var(--muted)}.conversation{min-width:0}.turn{min-width:0;padding:9px 12px;overflow-wrap:anywhere;white-space:pre-wrap}.user{background:var(--ink);color:var(--paper)}.activity{position:relative;margin:8px 12px 2px;padding-left:19px;color:var(--muted);border-left:1px solid #aaa;font-size:12px}.activity:before{content:'›';position:absolute;top:0;left:-5px;background:var(--paper);line-height:20px}.alert-turn{position:relative}.alert-message{overflow-wrap:anywhere}.after{padding-top:4px;color:var(--muted)}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* The icon is a real 16px specimen in the sidebar; each treatment uses its own silhouette. */
.signal .alert-turn{border-left:2px solid var(--red);padding-left:10px}.signal .alert-message{color:var(--ink)}
.slip .alert-turn{background:var(--wash);border-top:1px solid var(--red);border-bottom:1px solid var(--red)}
.bulletin .alert-turn{border-top:2px solid var(--red);border-bottom:2px solid var(--red);margin:6px 12px;padding:10px 0 8px}.bulletin .alert-turn:before{content:'ALERT';position:absolute;top:-11px;left:0;background:var(--paper);padding:0 5px;color:var(--red);font-size:10px;font-weight:bold;line-height:16px;letter-spacing:.08em}.bulletin .alert-turn .alert-message{display:block}
.interrupt .alert-turn{background:var(--red);color:var(--paper);margin:6px 0}.interrupt .alert-turn .alert-message{font-weight:bold}
.flag .alert-turn{margin:5px 12px 8px;padding:10px 0 9px 13px;border-left:2px solid var(--red);border-bottom:1px solid var(--red)}.flag .alert-turn:before{content:'';position:absolute;left:-2px;top:0;border-top:9px solid var(--red);border-right:18px solid transparent}.flag .alert-message{color:var(--ink)}
.gallery.focus{display:block;max-width:850px}.gallery.focus .candidate{display:none}.gallery.focus .candidate.active{display:block}.gallery.phone{display:block;width:min(390px,calc(100% - 24px))}.gallery.phone .candidate{margin-bottom:14px}.gallery.phone .mock{display:block}.gallery.phone .sidebar{display:none}.gallery.phone .orb-header{padding-inline:8px}
@media(max-width:760px){.gallery{display:block;margin-top:10px}.candidate{margin-bottom:12px}.candidate:last-child{margin-bottom:0}.mock{display:block}.sidebar{display:none}.orb-header{padding-inline:8px}.controls button,.selectors button{min-height:44px}.controls textarea{font-size:16px;line-height:20px}}
</style></head><body>
<header class="study"><h1>Transcript alerts · five proposals</h1><p>Study controls — simulated alert, orb entry, and lifecycle. No product changes.</p><div class="controls"><label>Underlying lifecycle<select id="lifecycle"><option value="neutral">neutral</option><option value="running" selected>running</option><option value="busy">busy</option><option value="sleeping">sleeping</option><option value="stopped">stopped</option><option value="failed">failed</option><option value="transitional">transitional</option><option value="archiving">archiving</option><option value="archived">archived</option><option value="deleting">deleting</option></select></label><label>Alert text<textarea id="message" aria-label="Alert text">The migration is ready. Approve the production run.</textarea></label><button type="button" id="raise">Reset / new alert</button><button type="button" id="phone" aria-pressed="false">Phone width</button></div><nav class="selectors" aria-label="Study views"><button type="button" id="compare" aria-pressed="true">Compare all</button><button type="button" data-focus="1">1 Signal tile</button><button type="button" data-focus="2">2 Warning slip</button><button type="button" data-focus="3">3 Bulletin</button><button type="button" data-focus="4">4 Interrupt</button><button type="button" data-focus="5">5 Margin flag</button></nav></header>
<main id="gallery" class="gallery" aria-label="Alert design comparisons"></main>
<script>
const designs=[['signal','Signal tile','Square signal · white transcript'],['slip','Warning slip','Outline warning · tinted paper'],['bulletin','Bulletin','Circular mark · ruled notice'],['interrupt','Interrupt','Diamond signal · reverse band'],['flag','Margin flag','Flag signal · hanging bracket']];
const icons={signal:'<rect x="1" y="1" width="14" height="14" fill="#b42318"/><path d="M8 3.2v6.4" stroke="white" stroke-width="1.7"/><rect x="7" y="11.4" width="2" height="2" fill="white"/>',slip:'<path d="M8 1.5 15 14H1z" fill="white" stroke="#b42318" stroke-width="1.5" stroke-linejoin="miter"/><path d="M8 5v4.7" stroke="#b42318" stroke-width="1.7"/><rect x="7" y="11" width="2" height="2" fill="#b42318"/>',bulletin:'<circle cx="8" cy="8" r="6.5" fill="white" stroke="#b42318" stroke-width="1.5"/><path d="M8 4v5" stroke="#b42318" stroke-width="1.7"/><rect x="7" y="11" width="2" height="2" fill="#b42318"/>',interrupt:'<path d="M8 0 16 8 8 16 0 8z" fill="#b42318"/><path d="M8 3.8v5.1" stroke="white" stroke-width="1.7"/><rect x="7" y="10.7" width="2" height="2" fill="white"/>',flag:'<path d="M2 1v14" stroke="#b42318" stroke-width="1.5"/><path d="M3 2h12l-3.5 4L15 10H3z" fill="#b42318"/><path d="M8.7 3.4v3.1" stroke="white" stroke-width="1.5"/><rect x="8" y="7.4" width="1.5" height="1.5" fill="white"/>'};
const stateShapes={
 neutral:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#555555" stroke="none"/><g color="white"><path d="M4 5h8M6 5v3.5Q6 10 5 11M10 5v5q0 1 1 1"/></g>',
 running:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#1a7e37" stroke="none"/><g color="white"><circle cx="8" cy="8" r="3"/></g>',
 busy:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#1a7e37" stroke="none"/><g color="white"><circle cx="5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="11" cy="8" r="1" fill="currentColor" stroke="none"/></g>',
 stopped:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#777777" stroke="none"/><g color="white"><path d="M5 8h6"/></g>',
 failed:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#b42318" stroke="none"/><g color="white"><path d="m5 5 6 6m0-6-6 6"/></g>',
 transitional:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#966100" stroke="none"/><g color="white"><path d="M5 4h6v1L5 11v1h6v-1L5 5z"/></g>',
 archiving:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#966100" stroke="none"/><g color="white"><path d="M8 4v7M5 8l3 3 3-3"/></g>',
 archived:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#666666" stroke="none"/><g color="white"><path d="M5 5h6v6H5zM5 7h6"/></g>',
 deleting:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#b42318" stroke="none"/><g color="white"><path d="M4 5h8M7 3h2M5 5v7h6V5M8 7v3"/></g>',
 sleeping:'<rect x="1" y="1" width="14" height="14" rx="2" fill="#777"/><path d="M10.15 3.35a4.9 4.9 0 1 0 1.65 7.2 3.35 3.35 0 0 1-1.65-7.2Z" fill="white"/>'
};
function stateSvg(state){return state==='sleeping'?`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><title>Orb sleeping</title>${stateShapes[state]}</svg>\n`:`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><title>Orb ${state}</title>${stateShapes[state]}</svg>\n`}
const svg=body=>`<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">${body}</svg>`;
const gallery=document.querySelector('#gallery');
gallery.innerHTML=designs.map(([kind,name,note],i)=>`<section class="candidate ${kind}" data-design="${i+1}"><div class="candidate-head"><h2>${i+1} / ${name}</h2><small>${note}</small></div><div class="mock"><aside class="sidebar"><div class="brand"><span class="brand-mark">π</span>pi-orb</div><div class="project">PRODUCTION</div><a href="#orb" class="orb-link" aria-label="Open migration-worker orb"><span class="orb-status"></span><span class="orb-title">migration-worker</span><span class="age">now</span></a></aside><div class="orb-main"><div class="orb-header"><a href="#orb" class="header-link" aria-label="Open migration-worker orb"><span class="header-status"></span><strong>migration-worker</strong></a><span class="life"></span></div><div class="conversation"><div class="turn user"><span class="visually-hidden">You:</span>Check the migration and pause before deploying.</div><div class="activity">run · verify migration plan</div><div class="turn"><span class="visually-hidden">Orb:</span>Schema check passed. Production remains unchanged.</div><div class="turn alert-turn"><span class="visually-hidden">Orb alert:</span><span class="alert-message"></span></div><div class="turn after">Awaiting your approval.</div></div></div></div></section>`).join('');
let unread=true;
function render(){const state=document.querySelector('#lifecycle').value;const message=document.querySelector('#message').value;gallery.querySelectorAll('.candidate').forEach((card,i)=>{card.querySelectorAll('.orb-status,.header-status').forEach(status=>{status.className=`${status.closest('.sidebar')?'orb-status':'header-status'} ${unread?'badge alert-icon':'state-icon'}`;status.dataset.state=unread?'alert':state;status.setAttribute('role','img');status.setAttribute('aria-label',unread?'Unread orb alert':`Orb ${state}`);status.innerHTML=unread?svg(icons[designs[i][0]]):`<img width="16" height="16" alt="" src="data:image/svg+xml,${encodeURIComponent(stateSvg(state))}">`});card.querySelector('.life').textContent=state;card.querySelector('.alert-message').textContent=message})}
document.querySelector('#message').addEventListener('input',render);document.querySelector('#lifecycle').addEventListener('change',render);document.querySelector('#raise').addEventListener('click',()=>{unread=true;render()});gallery.addEventListener('click',event=>{if(event.target.closest('.orb-link,.header-link')){event.preventDefault();unread=false;render()}});
function compare(){gallery.classList.remove('focus');gallery.querySelectorAll('.candidate').forEach(card=>card.classList.remove('active'));document.querySelector('#compare').setAttribute('aria-pressed','true');document.querySelectorAll('[data-focus]').forEach(button=>button.setAttribute('aria-pressed','false'))}
document.querySelector('#compare').addEventListener('click',compare);document.querySelectorAll('[data-focus]').forEach(button=>button.addEventListener('click',()=>{gallery.classList.add('focus');gallery.querySelectorAll('.candidate').forEach(card=>card.classList.toggle('active',card.dataset.design===button.dataset.focus));document.querySelector('#compare').setAttribute('aria-pressed','false');document.querySelectorAll('[data-focus]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)))}));document.querySelector('#phone').addEventListener('click',event=>{const on=gallery.classList.toggle('phone');event.currentTarget.setAttribute('aria-pressed',String(on));event.currentTarget.textContent=on?'Fluid width':'Phone width'});render();
</script></body></html>
