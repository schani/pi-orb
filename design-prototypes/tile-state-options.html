<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instrument tiles · state options</title><link id="favicon" rel="icon" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#181818;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}header,main,footer{max-width:1180px;margin:auto;padding:32px}header{padding-top:48px}.eyebrow,small{color:#777;font-size:11px}h1{font-size:36px;letter-spacing:-.05em;margin:12px 0}p{color:#666}h2{font-size:20px;letter-spacing:-.03em;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:42px}.card{border:1px solid #222;background:white;min-width:0}.tabs{background:#e9e9e9;padding:10px 10px 0}.tab{display:flex;align-items:center;gap:10px;background:white;padding:9px 12px;font-size:11px;border-radius:5px 5px 0 0}.tab span:last-child{margin-left:auto;color:#888}.body{padding:20px}.specimen{display:flex;align-items:center;gap:20px;height:58px}.specimen span{display:flex;align-items:center;gap:7px}h3{font-size:14px;margin:12px 0 6px}p{margin:0 0 16px}.body p{font-size:11px;min-height:34px}.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #eee;font-size:11px}.row.selected{background:#181818;color:white}.row time{margin-left:auto;color:#888}button{font:inherit;cursor:pointer;background:white;border:1px solid #aaa;color:inherit;padding:6px 9px;font-size:11px}button:hover,button[aria-pressed=true]{background:#181818;color:white;border-color:#181818}button:focus-visible{outline:2px solid #1a7e37;outline-offset:3px}.controls{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;font-size:11px}label{display:flex;align-items:center;gap:5px}.dark .tabs{background:#222}.dark .tab{background:#444;color:white}svg{display:block;flex:none}.reference{display:flex;flex-wrap:wrap;gap:22px;padding:16px 0;border-top:1px solid #ccc}.reference span{display:flex;align-items:center;gap:8px;font-size:11px;color:#666}footer{font-size:11px;color:#777;padding-top:0}.badge{font-size:10px;color:#1a7e37}.statusline{min-height:20px;font-size:11px;margin-top:12px}@media(max-width:760px){header,main,footer{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}h1{font-size:29px}.body p{min-height:0}}
</style></head><body><header><div class="eyebrow">INSTRUMENT TILES / REFINEMENT</div><h1>Transition & deletion.</h1><p>Two alternatives each. Same tile, palette, and 1.5px stroke.</p><div class="controls"><label><input id="mono" type="checkbox">Monochrome</label><label><input id="dark" type="checkbox">Dark browser tabs</label><span>Try any mark in this browser tab.</span></div><div class="statusline" id="status" role="status"></div></header><main id="main"></main><footer>Proposal only. Current implementation unchanged.</footer><script>
const groups=[{state:'Transition',color:'#966100',row:'Provision workspace',options:[{name:'Current · zigzag',path:'M5 4h6L5 12h6',note:'Compact, but reads as a Z rather than a process.'},{name:'Hourglass',path:'M5 4h6v1L5 11v1h6v-1L5 5z',note:'A bounded wait. Different from idle, busy, and archived.',pick:true},{name:'Cycle arrows',path:'M4 6a4.5 4.5 0 0 1 7-1M11 3v2H9M12 10a4.5 4.5 0 0 1-7 1M5 13v-2h2',note:'A lifecycle change in progress. More active; slightly denser.'}]},{state:'Deleting',color:'#b42318',row:'Remove old workspace',options:[{name:'Current · narrow cross',path:'m6 5 4 6m0-6-4 6',note:'Too close to failed. Width alone is a weak distinction.'},{name:'Bin',path:'M4 5h8M7 3h2M5 5v7h6V5M8 7v3',note:'Direct, familiar, and clearly different from failure.',pick:true},{name:'Eraser',path:'m4 9 5-5 3 3-5 5H6zM6 7l3 3M8 12h4',note:'Removal rather than failure. A quieter cleanup metaphor.'}]}];
const fixed=[{name:'Idle',color:'#1a7e37',mark:'<circle cx="8" cy="8" r="3"/>'},{name:'Busy',color:'#1a7e37',mark:'<g fill="white" stroke="none"><circle cx="5" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="11" cy="8" r="1"/></g>'},{name:'Stopped',color:'#777777',path:'M5 8h6'},{name:'Failed',color:'#b42318',path:'m5 5 6 6m0-6-6 6'},{name:'Archived',color:'#666666',path:'M5 5h6v6H5zM5 7h6'},{name:'Archiving',color:'#966100',path:'M8 4v7M5 8l3 3 3-3'}];
let active=[0,1];
function svg(o,color,size=16){return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="2" fill="'+(document.getElementById('mono').checked?'#666666':color)+'" stroke="none"/>'+(o.mark||'<path d="'+o.path+'"/>')+'</svg>'}
function render(){document.getElementById('main').innerHTML=groups.map((g,gi)=>'<section><h2>'+g.state+'</h2><div class="grid">'+g.options.map((o,oi)=>'<article class="card"><div class="tabs"><div class="tab">'+svg(o,g.color)+'<span>pi-orb · '+g.state.toLowerCase()+'</span><span>×</span></div></div><div class="body"><div class="specimen"><span>'+svg(o,g.color,16)+'<small>16</small></span><span>'+svg(o,g.color,20)+'<small>20</small></span><span>'+svg(o,g.color,40)+'</span></div><h3>'+o.name+'</h3><p>'+o.note+'</p><button data-group="'+gi+'" data-option="'+oi+'" aria-label="Try '+g.state.toLowerCase()+' '+o.name+' favicon" aria-pressed="'+(active[0]===gi&&active[1]===oi)+'">Try favicon</button> '+(o.pick?'<span class="badge">My pick</span>':'')+'</div><div class="row">'+svg(o,g.color)+'<span>'+g.row+'</span><time>2s</time></div><div class="row selected">'+svg(o,g.color)+'<span>'+g.row+'</span><time>2s</time></div></article>').join('')+'</div></section>').join('')+'<div class="reference">'+fixed.map(o=>'<span>'+svg(o,o.color)+o.name+'</span>').join('')+'</div>';updateFavicon()}
function updateFavicon(){const g=groups[active[0]],o=g.options[active[1]];document.getElementById('favicon').href='data:image/svg+xml,'+encodeURIComponent(svg(o,g.color,32));document.title=g.state+' · '+o.name+' · pi-orb';document.getElementById('status').textContent='Tab preview: '+g.state.toLowerCase()+' / '+o.name.toLowerCase()}
document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('button[data-option]');if(!b)return;active=[Number(b.dataset.group),Number(b.dataset.option)];document.querySelectorAll('button[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.group)===active[0]&&Number(b.dataset.option)===active[1])));updateFavicon()});document.getElementById('mono').onchange=render;document.getElementById('dark').onchange=e=>document.body.classList.toggle('dark',e.target.checked);render();
</script></body></html>
