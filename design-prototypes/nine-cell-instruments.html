<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nine cells / ten instruments</title>
<style>
:root{color-scheme:light;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--pace:1}
*{box-sizing:border-box}body{margin:0;background:white;color:black;font:13px/20px var(--mono);-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit;border:1px solid black;background:white;border-radius:0;padding:2px 8px;cursor:pointer}button:hover,button[aria-pressed=true]{background:black;color:white}button:focus-visible,select:focus-visible{outline:2px solid black;outline-offset:3px}header{padding:24px 28px 20px;border-bottom:1px solid black}.eyebrow{color:#555;margin-bottom:12px}h1{margin:0 0 20px;font-size:26px;line-height:32px;font-weight:500;letter-spacing:-1px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.controls label{display:flex;align-items:center;gap:8px}.controls label:first-of-type{margin-left:auto}.controls label+label{margin-left:12px}main{max-width:1440px;margin:auto;padding:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 24px}.candidate{min-width:0}.caption{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}.number{color:#555}h2{font:700 13px/20px var(--mono);margin:0}.focus{margin-left:auto;color:#555;border:0;border-bottom:1px solid #999;padding:0}.specimen{border:1px solid black;display:grid;grid-template-columns:112px minmax(0,1fr);min-height:148px}.enlarged{display:grid;place-items:center;border-right:1px solid #999;background:#f2f2f2;position:relative}.enlarged small{position:absolute;bottom:6px;right:8px;font:11px/16px var(--mono);color:#555}.enlarged svg{width:48px;height:48px}.thread{min-width:0}.rec{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:4px 12px}.prefix{text-align:right;color:#555}.user{background:#f2f2f2;border-bottom:1px solid #999;padding-block:9px}.user .prefix{color:black;font-weight:700}.body{min-width:0;overflow-wrap:anywhere}.agent{padding-block:12px}.body p{margin:0 0 12px}.marker-line{min-height:20px;display:flex;align-items:center}.instrument{display:block;width:16px;height:16px;flex:none;overflow:visible}.instrument rect{fill:black;transform-box:fill-box;transform-origin:center;animation-duration:calc(var(--duration)*var(--pace));animation-iteration-count:infinite;animation-timing-function:steps(1,end)}.instrument .smooth{animation-timing-function:ease-in-out}.instrument .paper{fill:white}.note{margin:8px 0 0;color:#555;max-width:66ch}.outcome{display:none;color:#555}.finished .live,.disconnected .live{visibility:hidden}.finished .marker-line .live,.disconnected .marker-line .live{display:none}.finished .done,.disconnected .lost{display:inline}.paused *{animation-play-state:paused!important}.candidate[hidden]{display:none}body.focused main{grid-template-columns:minmax(0,900px);justify-content:center}body.focused .specimen{min-height:260px;grid-template-columns:160px minmax(0,1fr)}body.focused .enlarged svg{width:80px;height:80px}body.focused .enlarged small{display:none}footer{padding:16px 28px;border-top:1px solid black;color:#555}
@media(max-width:760px){header{padding:20px 16px}h1{font-size:22px}main{padding:20px 12px;grid-template-columns:minmax(0,1fr);gap:24px}button,select{min-height:36px}.controls label:first-of-type{margin-left:0}.controls label+label{margin-left:0}.specimen{grid-template-columns:72px minmax(0,1fr)}.enlarged svg{width:32px;height:32px}.enlarged small{display:none}.rec{grid-template-columns:28px minmax(0,1fr);gap:8px;padding-inline:8px}body.focused .specimen{grid-template-columns:72px minmax(0,1fr)}body.focused .enlarged svg{width:48px;height:48px}footer{padding:16px}}
@media(prefers-reduced-motion:reduce){.instrument rect{animation:none!important}}
</style>
<style id="motions"></style>
</head>
<body>
<header>
<div class="eyebrow">PI–ORB / THINKING MARKERS / ROUND 02</div>
<h1>Nine cells. Ten ways to think.</h1>
<div class="controls">
<button id="compare" aria-pressed="true">Compare all</button>
<button id="pause" aria-pressed="false">Pause motion</button>
<label>Tempo <select id="tempo"><option value="1.5">Slow</option><option value="1" selected>Original</option><option value="0.7">Quick</option></select></label>
<label>State <select id="state"><option value="working">Working</option><option value="finished">Finished</option><option value="disconnected">Disconnected</option></select></label>
</div>
</header>
<main id="designs"></main>
<footer>Black ink only · Actual-size markers in the transcript · Prototype, not production</footer>
<script>
// Each instrument is a fixed, reproducible loop. No timers or random activity.
const perimeter=[0,1,2,5,8,7,6,3];
const range=n=>Array.from({length:n},(_,i)=>i);
const mask=(indices)=>range(9).map(i=>indices.includes(i)?1:0.1);
const bitmap=rows=>rows.replaceAll('/','').split('').map(v=>v==='1'?1:0.08);
const designs=[
 {name:'Raster',duration:2.1,note:'The original, in black. A three-cell band reads the grid like a tiny line printer.',frames:range(9).map(f=>mask(range(3).map(j=>(f+j)%9)))},
 {name:'Perimeter',duration:2.4,note:'A three-part comet circles an empty center. Crisp, measured, and always in motion.',frames:range(8).map(f=>range(9).map(i=>i===perimeter[f]?1:i===perimeter[(f+7)%8]?.5:i===perimeter[(f+6)%8]?.22:.06))},
 {name:'Ripple',duration:2.8,note:'An impulse travels outward: seed, cross, corners. The grid acts like a small resonating surface.',frames:['000/010/000','010/101/010','101/000/101','010/101/010'].map(bitmap)},
 {name:'Loom',duration:2.4,note:'Rows and columns take turns becoming fine threads, then squares. More woven than blinking.',kind:'loom',smooth:true},
 {name:'Flipboard',duration:2.7,note:'Nine little shutters turn edge-on in a diagonal cascade. A mechanical departure-board rhythm.',kind:'flip',smooth:true},
 {name:'Vacancy',duration:3.2,note:'Eight black tiles pass one empty space around the perimeter. Motion through absence, not fading.',kind:'puzzle',smooth:true},
 {name:'Equalizer',duration:2.8,note:'Three pixel columns rise and fall at different cadences. An instrument, not a percentage.',frames:[[1,2,3],[2,3,2],[3,2,1],[2,1,2],[1,2,2],[2,3,1],[3,2,2],[2,1,3]].map(heights=>range(9).map(i=>Math.floor(i/3)>=3-heights[i%3]?1:.08))},
 {name:'Aperture',duration:2.4,note:'Reverse the ink: a white opening cuts through a solid black tile. The strongest silhouette.',kind:'negative',frames:range(8).map(f=>range(9).map(i=>i===perimeter[f]?1:0))},
 {name:'Pinwheel',duration:2.4,note:'Four angular blades trade places around a fixed hub. A pixel-built spinner without a circular outline.',frames:['110/011/100','101/011/010','001/110/011','010/110/101'].map(bitmap)},
 {name:'Gather',duration:3.2,note:'The grid pulls itself into a dense stamp, holds, and opens again. A slow breath made of hard edges.',kind:'gather',smooth:true}
];
let css='';
function animate(name,values,smooth){
 // Duplicate the first pose at the loop boundary; steady timing with no layout writes.
 const frames=values.concat(values[0]);
 css+=`@keyframes ${name}{${frames.map((v,i)=>`${i/(frames.length-1)*100}%{${v}}`).join('')}}`;
 return `animation-name:${name};${smooth?'animation-timing-function:ease-in-out;':''}`;
}
// Legal sliding-puzzle moves, with an exact return to the initial board.
const boards=[];let board=range(9);const path=[7,6,3,0,1,2,5,8];let empty=8;
for(let loop=0;loop<7;loop++)for(const next of path){boards.push([...board]);[board[empty],board[next]]=[board[next],board[empty]];empty=next;}
function instrument(d,index,large){
 let tiles='';
 for(let i=0;i<9;i++){
  if(d.kind==='puzzle'&&i===8)continue;
  const x=(i%3)*6,y=Math.floor(i/3)*6;
  let values,base='',paper=d.kind==='negative';
  if(d.frames){values=d.frames.map(f=>`opacity:${f[i]};`);base=`opacity:${d.frames[0][i]};`;}
  else if(d.kind==='loom'){
   const row=Math.floor(i/3),col=i%3;
   values=range(8).map(f=>`transform:scale(${f===row||f===row+1?'1,.2':f===col+4||f===col+5?'.2,1':'1,1'});`);
  }else if(d.kind==='flip'){
   const phase=Math.floor(i/3)+i%3;
   values=range(10).map(f=>`transform:scaleY(${f===phase+2?.06:1});opacity:${f===phase+3?.3:1};`);
  }else if(d.kind==='puzzle'){
   values=boards.map(b=>{const at=b.indexOf(i);return `transform:translate(${at%3*6-x}px,${Math.floor(at/3)*6-y}px);`;});
  }else if(d.kind==='gather'){
   const dx=(1-i%3)*2,dy=(1-Math.floor(i/3))*2;
   values=[`transform:translate(0,0);`,`transform:translate(0,0);`,`transform:translate(${dx}px,${dy}px);`,`transform:translate(${dx}px,${dy}px);`];
  }
  const name=`tile-${index}-${i}`;
  const animation=large?`animation-name:${name};`:animate(name,values,d.smooth);
  tiles+=`<rect class="${paper?'paper ':''}${d.smooth?'smooth':''}" x="${x}" y="${y}" width="4" height="4" style="${base}${animation}"/>`;
 }
 // The decorative enlargement is excluded from accessibility; only the real marker has status semantics.
 return `<svg class="instrument live" viewBox="0 0 16 16" style="--duration:${d.kind==='puzzle'?11.2:d.duration}s" ${large?'aria-hidden="true"':'role="status" aria-label="Agent working"'}>${d.kind==='negative'?'<path fill="black" d="M0 0h16v16H0z"/>':''}${tiles}</svg>`;
}
document.querySelector('#designs').innerHTML=designs.map((d,i)=>{
 const real=instrument(d,i,false),large=instrument(d,i,true);
 return `<section class="candidate" data-id="${i+1}" aria-labelledby="name-${i}"><div class="caption"><span class="number">${String(i+1).padStart(2,'0')}</span><h2 id="name-${i}">${d.name}</h2><button class="focus" data-focus="${i+1}" aria-label="Focus ${d.name}">Focus ↗</button></div><div class="specimen"><div class="enlarged">${large}<small>3×</small></div><div class="thread"><div class="rec user"><span class="prefix">you</span><div class="body">Check the live renderer.</div></div><div class="rec agent"><span class="prefix">orb</span><div class="body"><p>I’ll trace the output path.</p><div class="marker-line">${real}<span class="outcome done">The renderer follows the busy state.</span><span class="outcome lost">Connection lost.</span></div></div></div></div></div><p class="note">${d.note}</p></section>`;
}).join('');
document.querySelector('#motions').textContent=css;
const compare=document.querySelector('#compare');
function show(id){document.querySelectorAll('.candidate').forEach(card=>card.hidden=id!==null&&card.dataset.id!==id);document.body.classList.toggle('focused',id!==null);compare.setAttribute('aria-pressed',String(id===null));}
document.querySelectorAll('[data-focus]').forEach(button=>button.addEventListener('click',()=>{show(button.dataset.focus);compare.focus();}));
compare.addEventListener('click',()=>show(null));
document.querySelector('#pause').addEventListener('click',event=>{const paused=document.body.classList.toggle('paused');event.currentTarget.setAttribute('aria-pressed',String(paused));event.currentTarget.textContent=paused?'Resume motion':'Pause motion';});
document.querySelector('#tempo').addEventListener('change',event=>document.documentElement.style.setProperty('--pace',event.target.value));
document.querySelector('#state').addEventListener('change',event=>{document.body.classList.remove('finished','disconnected');if(event.target.value!=='working')document.body.classList.add(event.target.value);});
</script>
</body>
</html>
